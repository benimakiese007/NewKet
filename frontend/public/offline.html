<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
    <title>Hors ligne - NewKet</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }
        .icon {
            width: 72px;
            height: 72px;
            margin-bottom: 24px;
            color: #9ca3af;
            opacity: 0.8;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 8px 0;
        }
        p {
            font-size: 15px;
            color: #6b7280;
            margin: 0 0 32px 0;
            max-width: 280px;
            line-height: 1.5;
        }
        button {
            background-color: #111827;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 999px; /* Rounded pill style */
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        button:hover {
            background-color: #374151;
        }
        button:active {
            transform: scale(0.97);
        }
        
        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #111827;
                color: #f9fafb;
            }
            .icon {
                color: #6b7280;
            }
            p {
                color: #9ca3af;
            }
            button {
                background-color: #f9fafb;
                color: #111827;
            }
            button:hover {
                background-color: #e5e7eb;
            }
        }
    </style>
</head>
<body>
    <!-- SVG Icon : globe with a slash -->
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4l16 16"></path>
    </svg>
    
    <h1>Oups, vous êtes hors ligne.</h1>
    <p>Vérifiez votre connexion, on garde votre place au chaud.</p>
    
    <button onclick="window.location.reload()">Réessayer</button>
</body>
</html>
