<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="512x512" href="../assets/Images/logo-newket-v2.jpeg">
    <link rel="icon" type="image/png" href="../assets/Images/logo-newket-v2.jpeg">
    <meta name="theme-color" content="#111827">
    <title>Produit &ndash; NewKet</title>
    <script type="module" src="../services/app.js"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .hero-gradient { background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #333333 100%); }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 antialiased">
    <div id="header-placeholder"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-4 md:py-6" id="main-content">
        <!-- Breadcrumbs -->
        <nav class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-8 overflow-x-auto whitespace-nowrap pb-2 sm:pb-0" id="breadcrumbs">
            <a href="/index" class="hover:text-gray-900 transition-colors">Accueil</a>
            <iconify-icon icon="solar:alt-arrow-right-linear" width="10"></iconify-icon>
            <a href="catalog" class="hover:text-gray-900 transition-colors">Catalogue</a>
            <iconify-icon icon="solar:alt-arrow-right-linear" width="10"></iconify-icon>
            <span class="text-gray-900" id="breadcrumb-current">Produit</span>
        </nav>

        <!-- Skeleton Loading Premium -->
        <div id="productSkeleton" class="block" aria-hidden="true">
            <div class="grid md:grid-cols-2 gap-12 lg:gap-20 items-start">
                <!-- Image Skeleton -->
                <div class="aspect-square bg-white rounded-3xl p-6 border border-gray-100 shadow-sm overflow-hidden">
                    <div class="skeleton skeleton-image w-full h-full rounded-2xl"></div>
                </div>
                <!-- Content Skeleton -->
                <div class="space-y-6">
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <div class="skeleton h-3 w-24 rounded-full"></div>
                            <div class="skeleton h-10 w-10 rounded-xl"></div>
                        </div>
                        <div class="skeleton h-10 w-3/4 mb-6 rounded-xl"></div>
                        <div class="skeleton h-4 w-32 mb-8 rounded-full"></div>
                        
                        <!-- Vendor Box Skeleton -->
                        <div class="bg-gray-50/80 p-4 rounded-2xl border border-gray-100 mb-8 flex items-center gap-4">
                            <div class="skeleton h-10 w-10 rounded-xl"></div>
                            <div class="flex-1 space-y-2">
                                <div class="skeleton h-2 w-16 rounded-full"></div>
                                <div class="skeleton h-3 w-32 rounded-full"></div>
                            </div>
                            <div class="skeleton h-6 w-16 rounded-full"></div>
                        </div>

                        <div class="skeleton h-8 w-40 mb-8 rounded-xl"></div>
                        <div class="space-y-3 mb-10">
                            <div class="skeleton h-3 w-full rounded-full"></div>
                            <div class="skeleton h-3 w-full rounded-full"></div>
                            <div class="skeleton h-3 w-2/3 rounded-full"></div>
                        </div>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="skeleton h-14 w-32 rounded-2xl"></div>
                        <div class="flex gap-3">
                            <div class="skeleton h-14 flex-1 rounded-2xl"></div>
                            <div class="skeleton h-14 w-14 rounded-2xl"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="productGrid" style="display:none;" class="grid md:grid-cols-2 gap-12 lg:gap-20 items-start">
            <!-- Image Section -->
            <div id="productImageCol">
                <div class="aspect-square glass-card rounded-3xl overflow-hidden group relative flex items-center justify-center p-6 hover:shadow-2xl transition-all duration-700">
                    <img id="mainImage" src="" alt="" fetchpriority="high" decoding="async" class="w-full h-full object-contain mix-blend-multiply group-hover:scale-110 transition-transform duration-1000 ease-out cursor-zoom-in" onclick="openZoom()">
                </div>
                <div class="grid grid-cols-4 gap-4 mt-6" id="thumbnailGrid"></div>
            </div>

            <!-- Details Section -->
            <div id="productDetailsCol">
                <div class="space-y-6">
                    <div>
                        <div class="flex items-center justify-between gap-4 mb-2">
                            <div id="productCategory" class="text-[10px] font-bold text-gray-500 uppercase tracking-widest font-mono">Catégorie</div>
                            <button onclick="shareProduct()" class="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center text-gray-400 hover:text-gray-900 transition-all border border-gray-100 shadow-sm hover:shadow-md">
                                <iconify-icon icon="solar:share-linear" width="20"></iconify-icon>
                            </button>
                        </div>
                        <h1 id="productName" class="text-2xl sm:text-3xl font-black text-gray-900 tracking-tight leading-[1.1] mb-4">Chargement...</h1>
                        
                        <div id="headerRating" class="flex items-center gap-4 mb-4 invisible">
                            <div class="flex gap-0.5 text-amber-400" id="headerStars"></div>
                            <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest" id="headerReviewCount">...</span>
                        </div>

                        <div id="vendorInfo" class="flex items-center gap-4 mb-8 bg-gray-50/80 p-4 rounded-2xl border border-gray-100">
                             <div class="w-10 h-10 bg-gray-900 text-white rounded-xl flex items-center justify-center font-black text-xs overflow-hidden" id="vendorAvatarDetail">V</div>
                             <div class="flex-1">
                                 <div class="text-[9px] font-bold text-gray-400 uppercase tracking-widest leading-none mb-1">Vendu par</div>
                                 <a href="#" id="vendorLink" class="text-sm font-black text-gray-900 hover:text-blue-600 transition-colors uppercase tracking-tight">Chargement...</a>
                             </div>
                             <div class="text-right">
                                 <div class="text-[9px] font-bold text-gray-400 uppercase tracking-widest leading-none mb-1">Expédition</div>
                                 <div class="text-xs font-black text-gray-900 flex items-center justify-end gap-1">
                                     <iconify-icon icon="solar:delivery-bold" class="text-green-500"></iconify-icon>
                                     <span id="shippingValue">...</span>
                                 </div>
                             </div>
                        </div>

                        <div class="flex items-baseline gap-4 mb-8">
                            <span id="productPrice" class="text-2xl font-black text-gray-900">... FC</span>
                        </div>
                        <p id="productDescription" class="text-sm leading-relaxed text-gray-500 font-medium mb-10 max-w-md">...</p>
                    </div>

                    <div class="space-y-4">
                        <div class="flex items-center gap-4 bg-white p-2 rounded-2xl border border-gray-100 shadow-sm w-fit">
                            <button onclick="updateQty(-1)" class="w-12 h-12 rounded-xl flex items-center justify-center hover:bg-gray-50 transition-colors text-gray-400 hover:text-gray-900">
                                <iconify-icon icon="solar:minus-linear" width="20"></iconify-icon>
                            </button>
                            <input type="number" id="qty-input" value="1" min="1" class="w-12 text-center font-bold text-gray-900 bg-transparent border-none outline-none">
                            <button onclick="updateQty(1)" class="w-12 h-12 rounded-xl flex items-center justify-center hover:bg-gray-50 transition-colors text-gray-400 hover:text-gray-900">
                                <iconify-icon icon="solar:add-linear" width="20"></iconify-icon>
                            </button>
                        </div>
                        <div class="flex gap-3">
                            <button id="mainOrderBtn" class="flex-1 bg-gray-900 hover:bg-black text-white py-4 rounded-2xl font-bold text-xs uppercase tracking-widest transition-all hover:-translate-y-1 shadow-lg shadow-gray-900/20 flex items-center justify-center gap-2">
                                <span>Commander</span>
                                <iconify-icon icon="solar:chat-round-call-bold" width="24"></iconify-icon>
                            </button>
                            <button id="mainWishlistBtn" class="w-12 h-12 flex items-center justify-center rounded-2xl border-2 border-gray-100 text-gray-300 hover:text-red-500 hover:border-red-50 transition-all">
                                <iconify-icon icon="solar:heart-bold" width="28"></iconify-icon>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-16 pt-12 border-t border-gray-100">
            <h2 class="text-3xl font-black text-gray-900 uppercase tracking-tighter mb-4">Avis Clients</h2>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-16" id="reviewCountText">0 avis vérifiés</p>
            <div id="reviewsList" class="space-y-12"></div>
            <div id="reviewFormContainer" class="mt-20"></div>
        </div>

        <section class="mt-16 pb-12 border-t border-gray-100 pt-12">
            <div class="flex items-center justify-between mb-12">
                <h2 class="text-3xl font-bold tracking-tight text-gray-900">Articles similaires</h2>
                <a href="catalog" class="text-sm font-bold text-gray-900 hover:underline flex items-center gap-2">
                    Voir tout <iconify-icon icon="solar:arrow-right-linear" width="18"></iconify-icon>
                </a>
            </div>
            <div id="recommendedGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-6"></div>
        </section>
    </main>

    <div id="mobile-nav-placeholder"></div>
    <div id="footer-placeholder"></div>

    <div id="zoomModal" class="fixed inset-0 z-[100] invisible opacity-0 transition-all duration-500 bg-black/95 flex items-center justify-center p-4 backdrop-blur-2xl" onclick="closeZoom()">
        <button class="absolute top-8 right-8 text-white/50 hover:text-white transition-all">
            <iconify-icon icon="solar:close-circle-bold" width="40"></iconify-icon>
        </button>
        <img id="zoomModalImg" src="" class="max-w-full max-h-[90vh] object-contain select-none" alt="Zoom">
    </div>

    <div id="stickyBar" class="fixed bottom-[72px] left-0 right-0 bg-white/95 backdrop-blur-xl border-t border-gray-100 p-4 translate-y-full transition-all duration-500 z-[40] sm:hidden shadow-2xl">
        <div class="flex items-center gap-4">
            <img id="stickyImg" src="" class="w-12 h-12 object-contain bg-gray-50 rounded-xl" alt="">
            <div class="flex-1 min-w-0">
                <div id="stickyName" class="text-[10px] font-black text-gray-900 truncate uppercase tracking-widest">...</div>
                <div id="stickyPrice" class="text-sm font-black text-gray-900">...</div>
            </div>
            <button onclick="buyFromSticky()" class="bg-gray-900 hover:bg-black text-white px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center gap-1 transition-all">
                <iconify-icon icon="solar:chat-round-call-bold" width="16"></iconify-icon> Commander
            </button>
        </div>
    </div>

    <script shadow>
        const productId = new URLSearchParams(window.location.search).get('id');
        let currentRating = 0;

        function showSkeleton() {
            document.getElementById('productSkeleton').style.display = 'block';
            document.getElementById('productGrid').style.display = 'none';
        }
        function hideSkeleton() {
            document.getElementById('productSkeleton').style.display = 'none';
            document.getElementById('productGrid').style.display = 'grid';
        }

        async function initPage() {
            showSkeleton();
            if (!productId) {
                window.location.href = 'catalog';
                return;
            }

            const p = await ProductManager.fetchProductById(productId);
            if (!p) {
                document.getElementById('main-content').innerHTML = `
                    <div class="py-32 text-center">
                        <iconify-icon icon="solar:ghost-broken" width="80" class="text-gray-200 mb-8"></iconify-icon>
                        <h1 class="text-4xl font-black text-gray-900 mb-4 tracking-tighter uppercase">Article Introuvable</h1>
                        <a href="catalog" class="inline-flex items-center gap-2 bg-gray-900 text-white px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-black transition-all">Retour au catalogue</a>
                    </div>
                `;
                return;
            }

            // Record view for analytics
            if (window.ProductManager && ProductManager.recordView) {
                ProductManager.recordView(productId);
            }

            renderProductDetails(p);
            loadReviews(p.id);
            renderRecommended(p.category);
            setupListeners(p);
            initRecentlyViewed(p);
        }

        function renderProductDetails(p) {
            hideSkeleton();
            document.getElementById('productName').textContent = p.name;
            document.getElementById('breadcrumb-current').textContent = p.name;
            document.getElementById('productCategory').textContent = p.category;
            document.getElementById('productDescription').textContent = p.description || "Aucune description disponible.";
            document.getElementById('stickyName').textContent = p.name;

            const priceStr = window.CurrencyManager ? CurrencyManager.formatPrice(p.price) : p.price + ' FC';
            document.getElementById('productPrice').textContent = priceStr;
            document.getElementById('stickyPrice').textContent = priceStr;

            const vendor = (Array.isArray(p.users) ? p.users[0] : p.users) || {};
            const shopName = vendor.company_name || vendor.name || 'Vendeur NewKet';
            const vendorLink = document.getElementById('vendorLink');
            if (vendorLink) {
                vendorLink.textContent = shopName;
                vendorLink.href = `shop?email=${p.supplier_email || ''}`;
                const avatar = document.getElementById('vendorAvatarDetail');
                if (vendor.avatar) avatar.innerHTML = `<img src="${vendor.avatar}" class="w-full h-full object-cover">`;
                else avatar.textContent = shopName.charAt(0).toUpperCase();
                document.getElementById('shippingValue').textContent = vendor.shipping_time || '24h';
            }

            const images = (p.image || '').split(',').map(img => img.trim()).filter(img => img);
            const mainImgUrl = images[0] || '../assets/Images/default.png';
            document.getElementById('mainImage').src = window.getOptimizedImageUrl ? window.getOptimizedImageUrl(mainImgUrl) : mainImgUrl;
            document.getElementById('stickyImg').src = document.getElementById('mainImage').src;

            const thumbs = document.getElementById('thumbnailGrid');
            thumbs.innerHTML = images.map((img, i) => `
                <div class="aspect-square bg-white rounded-2xl overflow-hidden cursor-pointer border-2 ${i === 0 ? 'border-gray-900' : 'border-transparent'} hover:border-gray-200 transition-all p-2 glass-card" onclick="window.changeImage('${img.replace(/'/g, "\\'")}', this)">
                    <img src="${window.getOptimizedImageUrl ? window.getOptimizedImageUrl(img, { width: 200 }) : img}" class="w-full h-full object-contain mix-blend-multiply">
                </div>
            `).join('');

            const isFav = FavoritesManager.isInFavorites(p.id);
            const favBtn = document.getElementById('mainWishlistBtn');
            favBtn.classList.toggle('text-red-500', isFav);
            favBtn.classList.toggle('border-red-50', isFav);
            favBtn.classList.toggle('bg-red-50/50', isFav);
        }

        function setupListeners(p) {
            document.getElementById('mainOrderBtn').onclick = () => {
                if (window.contactSeller) window.contactSeller(p.id, document.getElementById('mainOrderBtn'));
            };
            document.getElementById('mainWishlistBtn').onclick = () => {
                if (FavoritesManager.isInFavorites(p.id)) FavoritesManager.removeItem(p.id);
                else FavoritesManager.addItem(p);
                renderProductDetails(p);
            };
            window.addEventListener('scroll', () => {
                const btn = document.getElementById('mainOrderBtn');
                const bar = document.getElementById('stickyBar');
                if (btn && bar) {
                    const rect = btn.getBoundingClientRect();
                    if (rect.bottom < 0 && window.innerWidth < 640) bar.classList.remove('translate-y-full');
                    else bar.classList.add('translate-y-full');
                }
            });
        }

        async function loadReviews(pid) {
            try {
                const reviews = await SupabaseAdapter.fetchWithFilters('product_reviews', {
                    eq: [['product_id', pid]],
                    order: ['created_at', { ascending: false }]
                });
                const list = document.getElementById('reviewsList');
                const countText = document.getElementById('reviewCountText');
                if (!reviews || reviews.length === 0) {
                    list.innerHTML = `<div class="text-center py-24 bg-gray-50/50 rounded-[3rem] border-2 border-dashed border-gray-100 text-gray-400 font-black uppercase tracking-widest text-[10px]">Soyez le premier à donner votre avis</div>`;
                    countText.textContent = "0 avis vérifiés";
                    renderReviewForm(pid);
                    return;
                }
                const avg = reviews.reduce((acc, r) => acc + r.rating, 0) / reviews.length;
                const starsHTML = Array(5).fill(0).map((_, i) => `<iconify-icon icon="solar:star-bold" width="14" class="${i < Math.round(avg) ? 'text-amber-400' : 'text-gray-200'}"></iconify-icon>`).join('');
                document.getElementById('headerRating').classList.remove('invisible');
                document.getElementById('headerStars').innerHTML = starsHTML;
                document.getElementById('headerReviewCount').textContent = `${reviews.length} avis client${reviews.length > 1 ? 's' : ''}`;
                countText.innerHTML = `<div class="flex items-center gap-3"><div class="flex gap-0.5">${starsHTML}</div><span class="text-gray-400 font-black uppercase tracking-widest text-[10px]">${reviews.length} avis vérifiés</span></div>`;
                list.innerHTML = reviews.map(r => `
                    <div class="glass-card p-10 rounded-[2.5rem] border border-gray-100 shadow-sm hover:shadow-xl transition-all group">
                        <div class="flex items-start justify-between mb-8">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 bg-gray-900 text-white rounded-2xl flex items-center justify-center font-black text-xl uppercase">${r.user_name?.charAt(0) || '?'}</div>
                                <div><div class="font-black text-gray-900 uppercase tracking-tighter text-sm mb-1">${r.user_name || 'Anonyme'}</div><div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">${new Date(r.created_at).toLocaleDateString()}</div></div>
                            </div>
                            <div class="flex gap-0.5 bg-amber-50 px-3 py-1.5 rounded-full scale-90">${Array(5).fill(0).map((_, i) => `<iconify-icon icon="solar:star-bold" width="14" class="${i < r.rating ? 'text-amber-400' : 'text-gray-200'}"></iconify-icon>`).join('')}</div>
                        </div>
                        <p class="text-base text-gray-600 font-medium leading-relaxed italic border-l-4 border-gray-100 pl-6 capitalize-first">${r.comment}</p>
                    </div>
                `).join('');
                renderReviewForm(pid);
            } catch (e) { console.error(e); }
        }

        function renderReviewForm(pid) {
            const cont = document.getElementById('reviewFormContainer');
            if (!AuthManager.user) {
                cont.innerHTML = `<div class="bg-gray-50 rounded-[3rem] p-16 text-center border border-gray-100"><a href="login" class="inline-flex bg-gray-900 text-white px-10 py-5 rounded-2xl font-black uppercase tracking-widest text-[10px]">Se connecter pour donner mon avis</a></div>`;
                return;
            }
            cont.innerHTML = `
                <div class="hero-gradient rounded-[3rem] p-10 sm:p-16 text-white relative shadow-2xl border border-white/10">
                    <h3 class="text-3xl font-black uppercase tracking-tighter mb-8">Votre avis d'exception</h3>
                    <div class="grid lg:grid-cols-2 gap-16">
                        <div class="space-y-6">
                            <div class="flex gap-3" id="starSelector">${[1, 2, 3, 4, 5].map(i => `<iconify-icon icon="solar:star-bold" width="32" data-star="${i}" class="cursor-pointer text-white/20" onclick="window.setRating(${i})"></iconify-icon>`).join('')}</div>
                        </div>
                        <div class="space-y-6">
                            <textarea id="reviewText" placeholder="Confiez-nous votre avis..." class="w-full bg-white/5 border border-white/10 rounded-3xl p-8 text-sm outline-none text-white min-h-[160px]"></textarea>
                            <button onclick="window.submitReview('${pid}')" id="reviewSubmitBtn" class="w-full bg-white text-gray-900 font-black py-6 rounded-2xl font-black uppercase tracking-widest text-[10px]">Publier mon avis</button>
                        </div>
                    </div>
                </div>`;
        }

        window.setRating = (v) => {
            currentRating = v;
            document.querySelectorAll('#starSelector iconify-icon').forEach(s => {
                const active = parseInt(s.dataset.star) <= v;
                s.classList.toggle('text-amber-400', active);
                s.classList.toggle('text-white/20', !active);
            });
        };

        window.submitReview = async (pid) => {
            if (!currentRating) return showToast('Veuillez sélectionner une note', 'warning');
            const txt = document.getElementById('reviewText').value.trim();
            if (!txt) return showToast('Veuillez écrire un commentaire', 'warning');
            try {
                const success = await SupabaseAdapter.insert('product_reviews', { product_id: pid, user_id: AuthManager.user.id, user_name: AuthManager.user.user_metadata?.name || 'Utilisateur', rating: currentRating, comment: txt });
                if (success) { showToast('Avis publié !', 'success'); loadReviews(pid); }
            } catch (e) { showToast('Erreur', 'error'); }
        };

        function renderRecommended(cat) {
            const grid = document.getElementById('recommendedGrid');
            const pms = ProductManager.getProducts().filter(p => p.id !== productId && p.category === cat).slice(0, 4);
            grid.innerHTML = (pms.length ? pms : ProductManager.getProducts().slice(0, 4)).map(p => window.buildProductCardHTML(p)).join('');
            // ✅ Activer le lazy loading sur les images .lazy-img injectées
            if (window.initLazyImages) window.initLazyImages(grid);
        }

        window.updateQty = (val) => { const inp = document.getElementById('qty-input'); inp.value = Math.max(1, (parseInt(inp.value) || 1) + val); };
        window.changeImage = (url, el) => { document.getElementById('mainImage').src = window.getOptimizedImageUrl ? window.getOptimizedImageUrl(url) : url; document.querySelectorAll('#thumbnailGrid > div').forEach(d => d.classList.remove('border-gray-900')); el.classList.add('border-gray-900'); };
        window.openZoom = () => { document.getElementById('zoomModalImg').src = document.getElementById('mainImage').src; document.getElementById('zoomModal').classList.remove('invisible', 'opacity-0'); document.body.style.overflow = 'hidden'; };
        window.closeZoom = () => { document.getElementById('zoomModal').classList.add('invisible', 'opacity-0'); document.body.style.overflow = ''; };
        window.shareProduct = () => { if (navigator.share) navigator.share({ title: document.title, url: window.location.href }); else { navigator.clipboard.writeText(window.location.href); showToast('Lien copié !', 'info'); } };
        function initRecentlyViewed(p) { let list = JSON.parse(localStorage.getItem('newketRecentlyViewed') || '[]'); list = [p, ...list.filter(item => item.id !== p.id)].slice(0, 10); localStorage.setItem('newketRecentlyViewed', JSON.stringify(list)); }
        window.buyFromSticky = () => document.getElementById('mainOrderBtn').click();

        document.addEventListener('DOMContentLoaded', () => { if (window.newketInitialized) initPage(); else window.addEventListener('newketInitialized', initPage); });
    </script>

    <div id="confirmModal" role="dialog" aria-modal="true" class="fixed inset-0 z-[110] invisible opacity-0 transition-opacity bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl">
            <p class="text-xl font-black text-gray-900 uppercase tracking-tighter mb-4" id="confirmModalTitle">Confirmer</p>
            <p class="text-sm text-gray-500 font-medium mb-8" id="confirmModalMessage"></p>
            <div class="flex gap-3">
                <button class="flex-1 py-4 bg-gray-50 text-gray-400 font-bold rounded-xl uppercase tracking-widest text-[10px]" id="confirmModalCancel">Annuler</button>
                <button class="flex-1 py-4 bg-gray-900 text-white font-black rounded-xl uppercase tracking-widest text-[10px]" id="confirmModalOk">Confirmer</button>
            </div>
        </div>
    </div>
</body>
</html>
