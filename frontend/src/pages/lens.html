<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="512x512" href="/Images/Logo NewKet PNG.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <meta name="theme-color" content="#0f0f0f">
    <title>Recherche visuelle — NewKet Lens</title>
    <meta name="description" content="Prenez ou uploadez une photo pour trouver des produits similaires sur NewKet.">
    <script src="/vendor/iconify-icon.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0f0f0f;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header back button ─────────────────────────────────── */
        .lens-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(env(safe-area-inset-top, 0px) + 0.85rem) 1.25rem 0.85rem 1.25rem;
            background: linear-gradient(to bottom, rgba(0,0,0,.85), transparent);
        }
        .btn-back {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            opacity: 0.85;
            transition: opacity 0.2s;
        }
        .btn-back:hover { opacity: 1; }
        .lens-title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lens-title span { color: #f97316; }

        /* ── Upload zone ─────────────────────────────────────────── */
        #upload-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6rem 1.5rem 2rem;
            gap: 2rem;
            transition: opacity 0.3s ease;
        }

        .upload-icon-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(249, 115, 22, 0.08);
            border: 2px solid rgba(249, 115, 22, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse-ring 3s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .upload-icon-ring:hover {
            background: rgba(249, 115, 22, 0.15);
            border-color: rgba(249, 115, 22, 0.6);
            transform: scale(1.05);
        }
        .upload-icon-ring:active {
            transform: scale(0.96);
        }
        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
            50% { box-shadow: 0 0 0 16px rgba(249, 115, 22, 0.08); }
        }

        .upload-hint {
            text-align: center;
        }
        .upload-hint h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .upload-hint p {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* ── CTA buttons ─────────────────────────────────────────── */
        .cta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 380px;
        }
        .cta-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 1.4rem 1rem;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.2s ease;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .cta-btn:hover, .cta-btn:active {
            background: rgba(249, 115, 22, 0.12);
            border-color: rgba(249, 115, 22, 0.4);
            transform: scale(0.98);
        }
        .cta-btn.primary {
            background: #f97316;
            border-color: #f97316;
            color: #fff;
        }
        .cta-btn.primary:hover {
            background: #ea6b0f;
            border-color: #ea6b0f;
        }
        .cta-btn iconify-icon { font-size: 28px; }

        /* ── Detection zone (YOLO dots) ─────────────────────────── */
        #detection-zone {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 6rem 1.5rem 2rem;
            gap: 1.5rem;
        }
        #detection-zone.active { display: flex; }

        .detection-frame-wrap {
            position: relative;
            width: 85vw;
            max-width: 420px;
            max-height: 70vh;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .detection-photo {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            filter: brightness(0.75);
            display: block;
        }
        #dots-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .object-dot {
            position: absolute;
            width: 28px;
            height: 28px;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.15);
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, background 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            padding: 0;
        }
        .object-dot:hover, .object-dot:active {
            background: rgba(249, 115, 22, 0.5);
            border-color: #f97316;
            transform: translate(-50%, -50%) scale(1.2);
        }
        .dot-inner {
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: dot-pulse 1.8s ease-in-out infinite;
        }
        @keyframes dot-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.7); opacity: 0.6; }
        }
        .detection-hint {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            text-align: center;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .detection-hint iconify-icon { color: #f97316; }

        /* -- Fallback Pinterest-style point ------------------------------ */
        .fallback-point {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2.5px solid #fff;
            cursor: pointer;
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            animation: fallback-pulse 2s ease-in-out infinite;
            transition: transform 0.15s ease, background 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            padding: 0;
        }
        .fallback-point:hover, .fallback-point:active {
            background: rgba(249, 115, 22, 0.5);
            border-color: #f97316;
            transform: translate(-50%, -50%) scale(1.15);
        }
        .fallback-point-inner {
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
        }
        @keyframes fallback-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
            50% { box-shadow: 0 0 0 14px rgba(255,255,255,0.15); }
        }
        .fallback-hint {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.55);
            text-align: center;
            margin-top: 4px;
        }

        /* ── Scanner overlay ─────────────────────────────────────── */
        #lens-scanner {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 6rem 1.5rem 2rem;
            gap: 2rem;
        }
        #lens-scanner.active { display: flex; }
        #upload-zone.hidden { display: none; }

        .scanner-frame-wrap {
            position: relative;
            width: 85vw;
            max-width: 400px;
            aspect-ratio: 3/4;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,.6);
        }
        .scanner-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.65);
        }
        /* Corner frames */
        .scanner-corners {
            position: absolute;
            inset: 10px;
        }
        .scanner-corners::before, .scanner-corners::after,
        .scanner-corners-inner::before, .scanner-corners-inner::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: rgba(255,255,255,0.85);
            border-style: solid;
        }
        .scanner-corners::before { top:0; left:0; border-width: 3px 0 0 3px; border-top-left-radius: 12px; }
        .scanner-corners::after  { bottom:0; right:0; border-width: 0 3px 3px 0; border-bottom-right-radius: 12px; }
        .scanner-corners-inner::before { top:0; right:0; border-width: 3px 3px 0 0; border-top-right-radius: 12px; }
        .scanner-corners-inner::after  { bottom:0; left:0; border-width: 0 0 3px 3px; border-bottom-left-radius: 12px; }
        /* Laser */
        .laser-line {
            position: absolute;
            left: 0; width: 100%; height: 3px;
            background: #f97316;
            box-shadow: 0 0 16px 6px rgba(249, 115, 22, 0.45);
            animation: scan-laser 2s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }
        @keyframes scan-laser {
            0%   { top: 5%;  opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { top: 95%; opacity: 0; }
        }
        .scanner-label {
            font-size: 1rem;
            font-weight: 500;
            color: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .scanner-label iconify-icon { color: #f97316; }

        /* ── Results section ─────────────────────────────────────── */
        #results-section {
            display: none;
            flex-direction: column;
            padding: calc(env(safe-area-inset-top, 0px) + 4.5rem) 1rem 2rem;
            gap: 1rem;
        }
        #results-section.active { display: flex; }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.25rem;
        }
        .results-header h2 {
            font-size: 1rem;
            font-weight: 700;
        }
        .results-header a {
            font-size: 0.82rem;
            color: #f97316;
            text-decoration: none;
            font-weight: 500;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (min-width: 480px) {
            .results-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (min-width: 768px) {
            .results-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .result-card {
            background: #1a1a1a;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
            text-decoration: none;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .result-card:hover { transform: scale(0.98); }
        .result-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }
        .result-card-info {
            padding: 0.6rem 0.75rem;
        }
        .result-card-name {
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: rgba(255,255,255,0.85);
            margin-bottom: 2px;
        }
        .result-card-price {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f97316;
        }

        .no-results {
            text-align: center;
            padding: 2rem;
            color: rgba(255,255,255,0.4);
        }
        .no-results iconify-icon { font-size: 48px; margin-bottom: 1rem; display: block; }

        /* ── Retry button ─────────────────────────────────────────── */
        .btn-retry {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0.9rem 2rem;
            border-radius: 12px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            margin: 0 auto;
            transition: background 0.2s;
        }
        .btn-retry:hover { background: rgba(255,255,255,0.12); }

        /* -- Pastille de statut de recherche (sans emojis) -- */
        .search-status-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            padding: 6px 16px;
            margin: 0 auto 1.25rem auto;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            width: fit-content;
        }
        .search-status-pill iconify-icon {
            color: #10b981;
        }

        /* -- Skeletons loaders pour les resultats instantanes ------------ */
        .skeleton-card {
            background: #1a1a1a;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
        }
        .skeleton-img {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(90deg, #202020 25%, #2d2d2d 50%, #202020 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.4s ease-in-out infinite;
        }
        .skeleton-info {
            padding: 0.7rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .skeleton-text {
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(90deg, #202020 25%, #2d2d2d 50%, #202020 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.4s ease-in-out infinite;
        }
        .skeleton-text.title {
            width: 75%;
        }
        .skeleton-text.price {
            width: 40%;
            height: 14px;
        }
        @keyframes skeleton-shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="lens-header">
        <a class="btn-back" href="javascript:history.back()">
            <iconify-icon icon="solar:arrow-left-linear" width="20"></iconify-icon>
            Retour
        </a>
        <div class="lens-title">
            <iconify-icon icon="solar:camera-bold" width="20"></iconify-icon>
            NewKet <span>Lens</span>
        </div>
        <div style="width:60px"></div>
    </header>

    <!-- ── Upload Zone (état initial) ───────────────────────────────── -->
    <div id="upload-zone">

        <!-- Input unique — le navigateur gère nativement caméra/galerie/fichier -->
        <input type="file" id="lens-file-input" accept="image/*" style="display:none">

        <!-- Zone cliquable : icône caméra -->
        <div class="upload-icon-ring" id="upload-trigger" role="button" tabindex="0"
             aria-label="Choisir ou prendre une photo"
             onclick="document.getElementById('lens-file-input').click()"
             onkeydown="if(event.key==='Enter'||event.key===' ')document.getElementById('lens-file-input').click()">
            <iconify-icon icon="solar:camera-broken" width="52" style="color:#f97316"></iconify-icon>
        </div>

        <div class="upload-hint">
            <h1>Recherche par image</h1>
            <p>Appuyez sur l'icône pour prendre une photo<br>ou importer une image.</p>
        </div>
    </div>

    <!-- ── Detection Zone (YOLO — objets détectés) ─────────────────────── -->
    <div id="detection-zone">
        <div class="detection-frame-wrap">
            <img id="detection-photo" class="detection-photo" src="" alt="Détection en cours" />
            <div id="dots-container"></div>
        </div>
        <div class="detection-hint" id="detection-hint" style="display:none">
            <iconify-icon icon="solar:cursor-bold" width="18"></iconify-icon>
            Touchez un objet pour le rechercher
        </div>
        <div class="scanner-label" id="detection-loading">
            <iconify-icon icon="line-md:loading-twotone-loop" width="20"></iconify-icon>
            Détection des objets...
        </div>
    </div>

    <!-- ── Scanner (état scan en cours) ─────────────────────────────── -->
    <div id="lens-scanner">
        <div class="scanner-frame-wrap">
            <img id="scanner-photo" class="scanner-photo" src="" alt="Photo en cours d'analyse" />
            <div class="scanner-corners"><div class="scanner-corners-inner"></div></div>
            <div class="laser-line"></div>
        </div>
        <div class="scanner-label">
            <iconify-icon icon="line-md:loading-twotone-loop" width="20"></iconify-icon>
            Analyse visuelle en cours...
        </div>
    </div>

    <!-- ── Résultats ─────────────────────────────────────────────────── -->
    <div id="results-section">
        <div class="results-header">
            <h2 id="results-heading">Produits similaires</h2>
            <a id="see-all-link" href="/catalog?lens=true">Voir tout →</a>
        </div>
        <div id="search-status-pill" class="search-status-pill" style="display:none;">
            <iconify-icon icon="line-md:loading-twotone-loop" width="16"></iconify-icon>
            <span id="search-status-text">Analyse des formes et textures...</span>
        </div>
        <div id="results-grid" class="results-grid"></div>
        <button class="btn-retry" id="btn-retry">
            <iconify-icon icon="solar:camera-linear" width="18"></iconify-icon>
            Nouvelle recherche
        </button>
    </div>

    <script type="module">
        import { generateEmbedding, preloadModel } from '/src/services/clip-embedder.js';
        import { searchByEmbedding } from '/src/services/lens.js';

        const uploadZone       = document.getElementById('upload-zone');
        const detectionZone    = document.getElementById('detection-zone');
        const detectionPhoto   = document.getElementById('detection-photo');
        const dotsContainer    = document.getElementById('dots-container');
        const detectionHint    = document.getElementById('detection-hint');
        const detectionLoading = document.getElementById('detection-loading');
        const lensScanner      = document.getElementById('lens-scanner');
        const resultsSection   = document.getElementById('results-section');
        const scannerPhoto     = document.getElementById('scanner-photo');
        const resultsGrid      = document.getElementById('results-grid');
        const seeAllLink       = document.getElementById('see-all-link');
        const resultsHeading   = document.getElementById('results-heading');
        const searchStatusPill = document.getElementById('search-status-pill');
        const searchStatusText = document.getElementById('search-status-text');

        // Pré-chargement fantôme immédiat en arrière-plan (0 attente lors du clic)
        preloadModel();

        // URL de production (Render)
        const YOLO_URL = 'https://newket.onrender.com/analyze';

        // Pré-chauffe le serveur dès le chargement (cold start Render ~30s)
        fetch('https://newket.onrender.com/', { method: 'GET', mode: 'no-cors' }).catch(() => {});

        document.getElementById('btn-retry').addEventListener('click', () => {
            resultsSection.classList.remove('active');
            lensScanner.classList.remove('active');
            detectionZone.classList.remove('active');
            uploadZone.classList.remove('hidden');
        });

        // Input unique — caméra/galerie/fichier géré nativement par le navigateur
        document.getElementById('lens-file-input').addEventListener('change', e => {
            handleFile(e.target.files[0]);
            e.target.value = '';
        });

        async function handleFile(file) {
            if (!file) return;

            // 1. Lit l'image immédiatement pour affichage
            const dataUrl = await new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsDataURL(file);
            });

            // 2. Affiche la zone de détection avec spinner
            detectionPhoto.src = dataUrl;
            detectionHint.style.display = 'none';
            detectionLoading.style.display = 'flex';
            dotsContainer.innerHTML = '';
            uploadZone.classList.add('hidden');
            detectionZone.classList.add('active');
            if (detectionLoading) {
                detectionLoading.innerHTML = '<iconify-icon icon="line-md:loading-twotone-loop" width="20"></iconify-icon> Détection des objets...';
            }

            // Message d'attente court
            const wakeTimer = setTimeout(() => {
                if (detectionLoading) {
                    detectionLoading.innerHTML = '<iconify-icon icon="line-md:loading-twotone-loop" width="20"></iconify-icon> Analyse rapide...';
                }
            }, 3000);

            try {
                // 3. Appel YOLO (timeout 6s max pour une réactivité instantanée)
                const formData = new FormData();
                formData.append('file', file);
                const yoloRes = await fetch(YOLO_URL, {
                    method: 'POST',
                    body: formData,
                    signal: AbortSignal.timeout(6000)
                });
                clearTimeout(wakeTimer);
                if (!yoloRes.ok) throw new Error(`YOLO HTTP ${yoloRes.status}`);
                const { objects } = await yoloRes.json();
                if (!objects || objects.length === 0) {
                    // 0 objets YOLO -> fallback Pinterest
                    console.info('[Lens] YOLO: 0 objets, fallback Pinterest');
                    detectionLoading.style.display = 'none';
                    renderFallbackPoint(file, dataUrl);
                    return;
                }

                // 4. Affiche les points sur l'image
                detectionLoading.style.display = 'none';
                renderDots(objects, file, dataUrl);

            } catch (err) {
                clearTimeout(wakeTimer);
                // Fallback Pinterest immédiat si YOLO est lent (>6s) ou indisponible
                console.warn('[Lens] YOLO lent (>6s) ou indisponible, fallback Pinterest instantané');
                detectionLoading.style.display = 'none';
                renderFallbackPoint(file, dataUrl);
            }
        }

        /**
         * Fallback Pinterest : affiche un point blanc central cliquable
         * quand YOLO ne du00e9tecte aucun objet (timeout ou 0 ru00e9sultats).
         */
        function renderFallbackPoint(file, dataUrl) {
            detectionHint.style.display = 'none';
            dotsContainer.innerHTML = '';

            const btn = document.createElement('button');
            btn.className = 'fallback-point';
            btn.innerHTML = '<span class="fallback-point-inner"></span>';
            btn.title = 'Rechercher cette image';
            btn.addEventListener('click', () => {
                detectionZone.classList.remove('active');
                searchWholeImage(file, dataUrl);
            });
            dotsContainer.appendChild(btn);

            // Hint sous l'image
            const hint = document.createElement('div');
            hint.className = 'fallback-hint';
            hint.textContent = 'Touchez le point pour rechercher';
            detectionHint.style.display = 'none';
            const hintContainer = detectionZone.querySelector('.fallback-hint');
            if (hintContainer) hintContainer.remove();
            detectionZone.appendChild(hint);
        }

        function renderDots(objects, file, dataUrl) {
            detectionHint.style.display = 'flex';
            dotsContainer.innerHTML = '';

            const img = detectionPhoto;
            const placeDots = () => {
                const naturalW = img.naturalWidth  || 1;
                const naturalH = img.naturalHeight || 1;
                const rect     = img.getBoundingClientRect();
                const scaleX   = rect.width  / naturalW;
                const scaleY   = rect.height / naturalH;

                objects.forEach(obj => {
                    const dot = document.createElement('button');
                    dot.className = 'object-dot';
                    dot.style.left  = `${obj.center.x * scaleX}px`;
                    dot.style.top   = `${obj.center.y * scaleY}px`;
                    dot.title = obj.label;
                    dot.innerHTML = `<span class="dot-inner"></span>`;
                    dot.addEventListener('click', () => onDotClick(obj, file, dataUrl));
                    dotsContainer.appendChild(dot);
                });
            };

            if (img.complete && img.naturalWidth > 0) { placeDots(); }
            else { img.onload = placeDots; }
        }

        /** Affiche immediatement des cartes skeletons chatoyantes (0ms de temps percu) */
        function renderSkeletons(count = 6) {
            resultsGrid.innerHTML = Array(count).fill(0).map(() => `
                <div class="skeleton-card">
                    <div class="skeleton-img"></div>
                    <div class="skeleton-info">
                        <div class="skeleton-text title"></div>
                        <div class="skeleton-text price"></div>
                    </div>
                </div>
            `).join('');
            resultsSection.classList.add('active');
        }

        let searchStepTimer = null;

        function startSearchUI() {
            renderSkeletons(6);
            if (resultsHeading) resultsHeading.textContent = 'Produits similaires';
            if (searchStatusPill && searchStatusText) {
                searchStatusPill.style.display = 'inline-flex';
                searchStatusText.textContent = 'Analyse des formes et textures...';
            }
            if (searchStepTimer) clearTimeout(searchStepTimer);
            searchStepTimer = setTimeout(() => {
                if (searchStatusText) searchStatusText.textContent = 'Recherche dans les boutiques NewKet...';
            }, 1800);
        }

        function endSearchUI() {
            if (searchStepTimer) clearTimeout(searchStepTimer);
            if (searchStatusPill) searchStatusPill.style.display = 'none';
        }

        async function fetchPopularFallback() {
            try {
                const supabaseUrl = 'https://kuygjocnnlvjtoaquicq.supabase.co';
                const supabaseAnon = 'sb_publishable_iMlPI6QIA0U0qqRfLp5_WA_-443VkDx';
                const res = await fetch(`${supabaseUrl}/rest/v1/products?select=id,name,image,price&is_archived=eq.false&limit=12&order=pinned.desc,rating.desc`, {
                    headers: { 'apikey': supabaseAnon, 'Authorization': `Bearer ${supabaseAnon}` }
                });
                if (!res.ok) throw new Error('Erreur fallback');
                return await res.json();
            } catch (e) {
                return [];
            }
        }

        async function executeSearchWithSafety(searchTask) {
            startSearchUI();

            // Timeout de sécurité réseau à 7 secondes (filet de sécurité)
            let timedOut = false;
            const timeoutPromise = new Promise((_, reject) => {
                setTimeout(() => {
                    timedOut = true;
                    reject(new Error('TIMEOUT_SAFETY'));
                }, 7000);
            });

            try {
                const results = await Promise.race([searchTask(), timeoutPromise]);
                endSearchUI();
                return results;
            } catch (err) {
                endSearchUI();
                if (err.message === 'TIMEOUT_SAFETY' || timedOut) {
                    console.warn('[Lens] Délai réseau de 7s dépassé, chargement de la sélection');
                    if (resultsHeading) resultsHeading.textContent = 'Sélection du moment';
                    return await fetchPopularFallback();
                }
                throw err;
            }
        }

        async function onDotClick(obj, file, dataUrl) {
            detectionZone.classList.remove('active');

            try {
                const results = await executeSearchWithSafety(async () => {
                    const croppedBlob = await cropImage(file, obj.box);
                    const vector      = await generateEmbedding(croppedBlob);
                    return await searchByEmbedding(vector);
                });

                sessionStorage.setItem('lensResults', JSON.stringify(results));
                sessionStorage.setItem('lensScanImage', dataUrl);
                seeAllLink.href = '/catalog?q=Recherche+visuelle&lens=true';
                renderResults(results);
            } catch (err) {
                console.error('[Lens dot]', err);
                resultsGrid.innerHTML = `
                    <div class="no-results" style="grid-column:1/-1">
                        <iconify-icon icon="solar:sad-circle-linear"></iconify-icon>
                        Impossible d'analyser cet objet.<br>
                        <small style="color:rgba(255,255,255,.3)">${err.message}</small>
                    </div>`;
            }
        }

        async function searchWholeImage(file, dataUrl) {
            detectionZone.classList.remove('active');

            try {
                const results = await executeSearchWithSafety(async () => {
                    const vector  = await generateEmbedding(file);
                    return await searchByEmbedding(vector);
                });

                sessionStorage.setItem('lensResults', JSON.stringify(results));
                sessionStorage.setItem('lensScanImage', dataUrl);
                seeAllLink.href = '/catalog?q=Recherche+visuelle&lens=true';
                renderResults(results);
            } catch (err) {
                console.error('[Lens fallback]', err);
                resultsGrid.innerHTML = `
                    <div class="no-results" style="grid-column:1/-1">
                        <iconify-icon icon="solar:sad-circle-linear"></iconify-icon>
                        Impossible d'analyser cette image.<br>
                        <small style="color:rgba(255,255,255,.3)">${err.message}</small>
                    </div>`;
            }
        }

        /** Recadre un File sur une bounding box et retourne un Blob JPEG. */
        function cropImage(file, box) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = ev => {
                    const img = new Image();
                    img.onload = () => {
                        const x = Math.max(0, box.xmin);
                        const y = Math.max(0, box.ymin);
                        const w = Math.min(img.width  - x, box.xmax - box.xmin);
                        const h = Math.min(img.height - y, box.ymax - box.ymin);
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, x, y, w, h, 0, 0, w, h);
                        canvas.toBlob(b => b ? resolve(b) : reject(new Error('Crop échoué')), 'image/jpeg', 0.92);
                    };
                    img.onerror = reject;
                    img.src = ev.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function renderResults(products) {
            lensScanner.classList.remove('active');
            if (!products || products.length === 0) {
                resultsGrid.innerHTML = `
                    <div class="no-results" style="grid-column:1/-1">
                        <iconify-icon icon="solar:magnifer-linear"></iconify-icon>
                        Aucun produit similaire trouvé.<br>
                        <small style="color:rgba(255,255,255,.3)">Essayez avec une autre photo.</small>
                    </div>`;
                resultsSection.classList.add('active');
                return;
            }
            resultsGrid.innerHTML = products.slice(0, 12).map(p => {
                const img   = (p.image || '').split('||')[0].split(',')[0] || '/Images/placeholder.jpg';
                const price = new Intl.NumberFormat('fr-CD').format(p.price || 0);
                const url   = `/product?id=${p.id}`;
                return `
                    <a class="result-card" href="${url}">
                        <img src="${img}" alt="${p.name}" loading="lazy" onerror="this.src='/Images/placeholder.jpg'">
                        <div class="result-card-info">
                            <div class="result-card-name">${p.name}</div>
                            <div class="result-card-price">${price} FC</div>
                        </div>
                    </a>`;
            }).join('');
            resultsSection.classList.add('active');
        }
    </script>
  <div id="footer-placeholder"></div>
