    <script>
        let currentProducts = [];
        let currentShopName = '';
        let currentShopEmail = '';
        let currentShopSlug = '';

        function getShopCacheKey({ email = '', shopSlug = '' } = {}) {
            const normalizedEmail = String(email || '').trim().toLowerCase();
            const normalizedSlug = String(shopSlug || '').trim().toLowerCase();
            const identity = normalizedEmail || normalizedSlug;
            return identity ? `newket_shop_cache:${identity}` : null;
        }

        function readCachedShop(cacheKey) {
            if (!cacheKey) return null;
            try {
                const raw = localStorage.getItem(cacheKey);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                return parsed && typeof parsed === 'object' ? parsed : null;
            } catch {
                return null;
            }
        }

        function writeCachedShop(cacheKey, vendor, products = [], ratingAvg = null) {
            if (!cacheKey || !vendor) return;
            try {
                localStorage.setItem(cacheKey, JSON.stringify({
                    company_name: vendor.company_name || '',
                    name: vendor.name || '',
                    email: vendor.email || '',
                    avatar: vendor.avatar || '',
                    cover_image: vendor.cover_image || '',
                    shipping_time: vendor.shipping_time || '',
                    date_joined: vendor.date_joined || '',
                    shop_slug: vendor.shop_slug || '',
                    rating_avg: ratingAvg,
                    products: Array.isArray(products) ? products.slice(0, 12) : []
                }));
            } catch {
                // no-op
            }
        }

        function applyVendorHero(vendor, fallbackShopSlug = '') {
            if (!vendor) return;

            const shopName = vendor.company_name || vendor.name || 'Boutique sans nom';
            currentShopName = shopName;
            currentShopEmail = vendor.email || currentShopEmail;
            currentShopSlug = vendor.shop_slug || fallbackShopSlug || currentShopSlug;

            const vendorNameEl = document.getElementById('vendorName');
            const vendorAvatarEl = document.getElementById('vendorAvatar');
            const vendorMetaEl = document.getElementById('vendorMeta');
            const shippingEl = document.getElementById('vendor-shipping-value');
            const heroEl = document.querySelector('.vendor-hero');

            if (vendorNameEl) {
                vendorNameEl.innerHTML = `
                    <span class="inline-flex items-center gap-2 flex-wrap">
                        <span class="align-middle">${shopName}</span>
                        ${vendor.seller_type === 'certified' ? '<iconify-icon icon="solar:verified-check-bold" class="text-blue-500 align-middle shrink-0" width="28" title="Vendeur Pro"></iconify-icon>' : ''}
                    </span>
                `;
            }
            if (vendorAvatarEl) {
                vendorAvatarEl.src = vendor.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(shopName)}&background=f3f4f6&color=000&bold=true`;
            }

            const joinDate = vendor.date_joined
                ? new Date(vendor.date_joined).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })
                : 'récemment';
            if (vendorMetaEl) {
                vendorMetaEl.innerHTML = `<iconify-icon icon="solar:calendar-outline"></iconify-icon> Membre depuis ${joinDate}`;
            }

            document.title = `${shopName} à NewKet`;

            if (heroEl && vendor.cover_image) {
                heroEl.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), url('${vendor.cover_image}')`;
                heroEl.style.backgroundSize = 'cover';
                heroEl.style.backgroundPosition = 'center';
            }

            if (shippingEl && vendor.shipping_time) {
                shippingEl.textContent = vendor.shipping_time;
            }
        }

        function renderCachedShop(cacheData) {
            if (!cacheData || !Array.isArray(cacheData.products) || cacheData.products.length === 0) return false;

            currentProducts = cacheData.products;
            const sortSelect = document.getElementById('sortProducts');
            const sortMode = sortSelect ? sortSelect.value : 'newest';
            renderProducts(sortProducts(currentProducts, sortMode));

            if (cacheData.rating_avg) {
                const ratingEl = document.getElementById('vendor-rating-value');
                if (ratingEl) ratingEl.textContent = cacheData.rating_avg;
            }
            return true;
        }

        function getOrCreateSessionId() {
            try {
                const key = 'newket_session_id';
                const existing = localStorage.getItem(key);
                if (existing && existing.length >= 12) return existing;
                const id = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`.slice(0, 64);
                localStorage.setItem(key, id);
                return id;
            } catch (e) {
                return null;
            }
        }

        function recordShopViewOncePerDay(vendorId) {
            try {
                if (!vendorId || !window.ApiClient) return;
                const sessionId = getOrCreateSessionId();
                const dayKey = new Date().toISOString().slice(0, 10);
                const dedupeKey = `newket_shop_viewed:${vendorId}:${dayKey}`;
                if (localStorage.getItem(dedupeKey)) return;
                localStorage.setItem(dedupeKey, '1');

                window.ApiClient.post('/analytics/shop-view', {
                    vendor_id: vendorId,
                    session_id: sessionId
                }).catch(() => {});
            } catch (e) {
                // no-op
            }
        }

        function safeNumber(v) {
            const n = Number(v);
            return Number.isFinite(n) ? n : 0;
        }

        function sortProducts(products, sortMode) {
            const copy = [...(products || [])];
            switch (sortMode) {
                case 'price_asc':
                    copy.sort((a, b) => safeNumber(a.price) - safeNumber(b.price));
                    break;
                case 'price_desc':
                    copy.sort((a, b) => safeNumber(b.price) - safeNumber(a.price));
                    break;
                case 'name_asc':
                    copy.sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'fr', { sensitivity: 'base' }));
                    break;
                case 'newest':
                default:
                    copy.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
                    break;
            }
            return copy;
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            const noProducts = document.getElementById('noProductsMsg');
            const countEl = document.getElementById('productCount');
            const pluralEl = document.getElementById('productPlural');
            if (!grid || !noProducts || !countEl) return;

            const list = products || [];
            countEl.textContent = list.length;
            if (pluralEl) pluralEl.textContent = list.length > 1 ? 's' : '';
            document.getElementById('vendor-items-count').textContent = list.length;

            if (list.length === 0) {
                grid.innerHTML = '';
                noProducts.classList.remove('hidden');
                return;
            }

            noProducts.classList.add('hidden');
            const vendorSummary = {
                company_name: currentShopName,
                name: currentShopName,
                avatar: document.getElementById('vendorAvatar')?.getAttribute('src') || ''
            };

            grid.innerHTML = list.map((p, index) => {
                const productWithVendor = {
                    ...p,
                    users: p.users || vendorSummary
                };
                return typeof window.buildProductCardHTML === 'function'
                    ? window.buildProductCardHTML(productWithVendor, {
                        animationClass: 'animate-fade-in',
                        delay: `${index * 0.05}s`,
                        imageLoading: index < 2 ? 'eager' : 'lazy',
                        prioritizeImage: index < 2,
                        prioritizeAvatar: index < 2
                    })
                    : '';
            }).join('');

            if (typeof window.initLazyImages === 'function') {
                window.initLazyImages(grid);
            }
        }

        async function loadShopData() {
            if (!window.SupabaseAdapter || !window.ApiClient || typeof window.buildProductCardHTML !== 'function') {
                setTimeout(loadShopData, 50);
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            const shopQuery = urlParams.get('shop');

            const getShopSlugFromPath = () => {
                try {
                    const path = window.location.pathname || '';
                    const m = path.match(/\/boutique\/([^/]+)(?:\/NewKet)?\/?$/i);
                    if (!m) return null;
                    return decodeURIComponent(m[1] || '').trim() || null;
                } catch {
                    return null;
                }
            };

            const rawShopSlug = (shopQuery || getShopSlugFromPath() || '').trim() || null;
            const shopSlug = rawShopSlug
                ? rawShopSlug.replace(/_Shop_NewKet$/i, '').trim()
                : null;
            const shopCacheKey = getShopCacheKey({ email, shopSlug });

            if (!email && !shopSlug) {
                location.href = window.resolvePath('shops');
                return;
            }

            currentShopEmail = email || '';

            const cachedVendor = readCachedShop(shopCacheKey);
            if (cachedVendor) {
                applyVendorHero(cachedVendor, shopSlug || '');
                renderCachedShop(cachedVendor);
            }

            try {
                let vendor = null;
                if (email) {
                    vendor = await window.SupabaseAdapter.fetchWithFilters('users', {
                        eq: [['email', email]],
                        single: true
                    });
                } else if (shopSlug) {
                    const exactMatch = await window.SupabaseAdapter.fetchWithFilters('users', {
                        eq: [['role', 'supplier'], ['shop_slug', shopSlug]],
                        limit: 1,
                        skipCache: true
                    });
                    const exactList = Array.isArray(exactMatch) ? exactMatch : (exactMatch ? [exactMatch] : []);
                    vendor = exactList[0] || null;

                    if (!vendor) {
                        const prettyName = shopSlug.replace(/_/g, ' ').trim();
                        const safeLike = prettyName.replace(/%/g, '').slice(0, 80);
                        const candidates = await window.SupabaseAdapter.fetchWithFilters('users', {
                            eq: [['role', 'supplier']],
                            or: `company_name.ilike.%${safeLike}%,name.ilike.%${safeLike}%`,
                            limit: 25,
                            skipCache: true
                        });
                        const list = Array.isArray(candidates) ? candidates : (candidates ? [candidates] : []);
                        const buildSlug = (name) => {
                            try {
                                return window.NewKetLinks?.buildShopSlug ? window.NewKetLinks.buildShopSlug(name) : null;
                            } catch {
                                return null;
                            }
                        };
                        vendor =
                            list.find(v => buildSlug(v?.company_name || v?.name || '')?.toLowerCase() === shopSlug.toLowerCase())
                            || list[0]
                            || null;
                    }
                    if (vendor?.email) currentShopEmail = vendor.email;
                }

                if (!vendor) {
                    if (window.showToast) showToast('Boutique introuvable', 'error');

                    document.querySelector('main').innerHTML = `
                        <div class="py-20 text-center">
                            <iconify-icon icon="solar:shop-broken" width="64" class="text-gray-300 mb-6"></iconify-icon>
                            <h1 class="text-3xl font-black text-gray-900 mb-4 tracking-tighter uppercase">Boutique Introuvable</h1>
                            <p class="text-gray-500 mb-8 max-w-md mx-auto">La boutique que vous recherchez n'existe pas ou n'est plus disponible sur NewKet.</p>
                            <a href="/src/pages/shops.html" class="bg-gray-900 text-white px-8 py-3 rounded-xl font-bold hover:bg-black transition-colors inline-block uppercase tracking-wider text-sm">Voir toutes les boutiques</a>
                        </div>
                    `;
                    document.querySelector('.vendor-hero').style.display = 'none';
                    return;
                }

                applyVendorHero(vendor, shopSlug || '');
                writeCachedShop(shopCacheKey, vendor, currentProducts, document.getElementById('vendor-rating-value')?.textContent || null);
                recordShopViewOncePerDay(vendor.id);

                const products = await window.SupabaseAdapter.fetchWithFilters('products', {
                    eq: [['supplier_email', currentShopEmail]],
                    order: ['created_at', { ascending: false }],
                    skipCache: true
                });

                currentProducts = products || [];
                const sortSelect = document.getElementById('sortProducts');
                const sortMode = sortSelect ? sortSelect.value : 'newest';
                renderProducts(sortProducts(currentProducts, sortMode));

                const productIds = currentProducts.map(p => p.id);
                if (productIds.length > 0) {
                    const reviews = await window.SupabaseAdapter.fetchWithFilters('product_reviews', {
                        in: [['product_id', productIds]],
                        select: 'rating',
                        skipCache: true
                    });

                    if (reviews && reviews.length > 0) {
                        const sum = reviews.reduce((acc, r) => acc + (parseInt(r.rating) || 0), 0);
                        const avg = (sum / reviews.length).toFixed(1);
                        document.getElementById('vendor-rating-value').textContent = avg;
                    } else {
                        document.getElementById('vendor-rating-value').textContent = '-';
                    }
                }
            } catch (err) {
                console.error('Error loading shop:', err);
                location.href = window.resolvePath('shops');
            }
        }

        window.NewKetPageRefresh = async function () {
            await loadShopData();
        };

        async function shareShopLink() {
            const url = (window.NewKetLinks && window.NewKetLinks.buildShopShareUrl)
                ? window.NewKetLinks.buildShopShareUrl({ shopName: currentShopName, shopSlug: currentShopSlug })
                : window.location.href;

            try {
                if (navigator.share) {
                    await navigator.share({ title: `${currentShopName} — NewKet`, url });
                    return;
                }
            } catch {
            }

            const ok = window.NewKetLinks?.copyTextToClipboard ? await window.NewKetLinks.copyTextToClipboard(url) : false;
            if (window.showToast) showToast(ok ? 'Lien copié !' : 'Copie impossible', ok ? 'info' : 'error');
        }

        function orderProduct(id) {
            if (window.contactSeller) {
                window.contactSeller(id, window.event ? window.event.target.closest('button') : null);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Product cards: event delegation (avoids inline onclick and escaping bugs)
            const grid = document.getElementById('productsGrid');
            if (grid && !grid.dataset.clickBound) {
                grid.dataset.clickBound = '1';
                grid.addEventListener('click', (e) => {
                    const orderBtn = e.target.closest('.order-button');
                    if (orderBtn) {
                        e.preventDefault();
                        e.stopPropagation();
                        const id = orderBtn.getAttribute('data-order-product-id');
                        if (id) orderProduct(id);
                        return;
                    }

                    const card = e.target.closest('.product-card');
                    if (!card) return;
                    const encodedUrl = card.getAttribute('data-product-url') || '';
                    const url = encodedUrl ? decodeURIComponent(encodedUrl) : '';
                    if (!url) return;
                    location.href = url;
                });
            }

            const sortSelect = document.getElementById('sortProducts');
            if (sortSelect) {
                sortSelect.addEventListener('change', () => {
                    renderProducts(sortProducts(currentProducts, sortSelect.value));
                });
            }

            loadShopData();

            // Listen for currency changes to refresh prices
            window.addEventListener('currencyChanged', () => {
                loadShopData(); // Easy re-render
            });
        });
    </script>

</body>

</html>
