<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>504 - Délai d'attente dépassé | NewKet</title>
    <meta name="description" content="Le serveur a mis trop de temps à répondre. Veuillez patienter un instant ou réessayer.">
    <meta name="robots" content="noindex, nofollow">

    <!-- NewKet Brand Identity -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="512x512" href="/Images/Logo NewKet PNG.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="theme-color" content="#2e2e2e">

    <!-- Tailwind CSS CDN -->
    <link rel="stylesheet" href="/src/assets/css/input.css">
    <!-- Iconify -->
    <script src="/vendor/iconify-preload.js"></script>
    <script src="/vendor/iconify-icon.min.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/assets/css/style.css">
    <link rel="stylesheet" href="/src/assets/css/responsive.css">

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        @keyframes pulse-amber {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.82; transform: scale(0.98); }
        }
        .pulse-anim { animation: pulse-amber 3s ease-in-out infinite; }
        
        @keyframes shine {
            0% { transform: translateX(-100%) skewX(-15deg); }
            100% { transform: translateX(200%) skewX(-15deg); }
        }
        .animate-shine { animation: shine 3s infinite; }
    </style>
    <script type="module" src="/src/services/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-6 bg-[radial-gradient(circle_at_bottom_right,_#fffbeb_0%,_#ffffff_100%)]">

    <div class="max-w-xl w-full text-center relative">
        <!-- Decoration -->
        <div class="absolute -top-24 -right-24 w-64 h-64 bg-amber-100 rounded-full blur-3xl opacity-40 -z-10"></div>
        <div class="absolute -bottom-24 -left-24 w-64 h-64 bg-orange-100 rounded-full blur-3xl opacity-30 -z-10"></div>

        <!-- Logo -->
        <a href="/" class="inline-block mb-12">
            <span class="text-3xl font-black tracking-tighter text-gray-900">NEWKET</span>
        </a>

        <!-- 504 Display -->
        <div class="relative inline-block mb-8 pulse-anim">
            <h1 class="text-[120px] sm:text-[180px] font-black text-amber-500 leading-none tracking-tighter">504</h1>
        </div>

        <!-- Content -->
        <div class="space-y-4 mb-10">
            <h2 class="text-2xl sm:text-3xl font-bold text-gray-900">Le serveur prend plus de temps que prévu</h2>
            <p class="text-gray-500 text-base leading-relaxed">
                Le délai d'attente est dépassé. Cela arrive généralement lors d'une connexion instable ou d'une forte affluence sur la marketplace.
            </p>
        </div>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <button onclick="window.location.reload()" class="bg-amber-500 text-white font-bold px-10 py-4 rounded-2xl hover:bg-amber-600 transition-all shadow-2xl shadow-amber-500/20 flex items-center justify-center gap-2 group overflow-hidden relative">
                <div class="absolute inset-0 bg-white/20 -translate-x-full group-hover:animate-shine pointer-events-none"></div>
                <iconify-icon icon="solar:refresh-bold" width="20"></iconify-icon>
                Réessayer maintenant
            </button>
            <a href="/" class="bg-white text-gray-950 font-bold px-10 py-4 rounded-2xl border border-gray-200 hover:border-gray-950 transition-all flex items-center justify-center gap-2">
                <iconify-icon icon="solar:home-bold" width="20"></iconify-icon>
                Retour Accueil
            </a>
        </div>

        <!-- Contact Support -->
        <div class="mt-16 pt-8 border-t border-gray-100 flex flex-wrap justify-center gap-x-8 gap-y-4">
            <a href="/support" class="inline-flex items-center gap-2 text-sm font-bold text-gray-900 hover:text-amber-600 transition-colors">
                <iconify-icon icon="solar:chat-round-dots-bold" width="18"></iconify-icon>
                Contacter le Support NewKet
            </a>
            <a href="/faq" class="text-xs font-bold uppercase tracking-widest text-gray-400 hover:text-gray-900 transition-colors self-center">FAQ</a>
        </div>
    </div>

    <!-- Copyright -->
    <div class="mt-auto py-8 text-[10px] font-bold uppercase tracking-[0.3em] text-gray-400">
        © 2026 NEWKET — L'Expérience Luxe
    </div>

</body>
</html>
