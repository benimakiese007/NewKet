    <script>
        // PREMIUM AUTH SHIELD
        // Prevents content flash by hiding body until AuthManager is ready.
        // Hard fail-safe: always unhide after a short timeout, even if any JS init fails.
        document.documentElement.classList.add('auth-loading');
        window.setTimeout(() => {
            document.documentElement.classList.remove('auth-loading');
        }, 2500);
        window.addEventListener('load', () => {
            document.documentElement.classList.remove('auth-loading');
        }, { once: true });
    </script>

    <style>
        body {
            background-color: #ffffff;
        }

        .floating-input:focus-within label,
        .floating-input input:not(:placeholder-shown)+label {
            transform: translateY(-14px) scale(0.75);
            font-weight: 800;
            color: #000;
        }

        .split-image {
            position: sticky;
            top: 0;
            height: 100%;
            align-self: flex-start;
        }

        .split-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.8) 100%);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }

        .loader-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }

        .social-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -4px rgba(0, 0, 0, 0.12);
        }

        .social-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Google button branded hover */
        #google-btn:hover {
            border-color: #4285F4 !important;
            background: #fafbff !important;
        }

        /* Passkey button hover */
        #passkey-btn:hover {
            border-color: #000 !important;
            background: #f9f9f9 !important;
        }

        /* Facebook button hover */
        #facebook-btn:hover {
            border-color: #1877F2 !important;
            background: #f0f5ff !important;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-text-fill-color: #111827 !important;
            caret-color: #111827;
            box-shadow: 0 0 0 1000px #f9fafb inset !important;
            -webkit-box-shadow: 0 0 0 1000px #f9fafb inset !important;
            transition: background-color 9999s ease-in-out 0s;
        }

        /* Input valid state */
        .input-valid {
            border-color: #22c55e !important;
            background-color: #f0fdf4 !important;
        }

        .tab-btn {
            position: relative;
            transition: color 0.2s ease;
        }

        .tab-btn::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2.5px;
            background: #000;
            border-radius: 2px;
            transform: scaleX(0);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: left;
        }

        .tab-btn.active::after {
            transform: scaleX(1);
        }

        .tab-btn.active {
            color: #000 !important;
        }

        /* Submit button premium glow */
        #submitBtn {
            position: relative;
            overflow: hidden;
        }

        #submitBtn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #submitBtn:hover::before {
            opacity: 1;
        }

        #submitBtn:hover {
            background: #111 !important;
            box-shadow: 0 20px 40px -8px rgba(0,0,0,0.35) !important;
            transform: translateY(-1px);
        }

        #submitBtn:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 4px 12px -2px rgba(0,0,0,0.2) !important;
        }

        /* Forgot password hover */
        #forgotPasswordBtn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: gap 0.2s ease, opacity 0.2s ease;
        }

        #forgotPasswordBtn:hover {
            opacity: 0.7;
            gap: 6px;
        }

        /* OR divider premium */
        .auth-divider-text {
            background: linear-gradient(90deg, transparent, white 20%, white 80%, transparent);

        /* Role card icon fix */
        .role-card input:checked ~ div .role-icon {
            background: #000;
            color: #fff;

        /* Loading Shield Styles */

            position: absolute;
            inset: 0;
            background: white;
            z-index: 50;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        html.auth-loading #globalAuthLoader {
            display: flex;
        }

        body {
            transition: opacity 0.4s ease;

    <!-- Ensure Toast logic is available (normally in main.js, but we need it here if main.js loads late) -->

    <script>
        // --- 1. GSAP Intros ---
        function revealLoginContentFallback() {
            document.body.style.opacity = '';
            document.body.style.pointerEvents = '';
            document.querySelectorAll('.animate-item').forEach((el) => {
                el.style.opacity = '1';
                el.style.transform = 'none';
            });
            const form = document.getElementById('authForm');
            if (form) {
                form.style.opacity = '1';
                form.style.transform = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const gsap = window.gsap;
            if (gsap) {
                gsap.to("#bgImage", { scale: 1, duration: 10, ease: "power1.out" });

                const tl = gsap.timeline();
                tl.from("#heroContent > *:not(#statsContainer)", { opacity: 0, y: 30, stagger: 0.1, duration: 0.8, ease: "power2.out", delay: 0.2 })

        // --- 4. Password Strength Logic ---
        function getEmailLocalPart() {
            const emailVal = emailInput?.value || '';
            return emailVal.split('@')[0].toLowerCase().trim();
        }

        function evaluatePassword(val) {
            const localPart = getEmailLocalPart();
            const lower = val.toLowerCase();

            // Disqualifying conditions (force Faible regardless of other criteria)
            const tooShort      = val.length < 8;
            const allDigits     = /^\d+$/.test(val);
            const sameAsEmail   = val.toLowerCase() === (emailInput?.value || '').toLowerCase();
            const sameAsLocal   = localPart.length > 2 && lower === localPart;
            const containsLocal = localPart.length > 3 && lower.includes(localPart);
            const commonPwds    = ['password','motdepasse','123456789','12345678','newket','azerty','qwerty','abcdefgh'];
            const isCommon      = commonPwds.includes(lower);

            const blocked = tooShort || allDigits || sameAsEmail || sameAsLocal || containsLocal || isCommon;

            // Criteria (each adds 1 point)
            const hasLower   = /[a-z]/.test(val);
            const hasUpper   = /[A-Z]/.test(val);
            const hasDigit   = /[0-9]/.test(val);
            const hasSpecial = /[^A-Za-z0-9]/.test(val);
            const hasLength  = val.length >= 8;
            const hasLong    = val.length >= 12;

            let score = 0;
            if (hasLength)  score++;
            if (hasLong)    score++;
            if (hasLower)   score++;
            if (hasUpper)   score++;
            if (hasDigit)   score++;
            if (hasSpecial) score++;

            // Determine label
            let blockReason = '';
            if (sameAsEmail || sameAsLocal)    blockReason = 'Trop similaire à l\'email';
            else if (containsLocal)            blockReason = 'Contient votre identifiant';
            else if (allDigits)                blockReason = 'Que des chiffres';
            else if (isCommon)                 blockReason = 'Mot de passe trop courant';
            else if (tooShort)                 blockReason = 'Trop court (8 min)';

            return { score, blocked, blockReason, hasLower, hasUpper, hasDigit, hasSpecial, hasLength };
        }

        pwdInput.addEventListener('input', (e) => {
            if (isLogin) return;
            const val = e.target.value;
            const bars = document.querySelectorAll('.strength-bar');
            const feedback = document.getElementById('passwordFeedback');

            bars.forEach(b => b.className = 'strength-bar w-1/4 h-full bg-gray-100 rounded-full transition-colors duration-300');

            if (val.length === 0) {
                feedback.textContent = '';
                return;
            }

            const { score, blocked, blockReason } = evaluatePassword(val);

            if (blocked) {
                bars[0].classList.replace('bg-gray-100', 'bg-red-500');
                feedback.textContent = blockReason || 'Invalide';
                feedback.className = 'text-[9px] font-black uppercase tracking-widest text-red-500 text-right';
                return;
            }

            if (score <= 3) {
                bars[0].classList.replace('bg-gray-100', 'bg-red-500');
                feedback.textContent = 'Faible';
                feedback.className = 'text-[9px] font-black uppercase tracking-widest text-red-500 text-right';
            } else if (score === 4) {
                bars[0].classList.replace('bg-gray-100', 'bg-orange-400');
                bars[1].classList.replace('bg-gray-100', 'bg-orange-400');
                feedback.textContent = 'Moyen';
                feedback.className = 'text-[9px] font-black uppercase tracking-widest text-orange-400 text-right';
            } else if (score === 5) {
                bars[0].classList.replace('bg-gray-100', 'bg-yellow-400');
                bars[1].classList.replace('bg-gray-100', 'bg-yellow-400');
                bars[2].classList.replace('bg-gray-100', 'bg-yellow-400');
                feedback.textContent = 'Bon';
                feedback.className = 'text-[9px] font-black uppercase tracking-widest text-yellow-500 text-right';
            } else {
                bars.forEach(b => b.classList.replace('bg-gray-100', 'bg-green-500'));

                feedback.className = 'text-[9px] font-black uppercase tracking-widest text-green-500 text-right';

        // --- 5. Form Submission ---

        function showError(msg) {
            formError.textContent = msg;
            formError.classList.remove('hidden');

            const gsap = window.gsap;

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            formError.classList.add('hidden');
            if (formSuccess) formSuccess.classList.add('hidden');

            const email = document.getElementById('email').value.trim();
            const password = pwdInput.value;
            const normalizedEmail = email.toLowerCase().trim();
            const normalizedPassword = password.trim().toLowerCase();

            if (window.newketConfig?.maintenanceMode === true) {
                const adminEmails = window.newketConfig.adminEmails || [];
                const isUserAdmin = adminEmails.map(e => e.toLowerCase()).includes(normalizedEmail);
                if (!isUserAdmin) {
                    showError("Le site est en maintenance. Seuls les administrateurs peuvent se connecter.");
                    if (formSuccess) formSuccess.classList.add('hidden');
                    return;
                }
            }

            // Form Validations
            if (!isRecovery && !email) {
                showError("Veuillez remplir l'email.");
                return;
            }
            if (!password) {
                showError("Veuillez renseigner le mot de passe.");
                return;
            }

            if (!isLogin && !isRecovery && normalizedPassword === normalizedEmail) {
                showError("Le mot de passe ne peut pas être identique à l'email.");
                return;
            }

            if (!isLogin || isRecovery) {
                const confirm = document.getElementById('confirmPassword').value;
                if (password !== confirm) {
                    showError("Les mots de passe ne correspondent pas.");
                    return;
                }

                // — Règles de sécurité du mot de passe —
                const { blocked, blockReason, hasLower, hasUpper, hasDigit, hasSpecial, hasLength } = evaluatePassword(password);

                if (!hasLength) {
                    showError("Le mot de passe doit contenir au moins 8 caractères.");
                    return;
                }
                if (!hasLower) {
                    showError("Le mot de passe doit contenir au moins une minuscule.");
                    return;
                }
                if (!hasUpper) {
                    showError("Le mot de passe doit contenir au moins une majuscule.");
                    return;
                }
                if (!hasDigit) {
                    showError("Le mot de passe doit contenir au moins un chiffre.");
                    return;
                }
                if (!hasSpecial) {
                    showError("Le mot de passe doit contenir au moins un caractère spécial (!, @, #, $…).");
                    return;
                }
                if (blocked) {
                    showError(blockReason || "Ce mot de passe n'est pas autorisé.");
                    return;
                }
            }

            if (!isLogin && !isRecovery) {
                const termsCheckbox = document.getElementById('termsCheckbox');
                if (termsCheckbox && !termsCheckbox.checked) {
                    showError("Vous devez accepter les conditions d'utilisation et la politique de confidentialité.");
                    return;
                }
            }

            setBtnLoading(true);

            try {
                if (isRecovery) {
                    // RECOVERY Logic
                    const { error } = await supabaseClient.auth.updateUser({ password: password });
                    if (error) throw error;

                    if (typeof showToast !== 'undefined') showToast("Mot de passe mis à jour avec succès !", "success");

                    setTimeout(() => {
                        window.location.hash = ''; // Remove the hash
                        window.location.reload();
                    }, 1500);

                } else if (isLogin) {
                    // LOGIN Logic - All authentication via Supabase Auth
                    let loginEmail = email.toLowerCase().trim();

                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email: loginEmail, password });
                    if (error) throw error;

                    if (rememberMeInput?.checked) {
                        localStorage.setItem(rememberedEmailKey, loginEmail);
                    } else {
                        localStorage.removeItem(rememberedEmailKey);
                    }

                    // AuthManager.handleSessionUpdate will handle the redirect via onAuthStateChange
                    // but we can also trigger it manually for speed if needed.
                    if (typeof showToast !== 'undefined') showToast("Connexion réussie...", "success");
                    return;

                } else {
                    // SIGNUP Logic
                    let role = document.querySelector('input[name="role"]:checked').value;
                    const adminEmails = await getRuntimeAdminEmails(true);
                    if (adminEmails.includes(email.toLowerCase().trim().toLowerCase())) {
                        role = 'admin';
                    }

                    // Determine initial status: customers are approved immediately, suppliers must go through KYC
                    const initialStatus = (role === 'customer' || role === 'admin') ? 'approved' : 'pending';
                    const referralCode = localStorage.getItem('newketReferralCode') || '';

                    const { data, error } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: {
                            data: {
                                full_name: email.split('@')[0],
                                role,
                                status: initialStatus,
                                referral_code_from: referralCode || null
                            }
                        }
                    });

                    if (error) throw error;

                    if (typeof showToast !== 'undefined') showToast("Inscription réussie ! Bienvenue.", "success");

                    if (role === 'customer') {
                        localStorage.setItem('newketWelcomeBonus', 'true');
                        if (typeof PromoManager !== 'undefined') PromoManager.addPromo('BIENVENUE', 'percent', 0.05, 1);
                        // Customers are immediately active
                        finalizeAuth(data?.user || { user_metadata: { role, status: 'approved' } }, email);
                    } else if (role === 'supplier') {
                        localStorage.setItem('newketSupplierBonus', 'true');
                        localStorage.setItem('newketRole', role);
                        localStorage.setItem('newketUserEmail', email);
                        localStorage.setItem('newketUserStatus', 'pending');
                        // Suppliers must complete KYC form before accessing dashboard
                        if (typeof showToast !== 'undefined') showToast("Complétez votre profil vendeur pour continuer.", "info");
                        setTimeout(() => {
                            window.location.href = window.resolvePath('pages/seller-onboarding');
                        }, 1000);
                    } else {
                        finalizeAuth(data?.user || { user_metadata: { role } }, email);
                    }
                }
            } catch (err) {
                console.error("Auth Error:", err);
                let msg = err.message;
                if (isLogin) {
                    msg = "Identifiant Incorrect";
                } else {
                    if (msg.includes("User already registered")) msg = "Cet utilisateur existe déjà.";
                }
                showError(msg);
            } finally {
                setBtnLoading(false);
            }
        });

        // Redirect based on role
        async function finalizeAuth(user, email) {
            if (typeof showToast !== 'undefined') showToast("Authentification réussie", "success");

            let role = user?.user_metadata?.role || null;
            const adminEmails = await getRuntimeAdminEmails(true);
            if (adminEmails.includes(String(email || '').trim().toLowerCase())) role = 'admin';

            if (!role) {
                localStorage.removeItem('newketRole');
                localStorage.removeItem('newketUserStatus');
                localStorage.removeItem('newketRoleSelectionConfirmed');
                localStorage.setItem('newketPendingRoleChoice', 'true');
                window.location.href = window.resolvePath('choose-role');
                return;
            }

            const userStatus = user?.user_metadata?.status || localStorage.getItem('newketUserStatus') || null;

            localStorage.setItem('newketUserEmail', email);
            if (rememberMeInput?.checked) {
                localStorage.setItem(rememberedEmailKey, email);
            } else {
                localStorage.removeItem(rememberedEmailKey);
            }
            localStorage.setItem('newketRole', role);
            localStorage.setItem('newketRoleSelectionConfirmed', 'true');
            if (userStatus) localStorage.setItem('newketUserStatus', userStatus);

            setTimeout(async () => {
                if (role === 'admin') {
                    window.location.href = window.resolvePath('pages/admin/index');
                } else if (role === 'supplier') {
                    // Fetch real status from DB for accurate redirection
                    let status = userStatus;
                    if (window.supabaseClient) {
                        try {
                            const { data } = await window.supabaseClient
                                .from('users').select('status').eq('email', email).maybeSingle();
                            status = data?.status || status || 'pending';
                            localStorage.setItem('newketUserStatus', status);
                        } catch(e) { status = status || 'pending'; }
                    }
                    // 'pending' = never filled the form -> go to onboarding
                    // 'submitted' = form submitted, waiting for admin review -> show waiting screen
                    // 'approved' = validated -> go to vendor dashboard
                    if (status === 'pending') {
                        window.location.href = window.resolvePath('pages/seller-onboarding');
                    } else {
                        window.location.href = window.resolvePath('pages/vendor-dashboard');
                    }
                } else {
                    window.location.href = window.resolvePath('index');
                }
            }, 800);
        }

        // --- 6. Oauth Logic ---
        async function signInWithProvider(provider) {
            const btn = document.getElementById('google-btn');
            const icon = document.getElementById('google-icon');
            const spinner = document.getElementById('google-spinner');

            // UI feedback
            if (btn) btn.disabled = true;
            if (icon) icon.classList.add('hidden');
            if (spinner) spinner.classList.remove('hidden');

            if (window.newketConfig?.maintenanceMode === true) {
                showError("L'accès rapide est désactivé pendant la maintenance. Veuillez utiliser votre email administrateur.");
                if (btn) btn.disabled = false;
                if (icon) icon.classList.remove('hidden');
                if (spinner) spinner.classList.add('hidden');
                return;
            }

            try {
                localStorage.removeItem('newketRole');
                localStorage.removeItem('newketUserStatus');
                // Le rôle sera choisi sur la page dédiée après le retour OAuth
                // Le choix Acheteur/Vendeur du formulaire n'est pas utilisé ici
                localStorage.setItem('newketPendingRoleChoice', 'true');
            } catch (_) {}

            try {
                const { data, error } = await supabaseClient.auth.signInWithOAuth({
                    provider: provider,
                    options: {
                        redirectTo: window.location.origin + '/'
                    }
                });
                if (error) throw error;
                // Redirect will be handled by browser
            } catch (e) {
                console.error("OAuth Error:", e);
                try {
                    localStorage.removeItem('newketPendingRoleChoice');
                } catch (_) {}
                showError(`Erreur lors de la connexion via ${provider}.`);

                // Reset UI
                if (btn) btn.disabled = false;
                if (icon) icon.classList.remove('hidden');
                if (spinner) spinner.classList.add('hidden');
            }
        }

        function signInWithGoogle() { signInWithProvider('google'); }
        function signInWithFacebook() { signInWithProvider('facebook'); }

        async function signInWithPasskey() {
            const icon = document.getElementById('passkey-icon');
            const spinner = document.getElementById('passkey-spinner');
            icon.style.display = 'none';
            spinner.classList.remove('hidden');

            if (window.newketConfig?.maintenanceMode === true) {
                showError("L'accès rapide est désactivé pendant la maintenance. Veuillez utiliser votre email administrateur.");
                icon.style.display = 'block';
                spinner.classList.add('hidden');
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signInWithPasskey();
                if (error) throw error;
                if (typeof showToast !== 'undefined') showToast("Connexion réussie...", "success");
            } catch (err) {
                console.error('Passkey login error:', err);
                let msg = err.message || "Erreur de connexion par clé d'accès.";
                if (msg.includes('cancelled') || msg.includes('cancel')) {
                    msg = "Connexion annulée.";
                }
                showError(msg);
            } finally {
                btnText.style.display = 'block';
                icon.style.display = 'block';
                spinner.classList.add('hidden');
            }
        }
        function handleForgotPassword() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showError("Veuillez entrer votre email dans le champ puis cliquer sur 'Oublié ?'.");
                return;
            }
            const btn = document.getElementById('forgotPasswordBtn');
            const originalText = btn.innerHTML;
            btn.textContent = "Envoi...";
            btn.style.pointerEvents = "none";

            supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + window.resolvePath('pages/reset-password'),
            }).then(({ error }) => {
                btn.innerHTML = originalText;
                btn.style.pointerEvents = "auto";
                if (error) {
                    showError("Erreur. L'email est-il correct ?");
                } else {
                    showSuccessMsg("Email de réinitialisation envoyé avec succès.");
                }
            });
        }

        async function loadPublicUserStats() {
            const countEl = document.getElementById('activeMembersCount');
            const labelEl = document.getElementById('activeMembersLabel');

            if (!countEl || !labelEl || !window.ApiClient) return;

            try {
                const stats = await window.ApiClient.get('/users/public-stats', {
                    suppressNetworkError: true
                });

                const totalUsers = Number(stats?.totalUsers);
                if (!Number.isFinite(totalUsers) || totalUsers < 0) {
                    throw new Error('Invalid public user stats payload');
                }

                const displayCount = totalUsers >= 10 ? '+' + (Math.floor(totalUsers / 10) * 10) : totalUsers.toLocaleString('fr-FR');
                countEl.textContent = displayCount;
                labelEl.textContent = totalUsers > 1 ? 'Utilisateurs' : 'Utilisateur';

                if (stats?.recentAvatars && Array.isArray(stats.recentAvatars)) {
                    const avatarContainer = document.getElementById('avatarContainer');
                    const activeMembersCount = document.getElementById('activeMembersCount');
                    if (avatarContainer && activeMembersCount) {
                        // Clear any existing images
                        avatarContainer.querySelectorAll('img').forEach(img => img.remove());
                        
                        // Insert new images
                        stats.recentAvatars.forEach((avatarUrl) => {
                            if (avatarUrl) {
                                const img = document.createElement('img');
                                img.loading = 'lazy';
                                img.width = 40;
                                img.height = 40;
                                img.className = 'w-10 h-10 rounded-full border-2 border-black object-cover';
                                img.src = avatarUrl;
                                img.alt = 'User';
                                avatarContainer.insertBefore(img, activeMembersCount);
                            }
                        });
                    }
                }

                // Show the stats container
                const statsContainerEl = document.getElementById('statsContainer');
                if (statsContainerEl) {
                    statsContainerEl.classList.remove('opacity-0');
                }

            } catch (error) {
                console.warn('[Login] Impossible de charger le total utilisateurs:', error);
            }
        }

        if (window.ApiClient) {
            loadPublicUserStats();
        } else {
            window.addEventListener('newketInitialized', loadPublicUserStats);
        }

        // --- UX: Inline Validation ---
        function validateInput(input, type) {
            let errorMsg = '';
            if (type === 'email') {
                const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!input.value) errorMsg = 'L\'adresse email est requise.';
                else if (!regex.test(input.value)) errorMsg = 'Format d\'email invalide.';
            } else if (type === 'password') {
                if (!input.value) errorMsg = 'Le mot de passe est requis.';
                else if (isLogin && input.value.length < 6) errorMsg = 'Au moins 6 caractères.';
                else if (!isLogin) {
                    const { blocked, hasLower, hasUpper, hasDigit, hasSpecial, hasLength } = evaluatePassword(input.value);
                    if (!hasLength) errorMsg = 'Au moins 8 caractères.';
                    else if (!hasLower) errorMsg = 'Au moins une minuscule.';
                    else if (!hasUpper) errorMsg = 'Au moins une majuscule.';
                    else if (!hasDigit) errorMsg = 'Au moins un chiffre.';
                    else if (!hasSpecial) errorMsg = 'Au moins un caractère spécial.';
                    else if (blocked) errorMsg = 'Mot de passe non autorisé.';
                }
            } else if (type === 'confirmPassword' && !isLogin) {
                const passFieldVal = document.getElementById('password').value;
                if (!input.value) errorMsg = 'La confirmation est requise.';
                else if (input.value !== passFieldVal) errorMsg = 'Les mots de passe ne correspondent pas.';
            }

            let errorSpan = input.parentNode.querySelector('.inline-error');
            if (errorMsg) {
                input.classList.add('border-red-500');
                input.classList.remove('border-transparent');
                if (!errorSpan) {
                    errorSpan = document.createElement('span');
                    errorSpan.className = 'inline-error text-red-500 text-[10px] font-bold block mt-1 ml-2';
                    input.parentNode.appendChild(errorSpan);
                }
                errorSpan.textContent = errorMsg;
            } else {
                input.classList.remove('border-red-500');
                input.classList.add('border-transparent');
                if (errorSpan) errorSpan.remove();
            }
        }

        const emailField = document.getElementById('email');
        const passField = document.getElementById('password');
        
        if (emailField) {
            emailField.addEventListener('blur', () => validateInput(emailField, 'email'));
            emailField.addEventListener('input', () => {
                if(emailField.classList.contains('border-red-500')) validateInput(emailField, 'email');
            });
        }
        if (passField) {
            passField.addEventListener('blur', () => validateInput(passField, 'password'));
            passField.addEventListener('input', () => {
                if(passField.classList.contains('border-red-500')) validateInput(passField, 'password');
                // Re-validate confirm password field in real time if it has content
                if (!isLogin && confPassField && confPassField.value) {
                    validateInput(confPassField, 'confirmPassword');
                    if (confPassField.value === passField.value) {
                        confPassField.classList.add('input-valid');
                    } else {
                        confPassField.classList.remove('input-valid');
                    }
                }
            });
        }
        const confPassField = document.getElementById('confirmPassword');
        if (confPassField) {
            confPassField.addEventListener('blur', () => {
                validateInput(confPassField, 'confirmPassword');
                if (!isLogin && confPassField.value && confPassField.value === passField.value) {
                    confPassField.classList.add('input-valid');
                } else {
                    confPassField.classList.remove('input-valid');
                }
            });
            confPassField.addEventListener('input', () => {
                if(confPassField.classList.contains('border-red-500')) validateInput(confPassField, 'confirmPassword');
                if (!confPassField.value || confPassField.value !== passField.value) confPassField.classList.remove('input-valid');
            });
        }
    </script>
