<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="512x512" href="/Images/Logo NewKet PNG.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="theme-color" content="#013220">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NewKet">
    <title>Journal d'Activites | NewKet Admin</title>
    <script>
        (function () {
            try {
                const params = new URLSearchParams(window.location.search);
                if (params.get('embedded') === '1') {
                    document.documentElement.classList.add('admin-embedded-mode');
                }
            } catch (_) {}
        })();
    </script>
    <link rel="stylesheet" href="/src/assets/css/input.css">
    <script src="/vendor/iconify-preload.js"></script>
    <script src="/vendor/iconify-icon.min.js"></script><script type="module" src="/src/services/app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/assets/css/style.css">
    <link rel="stylesheet" href="/src/assets/css/responsive.css">
    <link rel="stylesheet" href="/src/assets/css/admin.css">
</head>

<body class="text-gray-900 bg-[#f8fafc]">
    <div id="adminNavbarPlaceholder"></div>

    <div class="admin-shell max-w-[1800px] mx-auto px-4 sm:px-8 flex flex-col lg:flex-row gap-8">
        <div id="adminSidebarPlaceholder"></div>
        <script type="module" src="/src/services/admin-layout.js"></script>

        <!-- Main Content -->
        <main class="flex-1 min-w-0 space-y-8">
            <div class="admin-page-header flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 animate-premium">
                <div class="admin-page-header__content">
                    <h1 class="admin-page-title text-4xl font-black tracking-tight text-gray-900" id="pageTitle">Journal d'Activités</h1>
                    <p class="text-gray-500 font-medium">Historique détaillé de toutes les actions sur la plateforme.</p>
                </div>
                <div class="admin-page-actions flex items-center gap-3 w-full sm:w-auto">
                    <button onclick="refreshActivities()" data-track-action="admin_activities:refresh_click"
                        class="bg-white border border-gray-100 text-black px-4 py-3.5 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-gray-50 transition-all flex items-center gap-2 shadow-sm shrink-0">
                        <iconify-icon icon="solar:refresh-circle-bold-duotone" width="18"></iconify-icon>
                        Actualiser
                    </button>
                    <button onclick="exportActivitiesToCSV()" data-track-action="admin_activities:export_csv_click"
                        class="bg-black text-white px-6 py-3.5 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-gray-800 transition-all flex items-center gap-2 shadow-2xl shadow-black/20 shrink-0">
                        <iconify-icon icon="solar:download-bold-duotone" width="18"></iconify-icon>
                        Exporter
                    </button>
                </div>
            </div>

            <div class="glass-panel overflow-hidden animate-premium stagger-1">
                <div class="overflow-x-auto">
                    <table class="premium-table w-full">
                        <thead>
                            <tr>
                                <th>Date/Heure</th>
                                <th>Description de l'action</th>
                                <th>Priorité / Type</th>
                            </tr>
                        </thead>
                        <tbody id="activitiesBody">
                            <tr>
                                <td colspan="3" class="p-6">
                                    <div class="space-y-6">
                                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                            <div class="glass-panel p-5 space-y-3">
                                                <div class="skeleton skeleton-text" style="width:34%;height:12px;margin:0;"></div>
                                                <div class="skeleton skeleton-title" style="width:58%;height:26px;margin:0;"></div>
                                                <div class="skeleton skeleton-text" style="width:76%;height:12px;margin:0;"></div>
                                            </div>
                                            <div class="glass-panel p-5 space-y-3">
                                                <div class="skeleton skeleton-text" style="width:28%;height:12px;margin:0;"></div>
                                                <div class="skeleton skeleton-title" style="width:46%;height:26px;margin:0;"></div>
                                                <div class="skeleton skeleton-text" style="width:68%;height:12px;margin:0;"></div>
                                            </div>
                                            <div class="glass-panel p-5 space-y-3">
                                                <div class="skeleton skeleton-text" style="width:30%;height:12px;margin:0;"></div>
                                                <div class="skeleton skeleton-title" style="width:52%;height:26px;margin:0;"></div>
                                                <div class="skeleton skeleton-text" style="width:72%;height:12px;margin:0;"></div>
                                            </div>
                                            <div class="glass-panel p-5 space-y-3">
                                                <div class="skeleton skeleton-text" style="width:26%;height:12px;margin:0;"></div>
                                                <div class="skeleton skeleton-title" style="width:40%;height:26px;margin:0;"></div>
                                                <div class="skeleton skeleton-text" style="width:64%;height:12px;margin:0;"></div>
                                            </div>
                                        </div>
                                        <div class="glass-panel p-6 space-y-4">
                                            <div class="flex items-center justify-between gap-4">
                                                <div class="skeleton skeleton-title" style="width:30%;height:18px;margin:0;"></div>
                                                <div class="skeleton skeleton-text" style="width:18%;height:12px;margin:0;"></div>
                                            </div>
                                            <div class="space-y-3">
                                                <div class="skeleton skeleton-card" style="height:72px;margin:0;"></div>
                                                <div class="skeleton skeleton-card" style="height:72px;margin:0;"></div>
                                                <div class="skeleton skeleton-card" style="height:72px;margin:0;"></div>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div id="emptyState" class="hidden p-20 text-center">
                    <div class="w-20 h-20 bg-gray-50 rounded-3xl flex items-center justify-center mx-auto mb-6">
                        <iconify-icon icon="solar:history-bold-duotone" class="text-gray-200" width="48"></iconify-icon>
                    </div>
                    <p class="text-gray-400 font-bold">Aucune activité enregistrée pour le moment.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        function renderActivitiesSkeleton() {
            const tbody = document.getElementById('activitiesBody');
            const emptyState = document.getElementById('emptyState');
            if (emptyState) emptyState.classList.add('hidden');
            if (!tbody) return;

            tbody.innerHTML = `
                <tr>
                    <td colspan="3" class="p-6">
                        <div class="space-y-6">
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                <div class="glass-panel p-5 space-y-3">
                                    <div class="skeleton skeleton-text" style="width:34%;height:12px;margin:0;"></div>
                                    <div class="skeleton skeleton-title" style="width:58%;height:26px;margin:0;"></div>
                                    <div class="skeleton skeleton-text" style="width:76%;height:12px;margin:0;"></div>
                                </div>
                                <div class="glass-panel p-5 space-y-3">
                                    <div class="skeleton skeleton-text" style="width:28%;height:12px;margin:0;"></div>
                                    <div class="skeleton skeleton-title" style="width:46%;height:26px;margin:0;"></div>
                                    <div class="skeleton skeleton-text" style="width:68%;height:12px;margin:0;"></div>
                                </div>
                                <div class="glass-panel p-5 space-y-3">
                                    <div class="skeleton skeleton-text" style="width:30%;height:12px;margin:0;"></div>
                                    <div class="skeleton skeleton-title" style="width:52%;height:26px;margin:0;"></div>
                                    <div class="skeleton skeleton-text" style="width:72%;height:12px;margin:0;"></div>
                                </div>
                                <div class="glass-panel p-5 space-y-3">
                                    <div class="skeleton skeleton-text" style="width:26%;height:12px;margin:0;"></div>
                                    <div class="skeleton skeleton-title" style="width:40%;height:26px;margin:0;"></div>
                                    <div class="skeleton skeleton-text" style="width:64%;height:12px;margin:0;"></div>
                                </div>
                            </div>
                            <div class="glass-panel p-6 space-y-4">
                                <div class="flex items-center justify-between gap-4">
                                    <div class="skeleton skeleton-title" style="width:30%;height:18px;margin:0;"></div>
                                    <div class="skeleton skeleton-text" style="width:18%;height:12px;margin:0;"></div>
                                </div>
                                <div class="space-y-3">
                                    <div class="skeleton skeleton-card" style="height:72px;margin:0;"></div>
                                    <div class="skeleton skeleton-card" style="height:72px;margin:0;"></div>
                                    <div class="skeleton skeleton-card" style="height:72px;margin:0;"></div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            `;
        }

        function renderActivities() {
            const tbody = document.getElementById('activitiesBody');
            const emptyState = document.getElementById('emptyState');
            
            if (!window.ActivityManager) {
                renderActivitiesSkeleton();
                return;
            }

            if (ActivityManager._fetchPromise) {
                renderActivitiesSkeleton();
                return;
            }
            const activities = ActivityManager.getActivities();

            if (!activities || activities.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            tbody.innerHTML = activities.map((act, i) => {
                const date = act.time ? new Date(act.time) : new Date();
                const timeStr = ActivityManager.formatTime(act.time || new Date().toISOString());
                const fullDate = date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                
                let iconStr = 'solar:info-circle-bold-duotone';
                let colorClass = 'text-gray-500';
                
                const textLower = (act.text || '').toLowerCase();
                if (textLower.includes('paiement') || textLower.includes('commande') || textLower.includes('achats')) {
                    iconStr = 'solar:wallet-money-bold-duotone'; colorClass = 'text-green-500';
                } else if (textLower.includes('alerte') || textLower.includes('stock') || textLower.includes('erreur')) {
                    iconStr = 'solar:danger-triangle-bold-duotone'; colorClass = 'text-red-500';
                } else if (textLower.includes('notification') || textLower.includes('email')) {
                    iconStr = 'solar:bell-bing-bold-duotone'; colorClass = 'text-blue-500';
                } else if (textLower.includes('admin') || textLower.includes('système')) {
                    iconStr = 'solar:shield-keyhole-bold-duotone'; colorClass = 'text-purple-500';
                }

                return `
                <tr class="group animate-premium" style="animation-delay: ${i * 0.05}s">
                    <td class="p-4 w-48 align-top">
                        <div class="font-black text-gray-900">${timeStr}</div>
                        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-1">${fullDate}</div>
                    </td>
                    <td class="p-4">
                        <div class="flex items-start gap-4">
                            <div class="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center shrink-0">
                                <iconify-icon icon="${iconStr}" width="22" class="${colorClass}"></iconify-icon>
                            </div>
                            <div>
                                <span class="font-bold text-gray-800 leading-snug block">${act.text}</span>
                                ${act.id ? `<span class="text-[10px] font-black uppercase text-gray-300 tracking-tighter block mt-2 opacity-0 group-hover:opacity-100 transition-opacity">ID: ${act.id}</span>` : ''}
                            </div>
                        </div>
                    </td>
                    <td class="p-4 w-40 align-top">
                        <div class="badge-premium bg-gray-50 text-gray-600 uppercase tracking-widest text-[10px]">
                            ${act.type || 'Système'}
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        async function refreshActivities() {
            if (window.ActivityManager) {
                if (window.showToast) showToast('Actualisation...', 'info');
                await ActivityManager.init(true);
                renderActivities();
                if (window.showToast) showToast('Journal actualisé !', 'success');
            }
        }

        function exportActivitiesToCSV() {
            if (!window.ActivityManager) return;
            const activities = ActivityManager.getActivities();
            if (!activities || activities.length === 0) {
                if (window.showToast) showToast('Aucune donnée à exporter.', 'info');
                return;
            }

            const headers = ['Date/Heure', 'Type', 'Description'];
            const rows = activities.map(act => [
                act.time || '',
                act.type || 'Système',
                act.text || ''
            ]);

            const filename = `newket-activities-${new Date().toISOString().split('T')[0]}.csv`;
            if (window.NewKetCsv?.download) {
                window.NewKetCsv.download(filename, headers, rows);
            } else {
                const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                link.click();
            }
            if (window.showToast) showToast('Exportation CSV générée !', 'success');
        }

        function initPage() {
            if (window.ActivityManager) {
                renderActivitiesSkeleton();
                ActivityManager.init().then(() => renderActivities());
                window.addEventListener('activitiesUpdated', renderActivities);
            } else {
                renderActivitiesSkeleton();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.newketInitialized) {
                initPage();
            } else {
                window.addEventListener('newketInitialized', initPage);
            }
        });
    </script>
</body>
</html>
