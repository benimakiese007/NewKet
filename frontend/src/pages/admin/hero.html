<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/api/manifest">
    <meta name="theme-color" content="#064734">
    <title>HERO | NewKet Admin</title>
    <script>
        (function () {
            try {
                const params = new URLSearchParams(window.location.search);
                if (params.get('embedded') === '1') {
                    document.documentElement.classList.add('admin-embedded-mode');
                }
            } catch (_) { }
        })();
    </script>
    <link rel="stylesheet" href="/src/assets/css/input.css">
    <script src="/vendor/iconify-preload.js"></script>
    <script src="/vendor/iconify-icon.min.js"></script>
    <script type="module" src="/src/services/app.js"></script>
    <script type="module" src="/src/services/hero-content-manager.js"></script>
    <script type="module" src="/src/services/admin-hero.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/assets/css/style.css">
    <link rel="stylesheet" href="/src/assets/css/responsive.css">
    <link rel="stylesheet" href="/src/assets/css/admin.css">
</head>

<body class="text-gray-900 bg-[#f8fafc]">
    <div id="adminNavbarPlaceholder"></div>

    <div class="admin-shell max-w-[1800px] mx-auto px-4 sm:px-8 flex flex-col lg:flex-row gap-8">
        <div id="adminSidebarPlaceholder"></div>
        <script type="module" src="/src/services/admin-layout.js"></script>

        <main class="flex-1 min-w-0 space-y-10 px-4 sm:px-6 lg:px-8">
            <div class="admin-page-header flex flex-col sm:flex-row justify-between items-start sm:items-end gap-6 animate-premium">
                <div class="admin-page-header__content">
                    <h1 class="admin-page-title text-4xl font-black tracking-tight text-gray-900">HERO (Accueil)</h1>
                    <p class="text-gray-500 font-medium">Gère les images de transition, les textes et la carte promo de la section HERO.</p>
                </div>
                <div id="heroSaveStatus"
                    class="hidden flex items-center gap-3 px-6 py-3 bg-green-50 text-green-600 rounded-2xl text-[10px] font-black uppercase tracking-widest border border-green-100 shadow-xl shadow-green-500/10">
                    <iconify-icon icon="solar:check-circle-bold-duotone" width="20"></iconify-icon>
                    Enregistré
                </div>
            </div>

            <section class="glass-panel p-10 space-y-10 animate-premium">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-slate-50 text-slate-800 rounded-3xl flex items-center justify-center shadow-inner">
                        <iconify-icon icon="solar:gallery-wide-bold-duotone" width="32"></iconify-icon>
                    </div>
                    <div>
                        <h3 class="font-black text-xl text-gray-900">Contenu & Slides</h3>
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Accueil • HERO</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="space-y-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-2">Titre ligne 1</label>
                            <input id="heroTitleLine1Input" type="text" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-bold" placeholder="SUBTILE">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-2">Titre ligne 2</label>
                            <input id="heroTitleLine2Input" type="text" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-bold" placeholder="ÉLÉGANCE.">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-2">Description</label>
                            <textarea id="heroDescriptionInput" rows="4" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-medium resize-y" placeholder="Texte HERO..."></textarea>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-2">CTA 1 (Label)</label>
                                <input id="heroPrimaryCtaLabel" type="text" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-bold" placeholder="Découvrir">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-2">CTA 1 (Lien)</label>
                                <input id="heroPrimaryCtaHref" type="text" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-mono text-sm" placeholder="/src/pages/catalog.html">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-2">CTA 2 (Label)</label>
                                <input id="heroSecondaryCtaLabel" type="text" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-bold" placeholder="Vendre">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-2">CTA 2 (Lien)</label>
                                <input id="heroSecondaryCtaHref" type="text" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-mono text-sm" placeholder="/src/pages/publish.html">
                            </div>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-2">Promo (headline)</label>
                                <input id="heroPromoHeadlineInput" type="text" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-black" placeholder="-50%">
                            </div>
                            <div class="space-y-2 md:col-span-2">
                                <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-2">Promo (caption)</label>
                                <input id="heroPromoCaptionInput" type="text" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-bold" placeholder="Sélection Premium">
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-2">Promo (code)</label>
                            <input id="heroPromoCodeInput" type="text" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-mono text-sm" placeholder="NEWKET50">
                        </div>

                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-2">Switch automatique (secondes)</label>
                            <input id="heroSlideIntervalSecondsInput" type="number" min="2" max="30" step="1" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-bold" placeholder="5">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-2">Durée avant le changement de slide</p>
                        </div>

                        <div class="flex items-center justify-between gap-4 pt-2">
                            <div>
                                <h4 class="font-black text-base text-gray-900">Slides (images de transition)</h4>
                                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Upload dans `site-assets/hero/*`</p>
                            </div>
                            <button id="heroAddSlideBtn" type="button"
                                class="px-5 py-3 rounded-2xl bg-white border border-gray-100 text-gray-800 font-black tracking-tight hover:bg-gray-50 transition-all btn-active-scale">
                                + Ajouter
                            </button>
                        </div>

                        <div id="heroSlidesList" class="space-y-4"></div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4 sm:items-center justify-end pt-2">
                    <button id="heroReloadBtn" type="button"
                        class="px-7 py-4 rounded-2xl bg-white border border-gray-100 text-gray-800 font-black tracking-tight hover:bg-gray-50 transition-all">
                        Recharger
                    </button>
                    <button id="heroSaveBtn" type="button"
                        class="px-7 py-4 rounded-2xl bg-slate-900 text-white font-black tracking-tight hover:bg-slate-800 transition-all btn-active-scale">
                        Enregistrer
                    </button>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
