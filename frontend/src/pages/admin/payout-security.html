    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; }
        .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.75rem; font-weight: 700; color: #374151; text-decoration: none; transition: all 0.15s; }
        .sidebar-link:hover { background: #f3f4f6; }
        .sidebar-link.active { background: #111827; color: white; }
        .ticket-card { border-radius: 1.5rem; border: 1px solid #e2e8f0; background: white; transition: all 0.2s; }
        .ticket-card:hover { box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
        .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 9999px; font-size: 9px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
        .badge-pending { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
        .badge-resolved { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        .badge-rejected { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .photo-box { border-radius: 1rem; overflow: hidden; border: 1px solid #e5e7eb; background: #f9fafb; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
        .photo-box .empty { color: #9ca3af; font-size: 10px; font-weight: 700; text-align: center; padding: 1rem; }
        .action-btn { padding: 0.625rem 1.25rem; border-radius: 0.75rem; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; border: none; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.4rem; }
        .btn-approve { background: #111827; color: white; }
        .btn-approve:hover { background: #374151; }
        .btn-reject { background: #fee2e2; color: #991b1b; }
        .btn-reject:hover { background: #fecaca; }
        .modal-scroll { scrollbar-width: thin; }
    </style>
</head>

<body class="bg-gray-50 transition-colors duration-200">
    <div id="adminNavbarPlaceholder"></div>
    <div id="adminOverlay"></div>
    <div class="admin-shell">
        <div id="adminSidebarPlaceholder"></div>
        <main id="admin-content" class="admin-main">
            <div class="admin-page-header">
                <div class="admin-page-header-inner">
                    <div class="admin-page-header-left">
                        <h1 class="admin-page-title text-4xl font-black tracking-tight text-gray-900">Sécurité Payouts</h1>
                        <p class="text-gray-500 font-medium">Vérification d'identité pour les demandes de changement de numéro.</p>
                    </div>
                    <div class="admin-page-actions flex flex-col sm:flex-row flex-wrap items-stretch sm:items-center gap-3 w-full lg:w-auto">
                        <select id="filterStatus" onchange="loadRequests()" class="w-full sm:w-auto bg-white border border-gray-100 rounded-2xl px-4 py-3.5 text-xs font-bold outline-none focus:ring-2 focus:ring-black">
                            <option value="all">Tous les statuts</option>
                            <option value="ouvert">En attente</option>
                            <option value="resolu">Approuvé</option>
                            <option value="rejete">Rejeté</option>
                        </select>
                        <div class="flex items-center gap-2 px-4 py-3 bg-white border border-gray-100 rounded-2xl">
                            <div id="realtimeDot" class="w-2 h-2 rounded-full bg-gray-300"></div>
                            <span id="realtimeLabel" class="text-xs font-bold text-gray-500">Connexion...</span>
                            <span id="realtimeEventBadge" class="hidden ml-2 px-2 py-0.5 bg-orange-100 text-orange-700 text-[10px] font-black rounded-full">🔔 Nouvelle demande !</span>
                        </div>
                        <button onclick="loadRequests()" class="w-full sm:w-auto bg-black text-white px-5 py-3.5 rounded-2xl text-xs font-black uppercase tracking-widest flex items-center justify-center gap-2 hover:bg-gray-900 transition-all">
                            <iconify-icon icon="solar:refresh-bold" width="14"></iconify-icon> Actualiser
                        </button>
                    </div>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="px-6 mb-6 grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div class="bg-white rounded-2xl border border-gray-100 p-5 flex flex-col gap-1">
                    <span class="text-[10px] font-black uppercase tracking-widest text-gray-400">Total</span>
                    <span id="statTotal" class="text-3xl font-black text-gray-900">—</span>
                </div>
                <div class="bg-yellow-50 rounded-2xl border border-yellow-100 p-5 flex flex-col gap-1">
                    <span class="text-[10px] font-black uppercase tracking-widest text-yellow-600">En attente</span>
                    <span id="statPending" class="text-3xl font-black text-yellow-700">—</span>
                </div>
                <div class="bg-green-50 rounded-2xl border border-green-100 p-5 flex flex-col gap-1">
                    <span class="text-[10px] font-black uppercase tracking-widest text-green-600">Approuvés</span>
                    <span id="statApproved" class="text-3xl font-black text-green-700">—</span>
                </div>
                <div class="bg-red-50 rounded-2xl border border-red-100 p-5 flex flex-col gap-1">
                    <span class="text-[10px] font-black uppercase tracking-widest text-red-500">Rejetés</span>
                    <span id="statRejected" class="text-3xl font-black text-red-600">—</span>
                </div>
            </div>

            <!-- Main list -->
            <div class="px-6">
                <div id="requestsContainer" class="space-y-4">
                    <div class="glass-panel p-12 text-center">
                        <iconify-icon icon="line-md:loading-twotone-loop" width="32" class="text-gray-400 mx-auto mb-2"></iconify-icon>
                        <p class="text-gray-400 text-sm font-medium">Chargement des demandes...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Lightbox for photo zoom -->
    <div id="photoLightbox" class="fixed inset-0 z-[99999] bg-black/80 backdrop-blur-md hidden items-center justify-center p-6 cursor-pointer" onclick="closeLightbox()">
        <div class="relative max-w-[90vw] max-h-[90vh] flex items-center justify-center" onclick="event.stopPropagation()">
            <img id="lightboxImg" src="" class="max-w-[90vw] max-h-[85vh] object-contain rounded-2xl shadow-2xl border border-white/10 select-none">
            <button type="button" class="absolute -top-3 -right-3 w-10 h-10 bg-white text-black rounded-full flex items-center justify-center shadow-xl hover:scale-110 transition-transform cursor-pointer" onclick="closeLightbox()">
                <iconify-icon icon="solar:close-circle-bold" width="24"></iconify-icon>
            </button>
        </div>
    </div>

    <script>
        let allRequests = [];

        function openLightbox(url) {
            if (!url) return;
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'open-admin-lightbox', url: url }, '*');
                return;
            }
            document.getElementById('lightboxImg').src = url;
            const lb = document.getElementById('photoLightbox');
            lb.classList.remove('hidden');
            lb.classList.add('flex');
        }

        function closeLightbox() {
            const lb = document.getElementById('photoLightbox');
            lb.classList.add('hidden');
            lb.classList.remove('flex');
        }

        function getSignedUrl(bucket, path) {
            if (!path || !window.supabaseClient) return Promise.resolve(null);
            // Extract just the path from a full URL if needed
            let cleanPath = path;
            if (path.startsWith('http')) {
                const urlObj = new URL(path);
                const parts = urlObj.pathname.split('/object/public/');
                if (parts[1]) {
                    const bucketAndPath = parts[1];
                    const slashIdx = bucketAndPath.indexOf('/');
                    cleanPath = bucketAndPath.slice(slashIdx + 1);
                }
            }
            return window.supabaseClient.storage
                .from(bucket)
                .createSignedUrl(cleanPath, 3600)
                .then(({ data }) => data?.signedUrl || path)
                .catch(() => path);
        }

        async function loadRequests() {
            const container = document.getElementById('requestsContainer');
            container.innerHTML = `<div class="glass-panel p-12 text-center"><iconify-icon icon="line-md:loading-twotone-loop" width="32" class="text-gray-400 mx-auto mb-2"></iconify-icon><p class="text-gray-400 text-sm font-medium">Chargement...</p></div>`;

            const filterStatus = document.getElementById('filterStatus').value;

            let query = window.supabaseClient
                .from('support_tickets')
                .select('*')
                .eq('type', 'PAYOUT_CHANGE')
                .order('created_at', { ascending: false });

            if (filterStatus !== 'all') {
                query = query.eq('status', filterStatus);
            }

            const { data, error } = await query;

            if (error) {
                container.innerHTML = `<div class="glass-panel p-8 text-center text-red-500 text-sm font-bold">Erreur: ${error.message}</div>`;
                return;
            }

            allRequests = data || [];

            // Update stats
            document.getElementById('statTotal').textContent = allRequests.length;
            document.getElementById('statPending').textContent = allRequests.filter(t => t.status === 'ouvert').length;
            document.getElementById('statApproved').textContent = allRequests.filter(t => t.status === 'resolu').length;
            document.getElementById('statRejected').textContent = allRequests.filter(t => t.status === 'rejete').length;

            if (allRequests.length === 0) {
                container.innerHTML = `<div class="glass-panel p-12 text-center text-gray-400 text-sm italic">Aucune demande trouvée.</div>`;
                return;
            }

            container.innerHTML = allRequests.map(t => buildCard(t)).join('');

            // Load signed URLs asynchronously for each card
            for (const t of allRequests) {
                loadPhotosForCard(t);
            }
        }

        function buildCard(t) {
            const m = t.metadata || {};
            const isResolved = t.status === 'resolu';
            const isRejected = t.status === 'rejete';
            const isPending = !isResolved && !isRejected;

            const badgeClass = isResolved ? 'badge-resolved' : isRejected ? 'badge-rejected' : 'badge-pending';
            const badgeText = isResolved ? 'Approuvé' : isRejected ? 'Rejeté' : 'En attente';

            const date = new Date(t.created_at).toLocaleString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

            return `
            <div id="card_${t.id}" class="ticket-card p-6">
                <!-- Header -->
                <div class="flex flex-wrap items-center gap-2 mb-4">
                    <span class="text-[10px] font-black text-gray-400 uppercase">#${t.id.slice(0,8)}</span>
                    <span class="badge badge-pending text-[9px]">PAYOUT_CHANGE</span>
                    <span class="badge ${badgeClass}">${badgeText}</span>
                    <span class="ml-auto text-[10px] text-gray-400">${date}</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-5">
                    <!-- LEFT: Profil Original -->
                    <div class="p-5 bg-gray-50 rounded-2xl border border-gray-200">
                        <div class="flex items-center gap-2 mb-4 border-b border-gray-200 pb-3">
                            <iconify-icon icon="solar:folder-with-files-bold-duotone" class="text-gray-400" width="18"></iconify-icon>
                            <h4 class="text-xs font-black uppercase tracking-widest text-gray-500">Profil Actuel (Au dossier)</h4>
                        </div>
                        
                        <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-1">Identité du Vendeur</p>
                        <p class="font-black text-gray-900 mb-1">${t.customer_name || '—'}</p>
                        <p class="text-xs text-gray-500 mb-5">${t.customer_email || '—'}</p>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2">Recto (Dossier)</p>
                                <div class="photo-box bg-white border-gray-200" id="orig_recto_${t.id}">
                                    <div class="empty"><iconify-icon icon="line-md:loading-twotone-loop" width="20"></iconify-icon><br>Chargement...</div>
                                </div>
                            </div>
                            <div>
                                <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2">Verso (Dossier)</p>
                                <div class="photo-box bg-white border-gray-200" id="orig_verso_${t.id}">
                                    <div class="empty"><iconify-icon icon="line-md:loading-twotone-loop" width="20"></iconify-icon><br>Chargement...</div>
                                </div>
                            </div>
                        </div>
                        <div id="extra_docs_${t.id}"></div>
                    </div>

                    <!-- RIGHT: Nouvelle Demande -->
                    <div class="p-5 bg-blue-50 rounded-2xl border border-blue-100">
                        <div class="flex items-center gap-2 mb-4 border-b border-blue-200 pb-3">
                            <iconify-icon icon="solar:shield-check-bold-duotone" class="text-blue-500" width="18"></iconify-icon>
                            <h4 class="text-xs font-black uppercase tracking-widest text-blue-600">Nouvelle Soumission</h4>
                        </div>
                        
                        <p class="text-[10px] font-black uppercase tracking-widest text-blue-400 mb-1">Nouveau Compte Demandé</p>
                        <p class="font-black text-gray-900 mb-1">${m.new_provider || '—'} — ${m.new_account_id || '—'}</p>
                        <p class="text-xs text-gray-600 mb-5">Nom: ${m.new_account_name || '—'}</p>

                        <div class="grid grid-cols-3 gap-3">
                            <div>
                                <p class="text-[10px] font-black uppercase tracking-widest text-blue-400 mb-2">Nouv. Recto</p>
                                <div class="photo-box bg-white border-blue-200" id="recto_${t.id}">
                                    <div class="empty"><iconify-icon icon="line-md:loading-twotone-loop" width="20"></iconify-icon><br>Chargement...</div>
                                </div>
                            </div>
                            <div>
                                <p class="text-[10px] font-black uppercase tracking-widest text-blue-400 mb-2">Nouv. Verso</p>
                                <div class="photo-box bg-white border-blue-200" id="verso_${t.id}">
                                    <div class="empty"><iconify-icon icon="line-md:loading-twotone-loop" width="20"></iconify-icon><br>Chargement...</div>
                                </div>
                            </div>
                            <div>
                                <p class="text-[10px] font-black uppercase tracking-widest text-blue-400 mb-2">Selfie (Live)</p>
                                <div class="photo-box bg-white border-blue-400 border-2 shadow-sm" id="selfie_${t.id}">
                                    <div class="empty"><iconify-icon icon="line-md:loading-twotone-loop" width="20"></iconify-icon><br>Chargement...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                ${isPending ? `
                <div class="flex flex-wrap gap-3 items-center">
                    <button onclick="approveRequest('${t.id}', '${m.new_provider}', '${m.new_account_id}', '${m.new_account_name?.replace(/'/g, "\\'")}')" class="px-5 py-2.5 bg-gray-900 hover:bg-black text-white text-xs font-black uppercase tracking-widest rounded-xl transition-all flex items-center gap-2 shadow-lg hover:-translate-y-0.5">
                        <iconify-icon icon="solar:check-circle-bold" width="16"></iconify-icon> Approuver
                    </button>
                    <button onclick="rejectRequest('${t.id}')" class="px-5 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-black uppercase tracking-widest rounded-xl transition-all flex items-center gap-2">
                        <iconify-icon icon="solar:close-circle-bold" width="16"></iconify-icon> Rejeter
                    </button>
                    <div id="action_msg_${t.id}" class="text-xs font-medium ml-3 hidden"></div>
                </div>
                ` : ''}
            </div>`;
        }

        async function loadPhotosForCard(t) {
            const m = t.metadata || {};
            const userId = t.user_id;

            let rectoUrl = m.recto_url || null;
            let versoUrl = m.verso_url || null;
            let selfieUrl = m.selfie_url || null;
            
            let origRectoUrl = null;
            let origVersoUrl = null;
            let otherDocsUrls = [];

            if (userId && window.supabaseClient) {
                const { data: user } = await window.supabaseClient
                    .from('users')
                    .select('identity_document_urls, documents_url')
                    .eq('id', userId)
                    .single();
                
                if (user) {
                    if (user.identity_document_urls?.length >= 1) {
                        origRectoUrl = user.identity_document_urls[0];
                    }
                    if (user.identity_document_urls?.length >= 2) {
                        origVersoUrl = user.identity_document_urls[1];
                    }
                    
                    if (Array.isArray(user.documents_url)) {
                        otherDocsUrls = user.documents_url.filter(Boolean);
                    } else if (typeof user.documents_url === 'string' && user.documents_url.trim()) {
                        try {
                            const parsed = JSON.parse(user.documents_url);
                            if (Array.isArray(parsed)) otherDocsUrls = parsed.filter(Boolean);
                        } catch (_) {}
                    }
                }
            }

            renderPhoto('recto_' + t.id, rectoUrl);
            renderPhoto('verso_' + t.id, versoUrl);
            renderPhoto('selfie_' + t.id, selfieUrl);
            
            renderPhoto('orig_recto_' + t.id, origRectoUrl);
            renderPhoto('orig_verso_' + t.id, origVersoUrl);
            
            const extraDocsEl = document.getElementById('extra_docs_' + t.id);
            if (extraDocsEl && otherDocsUrls.length > 0) {
                let html = `<p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 mt-5 pt-4 border-t border-gray-200">Documents Boutique Supplémentaires (${otherDocsUrls.length})</p>`;
                html += `<div class="flex flex-col gap-2 max-h-32 overflow-y-auto pr-2 custom-scrollbar">`;
                otherDocsUrls.forEach((url, idx) => {
                    const finalUrl = url.startsWith('http') ? url : `https://kuygjocnnlvjtoaquicq.supabase.co/storage/v1/object/public/vendor-docs/${url}`;
                    html += `<a href="${finalUrl}" target="_blank" class="flex items-center gap-2 text-[11px] font-bold text-gray-600 bg-white border border-gray-200 px-3 py-2 rounded-xl hover:bg-gray-50 hover:text-black transition-colors"><iconify-icon icon="solar:document-bold" class="text-gray-400"></iconify-icon> Document ${idx + 1}</a>`;
                });
                html += `</div>`;
                extraDocsEl.innerHTML = html;
            }
        }

        function renderPhoto(containerId, url) {
            const el = document.getElementById(containerId);
            if (!el) return;
            if (!url) {
                el.innerHTML = '<div class="empty"><iconify-icon icon="solar:gallery-remove-bold" width="20"></iconify-icon><br>Non disponible</div>';
                return;
            }
            el.innerHTML = `<img src="${url}" loading="lazy" onclick="openLightbox('${url}')" onerror="this.parentElement.innerHTML='<div class=\\'empty\\'><iconify-icon icon=\\'solar:gallery-remove-bold\\' width=\\'20\\'></iconify-icon><br>Erreur chargement</div>'">`;
        }

        async function approveRequest(ticketId, newProvider, newAccountId, newAccountName) {
            const msgEl = document.getElementById('action_msg_' + ticketId);
            if (msgEl) { msgEl.textContent = 'Traitement...'; msgEl.classList.remove('hidden'); }

            try {
                // Get ticket to retrieve user ID
                const { data: ticket, error: ticketFetchErr } = await window.supabaseClient
                    .from('support_tickets')
                    .select('*')
                    .eq('id', ticketId)
                    .single();

                if (ticketFetchErr) throw ticketFetchErr;

                const userId = ticket?.user_id;
                if (!userId) throw new Error('ID vendeur introuvable');

                const finalOperator = newProvider ? newProvider.toUpperCase() : null;

                // 1. Update vendor payout method
                const { data: existingPayout, error: payoutCheckErr } = await window.supabaseClient
                    .from('vendor_payout_methods')
                    .select('id')
                    .eq('vendor_id', userId)
                    .maybeSingle();

                if (payoutCheckErr) throw payoutCheckErr;

                if (existingPayout) {
                    const { error: updateErr } = await window.supabaseClient
                        .from('vendor_payout_methods')
                        .update({
                            provider: finalOperator,
                            account_id: newAccountId,
                            account_name: newAccountName,
                            updated_at: new Date().toISOString()
                        })
                        .eq('vendor_id', userId);

                    if (updateErr) throw updateErr;
                } else {
                    const { error: insertErr } = await window.supabaseClient
                        .from('vendor_payout_methods')
                        .insert({
                            vendor_id: userId,
                            provider: finalOperator,
                            account_id: newAccountId,
                            account_name: newAccountName
                        });

                    if (insertErr) throw insertErr;
                }

                // 2. Unflag user and update preferred method + account id
                const { error: userErr } = await window.supabaseClient
                    .from('users')
                    .update({
                        payout_change_pending: false,
                        preferred_payout_method: finalOperator,
                        payout_account_id: newAccountId
                    })
                    .eq('id', userId);

                if (userErr) throw userErr;

                // 3. Mark ticket as resolved
                const { error: ticketUpdateErr } = await window.supabaseClient
                    .from('support_tickets')
                    .update({ status: 'resolu', resolved_at: new Date().toISOString() })
                    .eq('id', ticketId);

                if (ticketUpdateErr) throw ticketUpdateErr;

                if (window.ToastMaker) window.ToastMaker.success('✅ Compte de paiement mis à jour !');
                loadRequests();

            } catch (e) {
                console.error('[PayoutSecurity] Approve error:', e);
                if (msgEl) { msgEl.textContent = 'Erreur: ' + e.message; msgEl.classList.remove('hidden'); }
                if (window.ToastMaker) window.ToastMaker.error('Erreur: ' + e.message);
            }
        }

        async function rejectRequest(ticketId) {
            const msgEl = document.getElementById('action_msg_' + ticketId);
            if (msgEl) { msgEl.textContent = 'Traitement...'; msgEl.classList.remove('hidden'); }

            try {
                const { data: ticket, error: ticketFetchErr } = await window.supabaseClient
                    .from('support_tickets')
                    .select('user_id')
                    .eq('id', ticketId)
                    .single();

                if (ticketFetchErr) throw ticketFetchErr;

                const userId = ticket?.user_id;

                if (userId) {
                    const { error: userErr } = await window.supabaseClient
                        .from('users')
                        .update({ payout_change_pending: false })
                        .eq('id', userId);
                    if (userErr) throw userErr;
                }

                const { error: ticketUpdateErr } = await window.supabaseClient
                    .from('support_tickets')
                    .update({ status: 'rejete', resolved_at: new Date().toISOString() })
                    .eq('id', ticketId);

                if (ticketUpdateErr) throw ticketUpdateErr;

                if (window.ToastMaker) window.ToastMaker.info('Demande rejetée.');
                loadRequests();

            } catch (e) {
                console.error('[PayoutSecurity] Reject error:', e);
                if (msgEl) { msgEl.textContent = 'Erreur: ' + e.message; msgEl.classList.remove('hidden'); }
                if (window.ToastMaker) window.ToastMaker.error('Erreur: ' + e.message);
            }
        }

        let realtimeChannel = null;

        function startRealtime() {
            if (!window.supabaseClient) return;
            if (realtimeChannel) {
                window.supabaseClient.removeChannel(realtimeChannel);
            }
            realtimeChannel = window.supabaseClient
                .channel('payout-security-realtime')
                .on('postgres_changes', {
                    event: '*',
                    schema: 'public',
                    table: 'support_tickets',
                    filter: 'type=eq.PAYOUT_CHANGE'
                }, (payload) => {
                    console.log('[PayoutSecurity] Realtime event:', payload.eventType);
                    // Flash notification badge
                    showRealtimeBadge(payload.eventType);
                    // Reload list
                    loadRequests();
                })
                .subscribe((status) => {
                    const dot = document.getElementById('realtimeDot');
                    if (dot) {
                        dot.className = status === 'SUBSCRIBED'
                            ? 'w-2 h-2 rounded-full bg-green-400 animate-pulse'
                            : 'w-2 h-2 rounded-full bg-gray-300';
                    }
                    const label = document.getElementById('realtimeLabel');
                    if (label) label.textContent = status === 'SUBSCRIBED' ? 'En direct' : 'Connexion...';
                });
        }

        function showRealtimeBadge(eventType) {
            const badge = document.getElementById('realtimeEventBadge');
            if (!badge) return;
            badge.textContent = eventType === 'INSERT' ? '🔔 Nouvelle demande !' : '🔄 Mise à jour';
            badge.classList.remove('hidden');
            clearTimeout(window._rtBadgeTimer);
            window._rtBadgeTimer = setTimeout(() => badge.classList.add('hidden'), 4000);
        }

        window.addEventListener('newketInitialized', () => {
            loadRequests();
            startRealtime();
        });

        if (window.newketInitialized) {
            loadRequests();
            startRealtime();
        }
    </script>
</body>
</html>
