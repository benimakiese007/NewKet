    <script>
        // =========================================================
        // Notifications Admin Page à Database-first approach
        // Local key kept only for display of sent-by-me tracking
        // =========================================================
        const SENT_KEY = 'newket_admin_sent_notifs'; // lightweight sent-log for this session

        function getSentLog() {
            try { return JSON.parse(localStorage.getItem(SENT_KEY)) || []; } catch { return []; }
        }
        function saveSentLog(log) {
            localStorage.setItem(SENT_KEY, JSON.stringify(log.slice(0, 100)));
        }

        /** Force les managers de ré-interroger le serveur */
        async function forceRefresh() {
            const list = document.getElementById('notifList');
            list.innerHTML = '<div class="p-12 text-center text-gray-400">Rafraîchissement...</div>';
            // Purge cache timestamps so init() will re-fetch
            localStorage.removeItem('newket_notifications_sync_time');
            if (window.NotificationManager) {
                NotificationManager._fetchPromise = null;
                await NotificationManager.init(true);
            }
            renderNotifications();
            updateStats();
        }

        function updateDeliveryMode() {
            const modeStyles = {
                'push-only':   { border: 'border-blue-500',   bg: 'bg-blue-50',   dot: 'bg-blue-600',   radio: 'border-blue-600' },
                'broadcast':   { border: 'border-indigo-500', bg: 'bg-indigo-50', dot: 'bg-indigo-600', radio: 'border-indigo-600' },
                'guest-modal': { border: 'border-violet-500', bg: 'bg-violet-50', dot: 'bg-violet-600', radio: 'border-violet-600' }
            };
            const selected = document.querySelector('input[name="deliveryMode"]:checked');
            document.querySelectorAll('.delivery-mode-label').forEach(label => {
                const input = label.querySelector('input[type="radio"]');
                const radioEl = label.querySelector('.delivery-radio');
                const dotEl = label.querySelector('.delivery-dot');
                const val = input?.value;
                const s = modeStyles[val] || {};
                // Reset
                label.classList.remove('border-blue-500', 'bg-blue-50', 'border-indigo-500', 'bg-indigo-50', 'border-violet-500', 'bg-violet-50');
                label.classList.add('border-gray-200');
                radioEl.classList.remove('border-blue-600', 'border-indigo-600', 'border-violet-600');
                radioEl.classList.add('border-gray-300');
                dotEl.classList.add('hidden');
                dotEl.classList.remove('bg-blue-600', 'bg-indigo-600', 'bg-violet-600');
                // Apply if selected
                if (input === selected && s.border) {
                    label.classList.remove('border-gray-200');
                    label.classList.add(s.border, s.bg);
                    radioEl.classList.remove('border-gray-300');
                    radioEl.classList.add(s.radio);
                    dotEl.classList.remove('hidden');
                    dotEl.classList.add(s.dot);
                }
            });
        }

        async function sendNotification() {
            const title = document.getElementById('notifTitle').value.trim();
            const message = document.getElementById('notifMessage').value.trim();
            const baseType = document.getElementById('notifType').value;
            const deliveryMode = document.querySelector('input[name="deliveryMode"]:checked')?.value;
            const type = deliveryMode ? `${deliveryMode}:${baseType}` : baseType;
            const target = document.getElementById('notifTarget').value;
            const feedback = document.getElementById('notifComposerFeedback');

            const setComposerFeedback = (message, type = 'success') => {
                feedback.textContent = message;
                feedback.className = `mb-4 rounded-xl px-4 py-3 text-sm font-semibold ${type === 'error' ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700'}`;
            };

            if (!title || !message) {
                setComposerFeedback('Veuillez remplir le titre et le message.', 'error');
                return;
            }

            if (window.NotificationManager) {
                try {
                    await window.NotificationManager.addNotification(title, message, type, target);
                    const log = getSentLog();
                    log.unshift({
                        id: Date.now().toString(),
                        title, message, type, target,
                        date: new Date().toISOString(),
                        read: false,
                        sentBy: localStorage.getItem('newketUserEmail') || 'admin'
                    });
                    saveSentLog(log);
                    renderNotifications();
                    updateStats();
                } catch (err) {
                    console.error('Unable to send notification', err);
                    setComposerFeedback('Impossible d’envoyer la notification.', 'error');
                    return;
                }
            }

            document.getElementById('notifTitle').value = '';
            document.getElementById('notifMessage').value = '';
            setComposerFeedback('Notification envoyée avec succès !');
            if (window.ActivityManager) ActivityManager.log(`Notification envoyée : "${title}"`, 'system');
        }

        function prefillNotificationComposer(encodedNotification) {
            if (!encodedNotification) return;

            let notification = null;
            try {
                notification = JSON.parse(decodeURIComponent(encodedNotification));
            } catch (err) {
                console.error('Unable to restore notification for resend', err);
                const feedback = document.getElementById('notifComposerFeedback');
                feedback.textContent = 'Impossible de charger cette notification.';
                feedback.className = 'mb-4 rounded-xl px-4 py-3 text-sm font-semibold bg-red-50 text-red-700';
                return;
            }

            const displayType = getDisplayType(notification.type);
            const rawType = String(notification.type || '');
            let deliveryMode = null;
            if (rawType.startsWith('push-only:')) deliveryMode = 'push-only';
            else if (rawType.startsWith('guest-modal:')) deliveryMode = 'guest-modal';
            else if (rawType.startsWith('broadcast-modal:')) deliveryMode = 'guest-modal'; // backward compat
            else if (rawType.startsWith('broadcast:') || rawType === 'broadcast') deliveryMode = 'broadcast';
            const target = notification.target_role || notification.target || 'all';

            document.getElementById('notifTitle').value = notification.title || '';
            document.getElementById('notifMessage').value = notification.message || '';
            document.getElementById('notifType').value = ['info', 'success', 'warning', 'danger', 'promo'].includes(displayType) ? displayType : 'info';
            document.getElementById('notifTarget').value = ['all', 'customers', 'suppliers'].includes(target) ? target : 'all';
            if (deliveryMode) {
                const radio = document.querySelector(`input[name="deliveryMode"][value="${deliveryMode}"]`);
                if (radio) { radio.checked = true; updateDeliveryMode(); }
            }

            document.querySelector('.glass-panel.p-6')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            document.getElementById('notifTitle')?.focus();
            const feedback = document.getElementById('notifComposerFeedback');
            feedback.textContent = 'Notification chargée dans le composeur.';
            feedback.className = 'mb-4 rounded-xl px-4 py-3 text-sm font-semibold bg-emerald-50 text-emerald-700';
        }

        function getDisplayType(type) {
            if (window.normalizeNotificationType) return window.normalizeNotificationType(type);
            if (!type) return 'info';
            if (type === 'broadcast') return 'info';
            // guest-modal (nouveau) et broadcast-modal (ancien) — même logique
            if (String(type || '').startsWith('guest-modal:')) return (type.split(':').slice(1).join(':') || 'info');
            if (String(type || '').startsWith('broadcast-modal:')) return (type.split(':').slice(1).join(':') || 'info');
            return type.startsWith('broadcast:') ? (type.split(':')[1] || 'info') : type;
        }

        function isPopupType(type) {
            if (window.isPopupNotification) return window.isPopupNotification(type);
            return type === 'broadcast'
                || String(type || '').startsWith('broadcast:')
                || String(type || '').startsWith('broadcast-modal:')
                || String(type || '').startsWith('guest-modal:');
        }

        function getNotificationIcon(type) {
            if (isPopupType(type)) return '\u{1F4E2}';

            const displayType = getDisplayType(type);
            const icons = {
                info: '\u{1F514}',
                success: '\u2705',
                warning: '\u26A0\uFE0F',
                danger: '\u{1F6A8}',
                promo: '\u{1F381}'
            };

            return icons[displayType] || '\u{1F514}';
        }

        function getTypeBadge(type) {
            const displayType = getDisplayType(type);
            // guest-modal (nouveau type) — Invité Actif
            if (String(type || '').startsWith('guest-modal:')) {
                return '<span class="badge" style="background:#6d28d9;color:white;">👤 Invité Actif</span>' +
                    '<span class="badge" style="background:#ede9fe;color:#6d28d9;">Pop-up invité</span>';
            }
            // broadcast-modal (ancien type — rétrocompatibilité)
            if (String(type || '').startsWith('broadcast-modal:')) {
                return '<span class="badge" style="background:#6d28d9;color:white;">Invité Actif</span>' +
                    '<span class="badge" style="background:#ede9fe;color:#6d28d9;">Pop-up invité</span>';
            }
            if (String(type || '').startsWith('broadcast:') || type === 'broadcast') {
                return '<span class="badge" style="background:#312e81;color:white;">Broadcast</span>' +
                    '<span class="badge" style="background:#ddd6fe;color:#5b21b6;">Pop-up</span>';
            }

            const badges = {
                'info': '<span class="badge badge-info">Info</span>',
                'success': '<span class="badge badge-success">Succès</span>',
                'warning': '<span class="badge badge-warning">Avertiss.</span>',
                'danger': '<span class="badge badge-danger">Alerte</span>',
                'promo': '<span class="badge badge-promo">Promo</span>'
            };
            const popupBadge = isPopupType(type)
                ? '<span class="badge" style="background:#312e81;color:white;">Pop-up</span>'
                : '';
            return (badges[displayType] || '<span class="badge badge-info">Info</span>') + popupBadge;
        }

        function getTargetLabel(target) {
            const labels = { 'all': 'Tous', 'customers': 'Clients', 'suppliers': 'Fournisseurs' };
            return labels[target] || target;
        }

        function renderNotifications() {
            const list = document.getElementById('notifList');
            const filterType = document.getElementById('filterType').value;

            if (!window.NotificationManager || typeof window.NotificationManager.getNotifications !== 'function') {
                if (typeof window.buildSkeletonPanelListHTML === 'function') {
                    list.innerHTML = window.buildSkeletonPanelListHTML(2, { lines: 2, cardClass: 'glass-panel p-4 m-4' });
                }
                return;
            }

            // Merge DB notifications with local sent-log (deduplicated by ID)
            let notifs = [];
            if (window.NotificationManager) {
                notifs = [...window.NotificationManager.getNotifications()];
            }
            // Also surface anything created in this session that hasn't arrived via DB yet
            const sentLog = getSentLog();
            sentLog.forEach(s => {
                if (!notifs.find(n => n.title === s.title && n.date === s.date)) {
                    notifs.unshift(s);
                }
            });

            if (filterType !== 'all') notifs = notifs.filter(n => getDisplayType(n.type) === filterType);

            if (notifs.length === 0) {
                list.innerHTML = `<div class="p-12 text-center text-gray-400 text-sm italic">Aucune notification trouvée.</div>`;
                return;
            }

            list.innerHTML = notifs.map(n => `
                <div class="notif-card p-4 hover:bg-gray-50 transition-colors">
                    <div class="flex items-start justify-between gap-4">
                        <div class="flex items-start gap-4 flex-1 min-w-0">
                            <div class="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center flex-shrink-0 text-lg">
                                ${getNotificationIcon(n.type)}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 flex-wrap mb-1">
                                    <span class="text-sm font-bold text-gray-900">${n.title}</span>
                                    ${getTypeBadge(n.type)}
                                    <span class="badge" style="background:#f1f5f9;color:#475569;">${getTargetLabel(n.target_role || n.target || 'all')}</span>
                                    ${!n.read ? '<span class="badge" style="background:#eff6ff;color:#3b82f6;">Non lue</span>' : ''}
                                </div>
                                <p class="text-sm text-gray-600 mb-2">${n.message}</p>
                                <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">
                                    ${new Date(n.date || n.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' })}
                                    ${n.sentBy ? '· Par ' + n.sentBy : ''}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <button onclick="prefillNotificationComposer('${encodeURIComponent(JSON.stringify(n))}')" data-track-action="admin_notifications:prefill_click"
                                    class="p-2 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all"
                                    title="Reprendre cette notification">
                                <iconify-icon icon="solar:refresh-bold" width="18"></iconify-icon>
                            </button>
                            <button onclick="deleteNotification('${n.id}')" data-track-action="admin_notifications:delete_click" 
                                    class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all" 
                                    title="Supprimer définitivement">
                                <iconify-icon icon="solar:trash-bin-trash-bold" width="18"></iconify-icon>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            if (!window.NotificationManager || typeof window.NotificationManager.getNotifications !== 'function') return;
            let notifs = window.NotificationManager ? window.NotificationManager.getNotifications() : [];
            document.getElementById('statTotal').textContent = notifs.length;
            document.getElementById('statUnread').textContent = notifs.filter(n => !n.read).length;
            document.getElementById('statPromos').textContent = notifs.filter(n => getDisplayType(n.type) === 'promo').length;
            document.getElementById('statAlerts').textContent = notifs.filter(n => getDisplayType(n.type) === 'danger').length;
        }

        async function deleteNotification(id) {
            if (!confirm('Voulez-vous supprimer définitivement cette notification ?')) return;
            
            if (window.NotificationManager) {
                const ok = await window.NotificationManager.deleteNotification(id);
                if (ok) {
                    showToast('Notification supprimée.', 'success');
                    renderNotifications();
                    updateStats();
                } else {
                    showToast('Erreur lors de la suppression.', 'error');
                }
            }
            
            // Clean local log too
            const log = getSentLog().filter(s => s.id !== id);
            saveSentLog(log);
        }

        async function clearAllNotifications() {
            if (!confirm('Effacer TOUTES les notifications définitivement (BDD + local) ?')) return;
            
            if (window.NotificationManager) {
                const ok = await window.NotificationManager.clearAll();
                if (ok) {
                    localStorage.removeItem(SENT_KEY);
                    renderNotifications();
                    updateStats();
                    showToast('Historique effacé avec succès.', 'success');
                } else {
                    showToast('Erreur lors du nettoyage.', 'error');
                }
            }
        }

        function openNewNotifModal() {
            document.getElementById('notifTitle').focus();
        }

        function initPage() {
            // Re-render when NotificationManager updates
            window.addEventListener('notificationsUpdated', () => {
                renderNotifications();
                updateStats();
            });

            document.querySelectorAll('input[name="deliveryMode"]').forEach(r => r.addEventListener('change', updateDeliveryMode));
            updateDeliveryMode();

            renderNotifications();
            updateStats();

            // Role check
            const role = localStorage.getItem('newketRole');
            document.querySelectorAll('.admin-only').forEach(el => {
                if (role === 'admin') el.classList.remove('hidden');
                else el.classList.add('hidden');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.newketInitialized) { initPage(); }
            else { window.addEventListener('newketInitialized', initPage); }
        });
    </script>
</body>

</html>
