<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="512x512" href="../../assets/Images/logo-newket-v2.jpeg">
    <link rel="icon" type="image/png" href="../../assets/Images/logo-newket-v2.jpeg">
    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NewKet">
    <title>Suivi des Prospects | NewKet</title>
    <link rel="stylesheet" href="../../assets/css/input.css">
    <link rel="preconnect" href="https://code.iconify.design" crossorigin>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    
    <script type="module" src="../../services/app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body class="text-gray-900 bg-[#f8fafc]">
    <div id="adminNavbarPlaceholder"></div>

    <div class="max-w-[1800px] mx-auto px-4 sm:px-8 pt-[52px] pb-12 flex flex-col md:flex-row gap-8">
        <div id="adminSidebarPlaceholder"></div>

        <!-- Main Content -->
        <main class="flex-1 min-w-0 space-y-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 animate-premium">
                <div>
                    <h1 class="text-4xl font-black tracking-tight text-gray-900" id="pageTitle">Prospects WhatsApp</h1>
                    <p class="text-gray-500 font-medium" id="pageSubtitle">Suivez les interactions et intentions d'achat générées par la plateforme.</p>
                </div>
                <button onclick="exportOrdersToCSV()"
                    class="bg-black text-white px-8 py-3.5 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-gray-800 transition-all flex items-center gap-2 shadow-2xl shadow-black/20">
                    <iconify-icon icon="solar:download-bold-duotone" width="20"></iconify-icon>
                    Exporter les Leads
                </button>
            </div>

            <div class="glass-panel overflow-hidden animate-premium stagger-1">
                <div class="overflow-x-auto">
                    <table class="premium-table w-full">
                        <thead>
                            <tr>
                                <th>Lead ID</th>
                                <th>Client</th>
                                <th>Provenance</th>
                                <th>WhatsApp / Contact</th>
                                <th>Date</th>
                                <th>Potentiel (Brut)</th>
                                <th>Statut</th>
                                <th class="text-right">Gestion</th>
                            </tr>
                        </thead>
                        <tbody id="ordersBody">
                            <!-- Orders loaded via JS -->
                        </tbody>
                    </table>
                </div>
                <div id="emptyState" class="hidden p-20 text-center">
                    <div class="w-20 h-20 bg-gray-50 rounded-3xl flex items-center justify-center mx-auto mb-6">
                        <iconify-icon icon="solar:chat-round-call-bold-duotone" class="text-gray-200" width="48"></iconify-icon>
                    </div>
                    <p class="text-gray-400 font-bold">Aucun prospect enregistré pour le moment.</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../../services/admin-layout.js"></script>
    <script>
        function renderAdminOrders() {
            const tbody = document.getElementById('ordersBody');
            const emptyState = document.getElementById('emptyState');
            const orders = OrderManager.getOrders();

            if (orders.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            tbody.innerHTML = orders.map((o, i) => `
                <tr class="group animate-premium" style="animation-delay: ${i * 0.05}s">
                    <td class="p-4 font-black text-gray-400">#${o.id.substring(0, 8).toUpperCase()}</td>
                    <td class="p-4">
                        <div class="font-black text-gray-900">${o.customer?.name || o.customer_name || 'Client Anonyme'}</div>
                        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest leading-none mt-1">${o.customer?.email || o.customer_email || 'Sans email'}</div>
                    </td>
                    <td class="p-4">
                        <div class="badge-premium bg-blue-50 text-blue-600">
                            ${o.payment_method || 'WhatsApp Click'}
                        </div>
                    </td>
                    <td class="p-4">
                        ${o.phone_number ? `
                            <a href="tel:${o.phone_number}" class="inline-flex items-center gap-2 text-black font-black hover:scale-105 transition-transform">
                                <iconify-icon icon="solar:phone-bold" class="text-blue-500" width="16"></iconify-icon>
                                ${o.phone_number}
                            </a>
                        ` : '<span class="text-gray-300 font-bold italic">N/A</span>'}
                    </td>
                    <td class="p-4 text-[11px] font-bold text-gray-500 uppercase">${new Date(o.date).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' })}</td>
                    <td class="p-4 font-black text-gray-900">${CurrencyManager.formatPrice(o.total)}</td>
                    <td class="p-4">
                        <div class="badge-premium ${getStatusStyle(o.status)}">
                            ${o.status}
                        </div>
                    </td>
                    <td class="p-4 text-right">
                        <select onchange="updateStatus('${o.id}', this.value)" class="text-[10px] font-black uppercase tracking-widest bg-gray-50 border-none rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-black transition-all cursor-pointer">
                            <option value="En attente" ${o.status === 'En attente' ? 'selected' : ''}>Attente</option>
                            <option value="En livraison" ${o.status === 'En livraison' ? 'selected' : ''}>Suivi</option>
                            <option value="Livré" ${o.status === 'Livré' ? 'selected' : ''}>Conclu</option>
                        </select>
                    </td>
                </tr>
            `).join('');

            if (window.CurrencyManager) CurrencyManager.updateAllPrices();
        }

        function getStatusStyle(status) {
            switch (status) {
                case 'En attente': return 'bg-yellow-50 text-yellow-600';
                case 'En livraison': return 'bg-blue-50 text-blue-600';
                case 'Livré': return 'bg-green-50 text-green-600';
                case 'Conclu': return 'bg-green-50 text-green-600';
                default: return 'bg-gray-50 text-gray-500';
            }
        }

        function updateStatus(id, newStatus) {
            OrderManager.updateStatus(id, newStatus);
            renderAdminOrders();
            if (window.showToast) showToast('Statut prospect mis à jour !', 'success');
        }

        function exportOrdersToCSV() {
            const orders = OrderManager.getOrders();
            if (orders.length === 0) {
                if (window.showToast) showToast('Aucune donnée à exporter.', 'info');
                return;
            }

            const headers = ['ID', 'Client', 'Email', 'Provenance', 'Mobile', 'Date', 'Total', 'Statut'];
            const rows = orders.map(o => [
                o.id,
                o.customer?.name || o.customer_name || 'Client',
                o.customer?.email || o.customer_email || '',
                o.payment_method || 'Mobile Money',
                o.phone_number || '',
                new Date(o.date).toLocaleDateString(),
                o.total,
                o.status
            ]);

            const csvContent = [
                headers.join(','),
                ...rows.map(r => r.join(','))
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `newket - leads - ${new Date().toISOString().split('T')[0]}.csv`);
            link.click();

            if (window.showToast) showToast('Exportation CSV générée !', 'success');
        }

        function initializeOrders() {
            renderAdminOrders();
            const role = localStorage.getItem('newketRole');
            if (role === 'admin') {
                const pageTitle = document.getElementById('pageTitle');
                if (pageTitle) pageTitle.textContent = 'Suivi des Prospects';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.newketInitialized) {
                initializeOrders();
            } else {
                window.addEventListener('newketInitialized', initializeOrders);
            }
        });
    </script>
</body>

</html>
