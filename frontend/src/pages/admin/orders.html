<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="512x512" href="../../assets/Images/Logo NewKet V2.jpeg">
    <link rel="icon" type="image/png" href="../../assets/Images/Logo NewKet V2.jpeg">
    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NewKet">
    <title>Suivi des Prospects | NewKet</title>
    <link rel="stylesheet" href="../../assets/css/input.css">
    <link rel="preconnect" href="https://code.iconify.design" crossorigin>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    
    <script type="module" src="../../services/app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body class="text-gray-900">
    <div id="adminNavbarPlaceholder"></div>

    <div class="max-w-[1800px] mx-auto px-4 sm:px-8 pt-32 pb-12 flex flex-col md:flex-row gap-6">
        <div id="adminSidebarPlaceholder"></div>

        <!-- Main Content -->
        <main class="flex-1 min-w-0 space-y-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h1 class="text-3xl font-black tracking-tight text-gray-900" id="pageTitle">Prospects WhatsApp</h1>
                    <p class="text-gray-500" id="pageSubtitle">Suivez les interactions et intentions d'achat.</p>
                </div>
                <button onclick="exportOrdersToCSV()"
                    class="bg-white text-black border border-gray-200 px-6 py-3 rounded-xl font-bold hover:bg-gray-50 transition-all flex items-center gap-2 shadow-sm">
                    <iconify-icon icon="solar:download-bold" width="20"></iconify-icon>
                    Exporter en CSV
                </button>
            </div>

            <div class="glass-panel overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-[800px] w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-100">
                                <th class="whitespace-nowrap p-4 text-[10px] font-black uppercase tracking-widest text-gray-400">ID</th>
                                <th class="whitespace-nowrap p-4 text-[10px] font-black uppercase tracking-widest text-gray-400">Client
                                </th>
                                <th class="whitespace-nowrap p-4 text-[10px] font-black uppercase tracking-widest text-gray-400">Provenance
                                </th>
                                <th class="whitespace-nowrap p-4 text-[10px] font-black uppercase tracking-widest text-gray-400">WhatsApp/Tel
                                </th>
                                <th class="whitespace-nowrap p-4 text-[10px] font-black uppercase tracking-widest text-gray-400">Date</th>
                                <th class="whitespace-nowrap p-4 text-[10px] font-black uppercase tracking-widest text-gray-400">Total
                                </th>
                                <th class="whitespace-nowrap p-4 text-[10px] font-black uppercase tracking-widest text-gray-400">Statut
                                </th>
                                <th class="whitespace-nowrap p-4 text-[10px] font-black uppercase tracking-widest text-gray-400 text-right">
                                    Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ordersBody" class="divide-y divide-gray-50">
                            <!-- Orders loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../../services/admin-layout.js"></script>
    <script>
        function renderAdminOrders() {
            const tbody = document.getElementById('ordersBody');
            const orders = OrderManager.getOrders();

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-12 text-center text-gray-400">Aucune commande enregistrÃ©e.</td></tr>`;
                return;
            }

            tbody.innerHTML = orders.map(o => `
                <tr class="group hover:bg-gray-50/50 transition-colors text-xs">
                    <td class="p-4 font-black text-gray-400">#${o.id}</td>
                    <td class="p-4">
                        <div class="font-bold text-gray-900">${o.customer?.name || o.customer_name || 'Client'}</div>
                        <div class="text-[10px] text-gray-400 font-medium">${o.customer?.email || o.customer_email || ''}</div>
                    </td>
                    <td class="p-4 font-bold text-gray-600">${o.payment_method || 'Mobile Money'}</td>
                    <td class="p-4">
                        ${o.phone_number ? `
                            <a href="tel:${o.phone_number}" class="inline-flex items-center gap-1 text-black font-black hover:underline">
                                <iconify-icon icon="solar:phone-bold" width="14"></iconify-icon>
                                ${o.phone_number}
                            </a>
                        ` : '<span class="text-gray-300">N/A</span>'}
                    </td>
                    <td class="p-4 text-gray-500">${new Date(o.date).toLocaleDateString()}</td>
                    <td class="p-4 font-black text-gray-900">${CurrencyManager.formatPrice(o.total)}</td>
                    <td class="p-4">
                        <span class="px-3 py-1 text-[9px] font-black uppercase rounded-full ${getStatusStyle(o.status)}">
                            ${o.status}
                        </span>
                    </td>
                    <td class="p-4 text-right">
                        <select onchange="updateStatus('${o.id}', this.value)" class="text-[10px] font-bold uppercase tracking-widest bg-gray-50 border border-gray-200 rounded-lg px-2 py-1 outline-none focus:border-black cursor-pointer">
                            <option value="En attente" ${o.status === 'En attente' ? 'selected' : ''}>Attente</option>
                            <option value="En livraison" ${o.status === 'En livraison' ? 'selected' : ''}>Livraison</option>
                            <option value="LivrÃ©" ${o.status === 'LivrÃ©' ? 'selected' : ''}>LivrÃ©</option>
                        </select>
                    </td>
                </tr>
            `).join('');

            if (window.CurrencyManager) CurrencyManager.updateAllPrices();
        }

        function getStatusStyle(status) {
            switch (status) {
                case 'En attente': return 'bg-yellow-50 text-yellow-600';
                case 'En livraison': return 'bg-blue-50 text-blue-600';
                case 'LivrÃ©': return 'bg-green-50 text-green-600';
                default: return 'bg-gray-50 text-gray-500';
            }
        }

        function updateStatus(id, newStatus) {
            OrderManager.updateStatus(id, newStatus);
            renderAdminOrders();
            showToast('Statut mis Ã  jour !', 'success');
        }

        function exportOrdersToCSV() {
            const orders = OrderManager.getOrders();
            if (orders.length === 0) {
                showToast('Aucune commande Ã  exporter.', 'info');
                return;
            }

            const headers = ['ID', 'Client', 'Email', 'Paiement', 'Mobile', 'Date', 'Total', 'Statut'];
            const rows = orders.map(o => [
                o.id,
                o.customer?.name || o.customer_name || 'Client',
                o.customer?.email || o.customer_email || '',
                o.payment_method || 'Mobile Money',
                o.phone_number || '',
                new Date(o.date).toLocaleDateString(),
                o.total,
                o.status
            ]);

            const csvContent = [
                headers.join(','),
                ...rows.map(r => r.join(','))
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `newket - commandes - ${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast('Exportation rÃ©ussie !', 'success');
            if (window.ActivityManager) ActivityManager.log('Exportation des commandes en CSV', 'system');
        }

        function initializeOrders() {
            renderAdminOrders();

            // Dynamic Labels based on role
            const role = localStorage.getItem('newketRole');
            if (role === 'admin') {
                const pageTitle = document.getElementById('pageTitle');
                const pageSubtitle = document.getElementById('pageSubtitle');
                if (pageTitle) pageTitle.textContent = 'Suivi Prospects';
                if (pageSubtitle) pageSubtitle.textContent = 'Supervisez toutes les interactions WhatsApp de la plateforme.';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.newketInitialized) {
                initializeOrders();
            } else {
                window.addEventListener('newketInitialized', initializeOrders);
            }
        });
    </script>
</body>

</html>
