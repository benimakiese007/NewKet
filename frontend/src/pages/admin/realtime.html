<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="512x512" href="/Images/Logo NewKet PNG.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="theme-color" content="#013220">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NewKet">
    <title>Temps réel | NewKet Admin</title>
    <script>
        (function () {
            try {
                const params = new URLSearchParams(window.location.search);
                if (params.get('embedded') === '1') {
                    document.documentElement.classList.add('admin-embedded-mode');
                }
            } catch (_) {}
        })();
    </script>
    <link rel="stylesheet" href="/src/assets/css/input.css">
    <script src="/vendor/iconify-preload.js"></script>
    <script src="/vendor/iconify-icon.min.js"></script><script type="module" src="/src/services/app.js"></script>
    <link rel="stylesheet" href="/src/assets/css/style.css">
    <link rel="stylesheet" href="/src/assets/css/responsive.css">
    <link rel="stylesheet" href="/src/assets/css/admin.css">
</head>

<body class="text-gray-900">
    <div id="adminNavbarPlaceholder"></div>
    <div class="admin-shell max-w-[1800px] mx-auto px-4 sm:px-8 flex flex-col lg:flex-row gap-6">
        <div id="adminSidebarPlaceholder"></div>
        <script type="module" src="/src/services/admin-layout.js"></script>

        <main class="flex-1 min-w-0 space-y-8">
            <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
                <div class="min-w-0">
                    <h1 class="text-4xl font-black tracking-tight text-gray-900">Temps réel</h1>
                    <p class="text-gray-500 font-medium">Utilisateurs actifs + top boutiques (sans jamais compter l'admin).</p>
                    <div class="mt-2 text-xs text-gray-400" id="realtimeMeta">Connexion...</div>
                </div>
                <div class="flex w-full flex-col gap-3 lg:w-auto lg:items-end">
                    <div class="grid w-full gap-3">
                        <div class="flex w-full flex-col gap-2 rounded-2xl border border-gray-100 bg-white p-2 shadow-sm sm:flex-row sm:items-stretch">
                            <div class="grid flex-1 grid-cols-3 gap-2">
                                <button class="rt-range-btn bg-black text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest" data-days="7">7j</button>
                                <button class="rt-range-btn text-gray-500 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest bg-white border border-gray-200" data-days="30">30j</button>
                                <button class="rt-range-btn text-gray-500 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest bg-white border border-gray-200" data-days="90">90j</button>
                            </div>
                            <button id="toggleRealtimeDateFiltersBtn" type="button" aria-expanded="false" class="w-full rounded-xl border border-gray-200 bg-white px-4 py-2 text-[10px] font-black uppercase tracking-widest text-gray-700 transition-colors hover:border-black hover:text-black sm:w-auto">Filtres</button>
                        </div>
                        <div id="realtimeDateFilters" hidden class="grid w-full grid-cols-1 gap-2 rounded-2xl border border-gray-100 bg-white p-3 shadow-sm sm:grid-cols-2 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)_auto_auto]">
                            <label class="flex flex-col gap-1 text-[10px] font-black uppercase tracking-widest text-gray-400">
                                <span>Du</span>
                                <input id="realtimeDateStart" type="date" class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-700" />
                            </label>
                            <label class="flex flex-col gap-1 text-[10px] font-black uppercase tracking-widest text-gray-400">
                                <span>Au</span>
                                <input id="realtimeDateEnd" type="date" class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-700" />
                            </label>
                            <button id="applyRealtimeDateBtn" class="w-full rounded-xl bg-black px-4 py-2 text-xs font-black uppercase tracking-widest text-white sm:w-auto">Appliquer</button>
                            <button id="clearRealtimeDateBtn" class="w-full rounded-xl border border-gray-200 bg-white px-4 py-2 text-xs font-black uppercase tracking-widest text-gray-700 sm:w-auto">Effacer</button>
                        </div>
                    </div>
                </div>
            </div>

            <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <article class="glass-panel p-6" id="livePresencePanel">
                    <h2 class="font-bold text-gray-900 mb-4 flex items-center gap-2">
                        <span class="relative flex h-2.5 w-2.5">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-purple-500"></span>
                        </span>
                        Utilisateurs actifs
                    </h2>
                    <div class="text-xs text-gray-400 mb-4" id="presenceCountLine">
                        <span class="skeleton skeleton-text inline-block align-middle" style="width: 55%; height: 12px; margin: 0;"></span>
                    </div>
                    <div id="livePresenceList" class="space-y-3">
                        <div class="flex items-center gap-3 p-2 rounded-xl">
                            <div class="skeleton skeleton-avatar flex-shrink-0" style="width: 32px; height: 32px; border-radius: 9999px;"></div>
                            <div class="flex-1 min-w-0">
                                <div class="skeleton skeleton-text" style="width: 55%; height: 12px; margin: 0 0 6px 0;"></div>
                                <div class="skeleton skeleton-text" style="width: 35%; height: 10px; margin: 0;"></div>
                            </div>
                            <div class="skeleton skeleton-text flex-shrink-0" style="width: 44px; height: 14px; margin: 0;"></div>
                        </div>
                        <div class="flex items-center gap-3 p-2 rounded-xl">
                            <div class="skeleton skeleton-avatar flex-shrink-0" style="width: 32px; height: 32px; border-radius: 9999px;"></div>
                            <div class="flex-1 min-w-0">
                                <div class="skeleton skeleton-text" style="width: 48%; height: 12px; margin: 0 0 6px 0;"></div>
                                <div class="skeleton skeleton-text" style="width: 40%; height: 10px; margin: 0;"></div>
                            </div>
                            <div class="skeleton skeleton-text flex-shrink-0" style="width: 44px; height: 14px; margin: 0;"></div>
                        </div>
                        <div class="flex items-center gap-3 p-2 rounded-xl">
                            <div class="skeleton skeleton-avatar flex-shrink-0" style="width: 32px; height: 32px; border-radius: 9999px;"></div>
                            <div class="flex-1 min-w-0">
                                <div class="skeleton skeleton-text" style="width: 52%; height: 12px; margin: 0 0 6px 0;"></div>
                                <div class="skeleton skeleton-text" style="width: 30%; height: 10px; margin: 0;"></div>
                            </div>
                            <div class="skeleton skeleton-text flex-shrink-0" style="width: 44px; height: 14px; margin: 0;"></div>
                        </div>
                    </div>
                </article>

                <article class="glass-panel p-6">
                    <div class="flex items-start justify-between gap-4">
                        <div>
                            <h2 class="font-bold text-gray-900">Top Boutiques du moment</h2>
                            <p class="text-sm text-gray-500">Classement basé sur les interactions récentes (leads).</p>
                        </div>
                        <div class="text-[10px] font-black uppercase tracking-widest text-gray-400" id="topVendorsMeta">
                            <span class="skeleton skeleton-text inline-block align-middle" style="width: 110px; height: 12px; margin: 0;"></span>
                        </div>
                    </div>
                    <div class="mt-6 grid grid-cols-1 sm:grid-cols-3 gap-6" id="topVendorsGrid">
                        <div class="p-6 bg-white rounded-3xl border border-gray-100 shadow-sm text-center">
                            <div class="w-16 h-16 mx-auto skeleton skeleton-avatar" style="border-radius: 9999px;"></div>
                            <div class="mt-4 skeleton skeleton-text" style="width: 70%; height: 12px; margin: 0 auto 8px auto;"></div>
                            <div class="skeleton skeleton-text" style="width: 45%; height: 10px; margin: 0 auto;"></div>
                        </div>
                        <div class="p-6 bg-white rounded-3xl border border-gray-100 shadow-sm text-center">
                            <div class="w-16 h-16 mx-auto skeleton skeleton-avatar" style="border-radius: 9999px;"></div>
                            <div class="mt-4 skeleton skeleton-text" style="width: 78%; height: 12px; margin: 0 auto 8px auto;"></div>
                            <div class="skeleton skeleton-text" style="width: 50%; height: 10px; margin: 0 auto;"></div>
                        </div>
                        <div class="p-6 bg-white rounded-3xl border border-gray-100 shadow-sm text-center">
                            <div class="w-16 h-16 mx-auto skeleton skeleton-avatar" style="border-radius: 9999px;"></div>
                            <div class="mt-4 skeleton skeleton-text" style="width: 62%; height: 12px; margin: 0 auto 8px auto;"></div>
                            <div class="skeleton skeleton-text" style="width: 42%; height: 10px; margin: 0 auto;"></div>
                        </div>
                    </div>
                </article>
            </section>
        </main>
    </div>

    <script>
        let currentDays = 7;
        let currentRealtimeDateRange = { start: null, end: null };
        const realtimeProfileCache = new Map();

        function setRealtimeDateFiltersVisible(isVisible) {
            const panel = document.getElementById('realtimeDateFilters');
            const button = document.getElementById('toggleRealtimeDateFiltersBtn');
            if (panel) panel.hidden = !isVisible;
            if (button) button.setAttribute('aria-expanded', isVisible ? 'true' : 'false');
        }

        function toggleRealtimeDateFilters() {
            const panel = document.getElementById('realtimeDateFilters');
            setRealtimeDateFiltersVisible(!(panel && !panel.hidden));
        }

        function setRealtimeRangeButtons(days) {
            document.querySelectorAll('.rt-range-btn').forEach((btn) => {
                const active = days != null && Number(btn.dataset.days) === Number(days);
                btn.classList.toggle('bg-black', active);
                btn.classList.toggle('text-white', active);
                btn.classList.toggle('bg-white', !active);
                btn.classList.toggle('border', !active);
                btn.classList.toggle('border-gray-200', !active);
                btn.classList.toggle('text-gray-500', !active);
            });
        }

        function syncRealtimeDateInputs() {
            const start = document.getElementById('realtimeDateStart');
            const end = document.getElementById('realtimeDateEnd');
            if (start) start.value = currentRealtimeDateRange.start || '';
            if (end) end.value = currentRealtimeDateRange.end || '';
        }

        function getRealtimeDateRangeFromInputs() {
            return {
                start: document.getElementById('realtimeDateStart')?.value || null,
                end: document.getElementById('realtimeDateEnd')?.value || null,
            };
        }

        function isLeadInRealtimeRange(lead, range = currentRealtimeDateRange) {
            if (!range || (!range.start && !range.end)) return true;
            const timestamp = new Date(lead?.date || lead?.created_at || 0).getTime();
            if (!timestamp) return false;
            if (range.start) {
                const startTime = new Date(`${range.start}T00:00:00`).getTime();
                if (!Number.isNaN(startTime) && timestamp < startTime) return false;
            }
            if (range.end) {
                const endTime = new Date(`${range.end}T23:59:59.999`).getTime();
                if (!Number.isNaN(endTime) && timestamp > endTime) return false;
            }
            return true;
        }

        function applyRealtimeDateRange() {
            currentRealtimeDateRange = getRealtimeDateRangeFromInputs();
            currentDays = (currentRealtimeDateRange.start || currentRealtimeDateRange.end) ? null : 7;
            setRealtimeRangeButtons(currentDays);
            setRealtimeDateFiltersVisible(true);
            renderTopVendors(
                (currentRealtimeDateRange.start || currentRealtimeDateRange.end)
                    ? { range: currentRealtimeDateRange }
                    : { days: currentDays }
            ).catch(() => { });
        }

        function clearRealtimeDateRange() {
            currentRealtimeDateRange = { start: null, end: null };
            currentDays = 7;
            syncRealtimeDateInputs();
            setRealtimeRangeButtons(currentDays);
            setRealtimeDateFiltersVisible(false);
            renderTopVendors({ days: currentDays }).catch(() => { });
        }

        function buildTopVendorsSkeletonHTML() {
            return `
                <div class="p-6 bg-white rounded-3xl border border-gray-100 shadow-sm text-center">
                    <div class="w-16 h-16 mx-auto skeleton skeleton-avatar" style="border-radius: 9999px;"></div>
                    <div class="mt-4 skeleton skeleton-text" style="width: 70%; height: 12px; margin: 0 auto 8px auto;"></div>
                    <div class="skeleton skeleton-text" style="width: 45%; height: 10px; margin: 0 auto;"></div>
                </div>
                <div class="p-6 bg-white rounded-3xl border border-gray-100 shadow-sm text-center">
                    <div class="w-16 h-16 mx-auto skeleton skeleton-avatar" style="border-radius: 9999px;"></div>
                    <div class="mt-4 skeleton skeleton-text" style="width: 78%; height: 12px; margin: 0 auto 8px auto;"></div>
                    <div class="skeleton skeleton-text" style="width: 50%; height: 10px; margin: 0 auto;"></div>
                </div>
                <div class="p-6 bg-white rounded-3xl border border-gray-100 shadow-sm text-center">
                    <div class="w-16 h-16 mx-auto skeleton skeleton-avatar" style="border-radius: 9999px;"></div>
                    <div class="mt-4 skeleton skeleton-text" style="width: 62%; height: 12px; margin: 0 auto 8px auto;"></div>
                    <div class="skeleton skeleton-text" style="width: 42%; height: 10px; margin: 0 auto;"></div>
                </div>
            `;
        }

        function setRangeButtons(days) {
            document.querySelectorAll('.rt-range-btn').forEach((btn) => {
                const active = Number(btn.dataset.days) === Number(days);
                btn.classList.toggle('bg-black', active);
                btn.classList.toggle('text-white', active);
                btn.classList.toggle('bg-white', !active);
                btn.classList.toggle('border', !active);
                btn.classList.toggle('border-gray-200', !active);
                btn.classList.toggle('text-gray-500', !active);
            });
        }

        function formatCount(value) {
            return Number(value || 0).toLocaleString('fr-FR');
        }

        function getLocalTimezone() {
            try {
                return Intl.DateTimeFormat().resolvedOptions().timeZone || 'local';
            } catch (_) {
                return 'local';
            }
        }

        function filterOutAdminPresence(users) {
            return (users || []).filter((u) => (u?.role || 'guest') !== 'admin');
        }

        function getUserDisplayName(user) {
            if (!user) return 'Utilisateur inconnu';
            if (window.UserManager?.getDisplayName) return window.UserManager.getDisplayName(user);
            const fallback = user.email ? user.email.split('@')[0] : 'Inconnu';
            return user.company_name || user.store_name || user.shop_name || user.full_name || user.name || fallback;
        }

        function getUserAvatar(user) {
            return user?.avatar ||
                user?.avatar_url ||
                user?.picture ||
                user?.photo_url ||
                user?.picture_url ||
                user?.cover_image ||
                user?.user_metadata?.avatar_url ||
                user?.user_metadata?.picture ||
                '';
        }

        function renderUserAvatar(user, fallbackName, className = 'w-8 h-8') {
            const avatarUrl = getUserAvatar(user);
            const label = (fallbackName || getUserDisplayName(user) || '?').trim();
            const initial = (label.charAt(0) || '?').toUpperCase();

            if (avatarUrl) {
                return `
                    <img
                        loading="lazy"
                        src="${avatarUrl}"
                        class="${className} rounded-full object-cover border border-gray-100 flex-shrink-0"
                        onerror="this.outerHTML='<div class=&quot;${className} rounded-full bg-gray-100 text-gray-500 flex items-center justify-center text-xs font-black flex-shrink-0&quot;>${initial}</div>';"
                    >
                `;
            }

            return `<div class="${className} rounded-full bg-gray-100 text-gray-500 flex items-center justify-center text-xs font-black flex-shrink-0">${initial}</div>`;
        }

        async function primeRealtimeProfiles(users) {
            const ids = [...new Set(
                (users || [])
                    .map((user) => user?.user_id)
                    .filter((id) => !!id && !realtimeProfileCache.has(id))
            )];

            if (!ids.length || !window.SupabaseAdapter?.getClient) return;

            try {
                const client = window.SupabaseAdapter.getClient();
                const { data, error } = await client
                    .from('users')
                    .select('*')
                    .in('id', ids);

                if (error) throw error;

                (data || []).forEach((profile) => {
                    realtimeProfileCache.set(profile.id, profile);
                });
            } catch (error) {
                console.warn('[Admin realtime] Unable to enrich presence profiles:', error?.message || error);
            }
        }

        async function renderPresenceUsers(users) {
            const list = document.getElementById('livePresenceList');
            if (!list) return;

            const filtered = filterOutAdminPresence(users);
            await primeRealtimeProfiles(filtered);

            const countLine = document.getElementById('presenceCountLine');
            if (countLine) countLine.textContent = `${formatCount(filtered.length)} en ligne (admin exclu)`;

            if (!filtered.length) {
                list.innerHTML = `<div class="text-xs text-gray-400 italic">Aucun utilisateur actif pour le moment.</div>`;
                return;
            }

            const roleColors = {
                supplier: { bg: 'bg-blue-100', text: 'text-blue-600', label: 'Vendeur' },
                customer: { bg: 'bg-green-100', text: 'text-green-600', label: 'Acheteur' },
                guest: { bg: 'bg-gray-100', text: 'text-gray-500', label: 'Invité' },
            };

            list.innerHTML = filtered.map((presenceUser) => {
                const role = presenceUser.role || 'guest';
                const colors = roleColors[role] || roleColors.guest;
                const profile = presenceUser?.user_id ? realtimeProfileCache.get(presenceUser.user_id) : null;
                const mergedUser = { ...presenceUser, ...profile };
                const name = getUserDisplayName(mergedUser) || 'Anonyme';
                const page = presenceUser.page ? presenceUser.page.split('/').pop().replace('.html', '') || 'accueil' : '-';

                return `
                <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-gray-50 transition-colors">
                    ${renderUserAvatar(mergedUser, name)}
                    <div class="flex-1 min-w-0">
                        <div class="text-xs font-bold text-gray-900 truncate">${name}</div>
                        <div class="text-[10px] text-gray-400 truncate">/${page}</div>
                    </div>
                    <span class="text-[9px] font-black uppercase tracking-wider ${colors.bg} ${colors.text} px-1.5 py-0.5 rounded-full flex-shrink-0">${colors.label}</span>
                </div>`;
            }).join('');
        }

        async function renderTopVendors({ days, range } = {}) {
            const grid = document.getElementById('topVendorsGrid');
            const meta = document.getElementById('topVendorsMeta');
            if (!grid) return;

            // Skeleton while loading (matches the final cards layout).
            grid.innerHTML = buildTopVendorsSkeletonHTML();
            if (meta) {
                meta.innerHTML = `<span class="skeleton skeleton-text inline-block align-middle" style="width: 110px; height: 12px; margin: 0;"></span>`;
            }

            if (!window.SupabaseAdapter?.getClient) {
                grid.innerHTML = `<div class="p-10 text-center text-gray-400 text-sm italic col-span-3">Supabase non disponible.</div>`;
                return;
            }

            const now = Date.now();
            const leads = (window.OrderManager?.data || []).filter((lead) => {
                if (range && (range.start || range.end)) {
                    return isLeadInRealtimeRange(lead, range);
                }
                const sinceMs = Math.max(1, Number(days || 7)) * 24 * 60 * 60 * 1000;
                const timestamp = new Date(lead?.date || lead?.created_at || 0).getTime();
                return timestamp && (now - timestamp) <= sinceMs;
            });

            let users = [];
            if (window.UserManager?.getUsers && window.UserManager._initialized) {
                users = window.UserManager.getUsers().filter((user) => user?.role === 'supplier');
            } else {
                const client = window.SupabaseAdapter.getClient();
                const { data, error } = await client.from('users').select('*').eq('role', 'supplier');
                if (error) {
                    grid.innerHTML = `<div class="p-10 text-center text-gray-400 text-sm italic col-span-3">Erreur chargement boutiques.</div>`;
                    return;
                }
                users = data || [];
            }

            const performance = {};
            leads.forEach((lead) => {
                if (!lead?.vendor_id) return;
                performance[lead.vendor_id] = (performance[lead.vendor_id] || 0) + 1;
            });

            const topVendors = users
                .map((user) => ({ ...user, score: performance[user.id] || 0 }))
                .filter((user) => user.score > 0)
                .sort((a, b) => b.score - a.score)
                .slice(0, 3);

            if (meta) {
                meta.textContent = (range && (range.start || range.end))
                    ? `${formatCount(leads.length)} leads • ${range.start || '...'} → ${range.end || '...'}`
                    : `${formatCount(leads.length)} leads • ${days}j`;
            }

            if (!topVendors.length) {
                grid.innerHTML = `<div class="p-10 text-center text-gray-400 text-sm italic col-span-3">Aucune boutique sur la période.</div>`;
                return;
            }

            grid.innerHTML = topVendors.map((vendor, idx) => `
                <div class="p-6 bg-white rounded-3xl border border-gray-100 shadow-sm hover:shadow-md transition-all text-center">
                    <div class="w-16 h-16 mx-auto flex items-center justify-center">
                        ${renderUserAvatar(vendor, getUserDisplayName(vendor), 'w-16 h-16')}
                    </div>
                    <div class="mt-4 font-black text-gray-900 truncate">${getUserDisplayName(vendor)}</div>
                    <div class="mt-1 text-[10px] font-black uppercase tracking-widest text-green-600">${formatCount(vendor.score)} leads</div>
                    <div class="mt-3 inline-flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-gray-400">
                        <span class="w-5 h-5 rounded-full bg-gray-900 text-white flex items-center justify-center text-[10px]">#${idx + 1}</span>
                        Top
                    </div>
                </div>
            `).join('');
        }

        async function boot() {
            syncRealtimeDateInputs();
            setRealtimeRangeButtons(currentDays);
            const meta = document.getElementById('realtimeMeta');
            if (meta) meta.textContent = `Fuseau: ${getLocalTimezone()} • Mise à jour: ${new Date().toLocaleString('fr-FR')}`;

            window.addEventListener('presenceUpdated', (e) => {
                renderPresenceUsers(e.detail?.users || []).catch((err) => {
                    console.warn('[Admin realtime] renderPresenceUsers error:', err);
                });
            });

            if (window.PresenceManager) {
                try {
                    const seed = window.PresenceManager.getActiveUsers?.() || [];
                    await renderPresenceUsers(seed);
                } catch (_) { }
            }

            await renderTopVendors({ days: currentDays });
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.rt-range-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    currentDays = Number(btn.dataset.days) || 7;
                    currentRealtimeDateRange = { start: null, end: null };
                    syncRealtimeDateInputs();
                    setRealtimeRangeButtons(currentDays);
                    setRealtimeDateFiltersVisible(false);
                    renderTopVendors({ days: currentDays }).catch(() => { });
                });
            });

            setRealtimeDateFiltersVisible(false);

            const toggleFiltersBtn = document.getElementById('toggleRealtimeDateFiltersBtn');
            if (toggleFiltersBtn) {
                toggleFiltersBtn.addEventListener('click', toggleRealtimeDateFilters);
            }

            const applyBtn = document.getElementById('applyRealtimeDateBtn');
            if (applyBtn) {
                applyBtn.addEventListener('click', applyRealtimeDateRange);
            }

            const clearBtn = document.getElementById('clearRealtimeDateBtn');
            if (clearBtn) {
                clearBtn.addEventListener('click', clearRealtimeDateRange);
            }

            const run = () => boot().catch((err) => console.error('[Admin realtime] boot error:', err));
            if (window.newketInitialized) run();
            else window.addEventListener('newketInitialized', run, { once: true });
        });
    </script>
</body>

</html>
