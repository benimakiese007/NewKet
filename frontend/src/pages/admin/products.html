    <script>
        let productsBootStarted = false;
        let isSponsoredFilterActive = false;
        let isFallbackFilterActive = false;
        
        // Track broken images asynchronously
        const brokenImageIds = new Set();
        let isBrokenCheckRunning = false;

        function isFallbackImage(p) {
            if (!p) return true;
            if (brokenImageIds.has(p.id)) return true;
            
            if (!p.image) return true;
            let imgStr = p.image;
            if (Array.isArray(imgStr)) {
                if (imgStr.length === 0) return true;
                imgStr = imgStr[0];
            }
            imgStr = String(imgStr).toLowerCase().trim();
            return imgStr === '' || 
                   imgStr === 'null' || 
                   imgStr === 'undefined' || 
                   imgStr === '[]' ||
                   imgStr.includes('default.') ||
                   imgStr.includes('logo-newket') ||
                   imgStr.includes('garde-fou');
        }

        async function checkBrokenImagesAsync(products) {
            if (isBrokenCheckRunning || !products) return;
            isBrokenCheckRunning = true;
            
            let updated = false;
            
            // Limit concurrent checks to avoid overwhelming the browser
            const BATCH_SIZE = 10;
            for (let i = 0; i < products.length; i += BATCH_SIZE) {
                const batch = products.slice(i, i + BATCH_SIZE);
                const promises = batch.map(p => {
                    return new Promise(resolve => {
                        // Already known as broken or already identified as fallback? Skip.
                        if (brokenImageIds.has(p.id) || isFallbackImage(p)) {
                            return resolve();
                        }
                        
                        let rawUrl = typeof p.image === 'string' ? p.image.split(',')[0] : (Array.isArray(p.image) ? p.image[0] : null);
                        if (!rawUrl) return resolve();
                        
                        let imgUrl = rawUrl.includes('||') ? rawUrl.split('||')[0].trim() : rawUrl.trim();
                        
                        const img = new Image();
                        img.onload = () => resolve();
                        img.onerror = () => {
                            brokenImageIds.add(p.id);
                            updated = true;
                            resolve();
                        };
                        img.src = imgUrl;
                    });
                });
                await Promise.all(promises);
                
                // Update UI incrementally if we found broken images
                if (updated) {
                    updateProductsTotal();
                    updated = false;
                }
            }
            isBrokenCheckRunning = false;
        }

        function toggleSponsoredFilter() {
            isSponsoredFilterActive = !isSponsoredFilterActive;
            const btn = document.getElementById('productsSponsoredBadge');
            if (isSponsoredFilterActive) {
                btn.classList.replace('bg-orange-50', 'bg-orange-500');
                btn.classList.replace('text-orange-600', 'text-white');
                btn.classList.replace('hover:bg-orange-100', 'hover:bg-orange-600');
            } else {
                btn.classList.replace('bg-orange-500', 'bg-orange-50');
                btn.classList.replace('text-white', 'text-orange-600');
                btn.classList.replace('hover:bg-orange-600', 'hover:bg-orange-100');
            }
            renderAdminProducts();
        }

        function toggleFallbackFilter() {
            isFallbackFilterActive = !isFallbackFilterActive;
            const btn = document.getElementById('fallbackFilterBtn');
            if (isFallbackFilterActive) {
                btn.classList.replace('bg-yellow-50', 'bg-yellow-500');
                btn.classList.replace('text-yellow-600', 'text-white');
                btn.classList.replace('hover:bg-yellow-100', 'hover:bg-yellow-600');
            } else {
                btn.classList.replace('bg-yellow-500', 'bg-yellow-50');
                btn.classList.replace('text-white', 'text-yellow-600');
                btn.classList.replace('hover:bg-yellow-600', 'hover:bg-yellow-100');
            }
            renderAdminProducts();
        }

        function updateProductsTotal() {
            const totalNode = document.getElementById('productsTotalCount');
            const sponsoredNode = document.getElementById('productsSponsoredCount');
            const fallbackNode = document.getElementById('productsFallbackCount');
            
            if (!window.ProductManager || typeof ProductManager.getProducts !== 'function') return;
            const products = ProductManager.getProducts() || [];
            
            if (ProductManager.loading !== false && products.length === 0) return;
            
            const total = typeof ProductManager?.getTotalCount === 'function'
                ? ProductManager.getTotalCount()
                : products.length;
                
            if (totalNode) totalNode.textContent = total;
            
            if (sponsoredNode) {
                const sponsoredCount = products.filter(p => p.pinned === true).length;
                sponsoredNode.textContent = sponsoredCount;
            }

            if (fallbackNode) {
                const fallbackCount = products.filter(p => isFallbackImage(p)).length;
                fallbackNode.textContent = fallbackCount;
            }
        }

        function filterProducts() {
            renderAdminProducts();
        }

        function renderAdminProducts() {
            const tbody = document.getElementById('productsBody');
            const emptyState = document.getElementById('emptyState');
            let products = ProductManager.getProducts();

            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            if (searchTerm) {
                products = products.filter(p => 
                    p.name.toLowerCase().includes(searchTerm) || 
                    (p.category && p.category.toLowerCase().includes(searchTerm)) ||
                    (p.id && p.id.toLowerCase().includes(searchTerm))
                );
            }

            if (isFallbackFilterActive) {
                products = products.filter(p => isFallbackImage(p));
            }

            if (isSponsoredFilterActive) {
                products = products.filter(p => p.pinned === true);
            }

            updateProductsTotal();

            // Start checking for broken images silently
            if (products.length > 0 && !isBrokenCheckRunning) {
                setTimeout(() => checkBrokenImagesAsync(ProductManager.getProducts()), 500);
            }

            if (ProductManager.loading !== false && products.length === 0) {
                if (!tbody.querySelector('.animate-pulse')) {
                    tbody.innerHTML = `
                            <tr class="animate-pulse">
                                <td class="p-4"><div class="skeleton w-4 h-4 rounded-md"></div></td>
                                <td class="p-4">
                                    <div class="flex items-center gap-4">
                                        <div class="skeleton w-16 h-16 rounded-2xl flex-shrink-0"></div>
                                        <div class="min-w-0 flex-1 space-y-2">
                                            <div class="skeleton h-4 w-3/4 rounded"></div>
                                            <div class="skeleton h-3 w-1/3 rounded"></div>
                                        </div>
                                    </div>
                                </td>
                                <td class="p-4"><div class="skeleton h-6 w-24 rounded-full"></div></td>
                                <td class="p-4"><div class="skeleton h-4 w-16 rounded"></div></td>
                                <td class="p-4"><div class="skeleton h-4 w-12 rounded"></div></td>
                                <td class="p-4 text-center"><div class="skeleton w-10 h-10 rounded-xl mx-auto"></div></td>
                                <td class="p-4 text-right">
                                    <div class="flex justify-end gap-2">
                                        <div class="skeleton w-10 h-10 rounded-xl"></div>
                                        <div class="skeleton w-10 h-10 rounded-xl"></div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="animate-pulse" style="animation-delay: 0.05s">
                                <td class="p-4"><div class="skeleton w-4 h-4 rounded-md"></div></td>
                                <td class="p-4">
                                    <div class="flex items-center gap-4">
                                        <div class="skeleton w-16 h-16 rounded-2xl flex-shrink-0"></div>
                                        <div class="min-w-0 flex-1 space-y-2">
                                            <div class="skeleton h-4 w-2/3 rounded"></div>
                                            <div class="skeleton h-3 w-1/4 rounded"></div>
                                        </div>
                                    </div>
                                </td>
                                <td class="p-4"><div class="skeleton h-6 w-20 rounded-full"></div></td>
                                <td class="p-4"><div class="skeleton h-4 w-14 rounded"></div></td>
                                <td class="p-4"><div class="skeleton h-4 w-10 rounded"></div></td>
                                <td class="p-4 text-center"><div class="skeleton w-10 h-10 rounded-xl mx-auto"></div></td>
                                <td class="p-4 text-right">
                                    <div class="flex justify-end gap-2">
                                        <div class="skeleton w-10 h-10 rounded-xl"></div>
                                        <div class="skeleton w-10 h-10 rounded-xl"></div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="animate-pulse" style="animation-delay: 0.1s">
                                <td class="p-4"><div class="skeleton w-4 h-4 rounded-md"></div></td>
                                <td class="p-4">
                                    <div class="flex items-center gap-4">
                                        <div class="skeleton w-16 h-16 rounded-2xl flex-shrink-0"></div>
                                        <div class="min-w-0 flex-1 space-y-2">
                                            <div class="skeleton h-4 w-1/2 rounded"></div>
                                            <div class="skeleton h-3 w-1/3 rounded"></div>
                                        </div>
                                    </div>
                                </td>
                                <td class="p-4"><div class="skeleton h-6 w-28 rounded-full"></div></td>
                                <td class="p-4"><div class="skeleton h-4 w-20 rounded"></div></td>
                                <td class="p-4"><div class="skeleton h-4 w-16 rounded"></div></td>
                                <td class="p-4 text-center"><div class="skeleton w-10 h-10 rounded-xl mx-auto"></div></td>
                                <td class="p-4 text-right">
                                    <div class="flex justify-end gap-2">
                                        <div class="skeleton w-10 h-10 rounded-xl"></div>
                                        <div class="skeleton w-10 h-10 rounded-xl"></div>
                                    </div>
                                </td>
                            </tr>
                            <tr class="animate-pulse" style="animation-delay: 0.15s">
                                <td class="p-4"><div class="skeleton w-4 h-4 rounded-md"></div></td>
                                <td class="p-4">
                                    <div class="flex items-center gap-4">
                                        <div class="skeleton w-16 h-16 rounded-2xl flex-shrink-0"></div>
                                        <div class="min-w-0 flex-1 space-y-2">
                                            <div class="skeleton h-4 w-3/4 rounded"></div>
                                            <div class="skeleton h-3 w-1/4 rounded"></div>
                                        </div>
                                    </div>
                                </td>
                                <td class="p-4"><div class="skeleton h-6 w-24 rounded-full"></div></td>
                                <td class="p-4"><div class="skeleton h-4 w-12 rounded"></div></td>
                                <td class="p-4"><div class="skeleton h-4 w-8 rounded"></div></td>
                                <td class="p-4 text-center"><div class="skeleton w-10 h-10 rounded-xl mx-auto"></div></td>
                                <td class="p-4 text-right">
                                    <div class="flex justify-end gap-2">
                                        <div class="skeleton w-10 h-10 rounded-xl"></div>
                                        <div class="skeleton w-10 h-10 rounded-xl"></div>
                                    </div>
                                </td>
                            </tr>
                    `;
                }
                emptyState.classList.add('hidden');
                return;
            }

            if (products.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            tbody.innerHTML = products.map((p, i) => {
                const isLowStock = (p.stock || 0) < 10;
                const isOut = (p.stock || 0) <= 0;
                const isPinned = p.pinned === true;
                
                return `
                <tr class="group animate-premium" style="animation-delay: ${i * 0.05}s">
                    <td class="p-4 admin-products-table__select">
                        <input type="checkbox" value="${p.id}" name="product-select-${p.id}" onclick="updateSelectedUI()" data-track-action="admin_products:row_select_change" class="product-checkbox rounded-md border-gray-300 text-black focus:ring-black">
                    </td>
                    <td class="p-4">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 bg-gray-50 rounded-2xl p-2 relative overflow-hidden group-hover:scale-110 transition-transform flex-shrink-0">
                                <img loading="lazy" src="${window.resolveProductImageSource ? window.resolveProductImageSource(p) : window.getOptimizedImageUrl(p.image ? p.image.split(',')[0] : '')}"${window.buildResponsiveImageSrcSet ? ` srcset="${window.buildResponsiveImageSrcSet(window.resolveProductImageSource ? window.resolveProductImageSource(p) : (p.image ? p.image.split(',')[0] : ''), [120, 180, 240], { quality: 75 })}" sizes="160px"` : ''} class="w-full h-full object-contain" onerror="this.src='https://res.cloudinary.com/dzhnphyp3/image/upload/f_auto,q_auto/v1782572380/newket_assets/frontend/src/assets/Images/default.jpg'">
                                ${isOut ? '<div class="absolute inset-0 bg-red-500/20 backdrop-blur-[1px] flex items-center justify-center text-[8px] font-black text-red-700 uppercase pointer-events-none">Épuisé</div>' : ''}
                            </div>
                            <div class="min-w-0 flex-1 admin-table-cell-text">
                                <div class="font-black text-gray-900 leading-tight admin-table-clamp-2" title="${p.name}">${p.name}</div>
                                <div class="admin-table-truncate text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-1" title="${p.id.substring(0, 8).toUpperCase()}">${p.id.substring(0, 8).toUpperCase()}</div>
                            </div>
                        </div>
                    </td>
                    <td class="p-4">
                        <div class="badge-premium bg-gray-100 text-gray-500 inline-block max-w-full admin-table-truncate align-middle" title="${p.category}">
                            ${p.category}
                        </div>
                    </td>
                    <td class="p-4">
                        <div class="font-black text-gray-900">${CurrencyManager.formatPrice(p.price)}</div>
                    </td>
                    <td class="p-4">
                        <div class="flex flex-col">
                            <span class="font-black ${isLowStock ? 'text-red-500' : 'text-gray-900'}">${p.stock || 0}</span>
                            ${isLowStock ? `<span class="text-[9px] font-bold text-red-400 uppercase tracking-tighter">${isOut ? 'Vente stoppée' : 'Stock critique'}</span>` : ''}
                        </div>
                    </td>
                    <td class="p-4 text-center">
                        <button onclick="togglePin('${p.id}')" data-track-action="admin_products:pin_toggle_click"
                            class="w-10 h-10 rounded-xl transition-all flex items-center justify-center mx-auto ${isPinned ? 'bg-orange-50 text-orange-500 shadow-lg' : 'bg-gray-50 text-gray-300 hover:text-orange-500'}" title="${isPinned ? 'Retirer le sponsoring' : 'Mettre en avant'}">
                            <iconify-icon icon="solar:star-bold-duotone" width="20"></iconify-icon>
                        </button>
                    </td>
                    <td class="p-4 text-right">
                        <div class="flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none group-hover:pointer-events-auto">
                            <button onclick="editProduct('${p.id}')" data-track-action="admin_products:edit_click" class="w-10 h-10 rounded-xl bg-gray-50 text-gray-400 hover:bg-black hover:text-white transition-all flex items-center justify-center">
                                <iconify-icon icon="solar:pen-bold" width="20"></iconify-icon>
                            </button>
                            <button onclick="deleteProduct('${p.id}')" data-track-action="admin_products:delete_click" class="w-10 h-10 rounded-xl bg-red-50 text-red-300 hover:bg-red-500 hover:text-white transition-all flex items-center justify-center">
                                <iconify-icon icon="solar:trash-bin-trash-bold" width="20"></iconify-icon>
                            </button>
                        </div>
                    </td>
                </tr>
                `}).join('');

            if (window.CurrencyManager) CurrencyManager.updateAllPrices();
        }

        function openModal(isEdit = false) {
            const modal = document.getElementById('productModal');
            document.getElementById('modalTitle').textContent = isEdit ? 'Modifier l\'Article' : 'Nouvel Article';
            if (!isEdit) document.getElementById('productForm').reset();
            modal.classList.add('flex'); // Add flex back
            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('productModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex'); // Remove flex
        }

        function editProduct(id) {
            const p = ProductManager.getProduct(id);
            if (p) {
                document.getElementById('pId').value = p.id;
                document.getElementById('pName').value = p.name;
                document.getElementById('pCategory').value = p.category;
                document.getElementById('pPrice').value = p.price;
                document.getElementById('pImage').value = p.image;
                document.getElementById('pStock').value = p.stock || 0;
                openModal(true);
            }
        }

        function toggleSelectAll() {
            const master = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.product-checkbox');
            checkboxes.forEach(c => c.checked = master.checked);
            updateSelectedUI();
        }

        function updateSelectedUI() {
            const selected = document.querySelectorAll('.product-checkbox:checked');
            const bar = document.getElementById('bulkActionsBar');
            const count = document.getElementById('selectedCountText');

            if (selected.length > 0) {
                bar.classList.add('flex'); // Ensure flex is added
                bar.classList.remove('hidden');
                count.textContent = selected.length;
            } else {
                bar.classList.add('hidden');
                bar.classList.remove('flex');
            }
        }

        function deselectAll() {
            document.getElementById('selectAll').checked = false;
            document.querySelectorAll('.product-checkbox').forEach(c => c.checked = false);
            updateSelectedUI();
        }

        function deleteSelected() {
            const selected = Array.from(document.querySelectorAll('.product-checkbox:checked')).map(c => c.value);
            if (!confirm(`Voulez-vous vraiment supprimer ces ${selected.length} articles ?`)) return;
            ProductManager.deleteBulk(selected);
            renderAdminProducts();
            updateSelectedUI();
            if (window.showToast) showToast(`${selected.length} articles retirés.`, 'info');
        }

        function updateSelectedCategory(category) {
            const selected = Array.from(document.querySelectorAll('.product-checkbox:checked')).map(c => c.value);
            ProductManager.updateCategoryBulk(selected, category);
            renderAdminProducts();
            updateSelectedUI();
            if (window.showToast) showToast('Catégories mises à jour.', 'success');
        }

        function deleteProduct(id) {
            if (!confirm('Supprimer cet article ?')) return;
            ProductManager.deleteProduct(id);
            renderAdminProducts();
            if (window.showToast) showToast('Article retiré.', 'info');
        }

        async function togglePin(id) {
            const p = ProductManager.getProduct(id);
            if (!p) return;
            const newPinned = !p.pinned;
            
            // Mise à jour optimiste pour la réactivité de l'UI
            p.pinned = newPinned;
            renderAdminProducts();
            
            try {
                const updated = await ProductManager.updateProduct(id, { pinned: newPinned });
                if (!updated) {
                    // Annuler si la mise à jour échoue
                    p.pinned = !newPinned;
                    renderAdminProducts();
                    if (window.showToast) showToast('Impossible de modifier ce produit. Réessayez ou rechargez la page.', 'error');
                }
            } catch (err) {
                // Annuler en cas d'erreur
                p.pinned = !newPinned;
                renderAdminProducts();
                if (window.showToast) showToast('Connexion perdue. Vérifiez votre réseau et réessayez.', 'error');
            }
        }

        document.getElementById('productForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('pId').value;
            const product = {
                name: document.getElementById('pName').value,
                category: document.getElementById('pCategory').value,
                price: parseFloat(document.getElementById('pPrice').value),
                image: document.getElementById('pImage').value || 'https://res.cloudinary.com/dzhnphyp3/image/upload/f_auto,q_auto/v1782572380/newket_assets/frontend/src/assets/Images/default.jpg',
                stock: parseInt(document.getElementById('pStock').value) || 0
            };

            if (id) ProductManager.updateProduct(id, product);
            else {
                product.id = 'p-' + Date.now();
                ProductManager.addProduct(product);
            }
            closeModal();
            renderAdminProducts();
            if (window.showToast) showToast('Catalogue mis à jour.', 'success');
        });

        function initializeProducts() {
            if (productsBootStarted) return;
            productsBootStarted = true;

            // Always listen for future updates
            window.addEventListener('productsUpdated', renderAdminProducts);

            // Admin: load ALL products (no pagination limit)
            if (window.ProductManager && typeof ProductManager.fetchAll === 'function') {
                renderAdminProducts(); // Show skeleton immediately
                ProductManager.fetchAll();
                return;
            }

            // Fallback if fetchAll not available yet
            if (window.ProductManager && typeof ProductManager.getProducts === 'function') {
                const existingProducts = ProductManager.getProducts();
                if (existingProducts && existingProducts.length > 0) {
                    renderAdminProducts();
                    return;
                }
                if (ProductManager.loading === false) {
                    renderAdminProducts();
                    return;
                }
            }
            // Otherwise show skeleton and wait for productsUpdated
            renderAdminProducts();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('filter') === 'sponsored') {
                toggleSponsoredFilter();
            }
            if (urlParams.get('filter') === 'fallback') {
                toggleFallbackFilter();
            }
            const searchParam = urlParams.get('search');
            if (searchParam) {
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.value = searchParam;
                }
            }

            if (window.newketInitialized) {
                initializeProducts();
            } else {
                window.addEventListener('newketInitialized', initializeProducts, { once: true });
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>

</html>
