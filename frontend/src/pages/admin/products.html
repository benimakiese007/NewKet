<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="512x512" href="/Images/Logo NewKet PNG.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NewKet">
    <title>Catalogue | NewKet Admin</title>
    <link rel="stylesheet" href="/src/assets/css/input.css">
    <link rel="preconnect" href="https://code.iconify.design" crossorigin>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    
    <script>
        (function(){try{localStorage.setItem('newket_theme','light');}catch(e){}document.documentElement.classList.remove('dark');})();
    </script>
    
    <script type="module" src="/src/services/app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/assets/css/style.css">
    <link rel="stylesheet" href="/src/assets/css/responsive.css">
    <link rel="stylesheet" href="/src/assets/css/admin.css">
</head>

<body class="text-gray-900">
    <div id="adminNavbarPlaceholder"></div>

    <div class="admin-shell max-w-[1800px] mx-auto px-4 sm:px-8 pb-12 flex flex-col lg:flex-row gap-8">
        <div id="adminSidebarPlaceholder"></div>
        <script type="module" src="/src/services/admin-layout.js"></script>

        <!-- Main Content -->
        <main class="flex-1 min-w-0 space-y-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 animate-premium">
                <div>
                    <h1 class="text-4xl font-black tracking-tight text-gray-900" id="pageTitle">Gestion du Catalogue</h1>
                    <p class="text-gray-500 font-medium" id="pageSubtitle">Supervisez et modérez l'ensemble des articles de la plateforme.</p>
                </div>
                <button onclick="openModal()"
                    class="bg-black text-white px-8 py-3.5 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-gray-800 transition-all flex items-center gap-2 shadow-2xl shadow-black/20">
                    <iconify-icon icon="solar:add-circle-bold-duotone" width="20"></iconify-icon>
                    Ajouter un Produit
                </button>
            </div>

            <!-- Bulk Actions Bar (Flottante Premium) -->
            <div id="bulkActionsBar"
                class="hidden sticky top-32 z-40 glass-panel p-4 mb-8 bg-black/90 backdrop-blur-xl text-white flex justify-between items-center animate-premium border-white/10 shadow-2xl shadow-black/40">
                <div class="flex items-center gap-6">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-xs font-black" id="selectedCountText">0</div>
                        <span class="text-[10px] font-black uppercase tracking-widest opacity-60">Sélectionnés</span>
                    </div>
                    
                    <div class="h-6 w-px bg-white/10"></div>
                    
                    <button onclick="deleteSelected()"
                        class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-red-400 hover:text-red-300 transition-all hover:scale-105">
                        <iconify-icon icon="solar:trash-bin-trash-bold" width="18"></iconify-icon>
                        Supprimer la sélection
                    </button>
                    
                    <div class="h-6 w-px bg-white/10"></div>
                    
                    <div class="flex items-center gap-4">
                        <iconify-icon icon="solar:tag-bold" class="text-white/40" width="18"></iconify-icon>
                        <select onchange="updateSelectedCategory(this.value); this.value='';"
                            class="bg-transparent text-[10px] font-black uppercase tracking-widest outline-none cursor-pointer border-none focus:ring-0">
                            <option value="" disabled selected class="bg-black">Déplacer vers...</option>
                            <option value="Femme" class="bg-black">Femme</option>
                            <option value="Homme" class="bg-black">Homme</option>
                            <option value="Tech & Gadgets" class="bg-black">Tech & Gadgets</option>
                            <option value="HIGH-TECH" class="bg-black">HIGH-TECH</option>
                            <option value="Art de vivre" class="bg-black">Art de vivre</option>
                            <option value="Beauté" class="bg-black">Beauté</option>
                        </select>
                    </div>
                </div>
                <button onclick="deselectAll()"
                    class="px-6 py-2 rounded-xl bg-white/10 text-[10px] font-black uppercase tracking-widest hover:bg-white/20 transition-all">Annuler</button>
            </div>

            <div class="glass-panel overflow-hidden animate-premium stagger-1">
                <div class="overflow-x-auto">
                    <table class="premium-table w-full">
                        <thead>
                            <tr>
                                <th class="w-10">
                                    <input type="checkbox" id="selectAll" name="selectAll" onclick="toggleSelectAll()"
                                        class="rounded-md border-gray-300 text-black focus:ring-black">
                                </th>
                                <th>Produit</th>
                                <th>Catégorie</th>
                                <th>Prix</th>
                                <th>Stock</th>
                                <th class="text-center">Épinglé</th>
                                <th class="text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsBody">
                            <!-- Products loaded via JS -->
                        </tbody>
                    </table>
                </div>
                <div id="emptyState" class="hidden p-20 text-center">
                    <div class="w-20 h-20 bg-gray-50 rounded-3xl flex items-center justify-center mx-auto mb-6">
                        <iconify-icon icon="solar:box-bold-duotone" class="text-gray-200" width="48"></iconify-icon>
                    </div>
                    <p class="text-gray-400 font-bold">Le catalogue est actuellement vide.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Product Modal (Premium Redesign) -->
    <div id="productModal" class="hidden fixed inset-0 z-[100] items-center justify-center p-4 sm:p-6">
        <div class="absolute inset-0 bg-gray-950/60 backdrop-blur-md transition-opacity" onclick="closeModal()"></div>

        <div class="relative w-full max-w-xl bg-white rounded-[2.5rem] shadow-2xl overflow-hidden animate-premium border border-white/20" id="productModalContent">
            <!-- Header -->
            <div class="p-8 border-b border-gray-100 flex items-center justify-between bg-gradient-to-br from-gray-50 to-white">
                <div>
                    <h2 class="text-2xl font-black tracking-tight text-gray-900" id="modalTitle">Nouveau Produit</h2>
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-1">Configurez les détails de l'article</p>
                </div>
                <button onclick="closeModal()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-gray-100 text-gray-400 hover:text-black transition-all">
                    <iconify-icon icon="solar:close-circle-bold" width="24"></iconify-icon>
                </button>
            </div>

            <!-- Form -->
            <form id="productForm" class="p-8 space-y-6">
                <input type="hidden" id="pId">
                
                <div class="space-y-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-1">Nom du produit</label>
                        <input type="text" id="pName" name="pName" required
                            class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-bold placeholder:text-gray-300" placeholder="Ex: Montre Luxe Quartz">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-1">Catégorie</label>
                            <select id="pCategory" name="pCategory"
                                class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-bold appearance-none cursor-pointer">
                                <option>Femme</option>
                                <option>Homme</option>
                                <option>Tech & Gadgets</option>
                                <option>HIGH-TECH</option>
                                <option>Art de vivre</option>
                                <option>Beauté</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-1">Stock Initial</label>
                            <input type="number" id="pStock" name="pStock" required value="0"
                                class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-black">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-1">Prix de vente (FC)</label>
                        <div class="relative">
                            <input type="number" id="pPrice" name="pPrice" required
                                class="w-full pl-6 pr-16 py-5 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-black text-xl">
                            <span class="absolute right-6 top-1/2 -translate-y-1/2 font-black text-gray-300">FC</span>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-1">Url de l'image principale</label>
                        <div class="relative">
                            <iconify-icon icon="solar:gallery-bold" class="absolute left-6 top-1/2 -translate-y-1/2 text-gray-300" width="20"></iconify-icon>
                            <input type="text" id="pImage" name="pImage" placeholder="https://..."
                                class="w-full pl-14 pr-6 py-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-black transition-all font-medium text-sm">
                        </div>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit"
                        class="w-full bg-black text-white py-5 rounded-2xl font-black text-xs uppercase tracking-widest shadow-2xl shadow-black/20 hover:bg-gray-800 transition-all flex items-center justify-center gap-3">
                        <iconify-icon icon="solar:check-read-bold" width="20"></iconify-icon>
                        Enregistrer dans le Catalogue
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function renderAdminProducts() {
            const tbody = document.getElementById('productsBody');
            const emptyState = document.getElementById('emptyState');
            const products = ProductManager.getProducts();

            if (products.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            tbody.innerHTML = products.map((p, i) => {
                const isLowStock = (p.stock || 0) < 10;
                const isOut = (p.stock || 0) <= 0;
                const isPinned = p.pinned === true;
                
                return `
                <tr class="group animate-premium" style="animation-delay: ${i * 0.05}s">
                    <td class="p-4">
                        <input type="checkbox" value="${p.id}" name="product-select-${p.id}" onclick="updateSelectedUI()" class="product-checkbox rounded-md border-gray-300 text-black focus:ring-black">
                    </td>
                    <td class="p-4">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 bg-gray-50 rounded-2xl p-2 relative overflow-hidden group-hover:scale-110 transition-transform">
                                <img loading="lazy" src="${window.getOptimizedImageUrl(p.image ? p.image.split(',')[0] : '')}" class="w-full h-full object-contain" onerror="this.src='../../assets/Images/default.png'">
                                ${isOut ? '<div class="absolute inset-0 bg-red-500/20 backdrop-blur-[1px] flex items-center justify-center text-[8px] font-black text-red-700 uppercase">Épuisé</div>' : ''}
                            </div>
                            <div>
                                <div class="font-black text-gray-900 leading-tight">${p.name}</div>
                                <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-1">${p.id.substring(0, 8).toUpperCase()}</div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div class="badge-premium bg-gray-100 text-gray-500">
                            ${p.category}
                        </div>
                    </td>
                    <td>
                        <div class="font-black text-gray-900">${CurrencyManager.formatPrice(p.price)}</div>
                    </td>
                    <td>
                        <div class="flex flex-col">
                            <span class="font-black ${isLowStock ? 'text-red-500' : 'text-gray-900'}">${p.stock || 0}</span>
                            ${isLowStock ? `<span class="text-[9px] font-bold text-red-400 uppercase tracking-tighter">${isOut ? 'Vente stoppée' : 'Stock critique'}</span>` : ''}
                        </div>
                    </td>
                    <td class="text-center">
                        <button onclick="togglePin('${p.id}')" 
                            class="w-10 h-10 rounded-xl transition-all flex items-center justify-center mx-auto ${isPinned ? 'bg-orange-50 text-orange-500 shadow-lg' : 'bg-gray-50 text-gray-300 hover:text-orange-500'}" title="${isPinned ? 'Désépingler' : 'Mettre en avant'}">
                            <iconify-icon icon="solar:star-bold-duotone" width="20"></iconify-icon>
                        </button>
                    </td>
                    <td class="p-4 text-right">
                        <div class="flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="editProduct('${p.id}')" class="w-10 h-10 rounded-xl bg-gray-50 text-gray-400 hover:bg-black hover:text-white transition-all flex items-center justify-center">
                                <iconify-icon icon="solar:pen-bold" width="20"></iconify-icon>
                            </button>
                            <button onclick="deleteProduct('${p.id}')" class="w-10 h-10 rounded-xl bg-red-50 text-red-300 hover:bg-red-500 hover:text-white transition-all flex items-center justify-center">
                                <iconify-icon icon="solar:trash-bin-trash-bold" width="20"></iconify-icon>
                            </button>
                        </div>
                    </td>
                </tr>
                `}).join('');

            if (window.CurrencyManager) CurrencyManager.updateAllPrices();
        }

        function openModal(isEdit = false) {
            const modal = document.getElementById('productModal');
            document.getElementById('modalTitle').textContent = isEdit ? 'Modifier l\'Article' : 'Nouvel Article';
            if (!isEdit) document.getElementById('productForm').reset();
            modal.classList.add('flex'); // Add flex back
            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('productModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex'); // Remove flex
        }

        function editProduct(id) {
            const p = ProductManager.getProduct(id);
            if (p) {
                document.getElementById('pId').value = p.id;
                document.getElementById('pName').value = p.name;
                document.getElementById('pCategory').value = p.category;
                document.getElementById('pPrice').value = p.price;
                document.getElementById('pImage').value = p.image;
                document.getElementById('pStock').value = p.stock || 0;
                openModal(true);
            }
        }

        function toggleSelectAll() {
            const master = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.product-checkbox');
            checkboxes.forEach(c => c.checked = master.checked);
            updateSelectedUI();
        }

        function updateSelectedUI() {
            const selected = document.querySelectorAll('.product-checkbox:checked');
            const bar = document.getElementById('bulkActionsBar');
            const count = document.getElementById('selectedCountText');

            if (selected.length > 0) {
                bar.classList.add('flex'); // Ensure flex is added
                bar.classList.remove('hidden');
                count.textContent = selected.length;
            } else {
                bar.classList.add('hidden');
                bar.classList.remove('flex');
            }
        }

        function deselectAll() {
            document.getElementById('selectAll').checked = false;
            document.querySelectorAll('.product-checkbox').forEach(c => c.checked = false);
            updateSelectedUI();
        }

        function deleteSelected() {
            const selected = Array.from(document.querySelectorAll('.product-checkbox:checked')).map(c => c.value);
            if (!confirm(`Voulez-vous vraiment supprimer ces ${selected.length} articles ?`)) return;
            ProductManager.deleteBulk(selected);
            renderAdminProducts();
            updateSelectedUI();
            if (window.showToast) showToast(`${selected.length} articles retirés.`, 'info');
        }

        function updateSelectedCategory(category) {
            const selected = Array.from(document.querySelectorAll('.product-checkbox:checked')).map(c => c.value);
            ProductManager.updateCategoryBulk(selected, category);
            renderAdminProducts();
            updateSelectedUI();
            if (window.showToast) showToast('Catégories mises à jour.', 'success');
        }

        function deleteProduct(id) {
            if (!confirm('Supprimer cet article ?')) return;
            ProductManager.deleteProduct(id);
            renderAdminProducts();
            if (window.showToast) showToast('Article retiré.', 'info');
        }

        async function togglePin(id) {
            const p = ProductManager.getProduct(id);
            if (!p) return;
            const newPinned = !p.pinned;
            await ProductManager.updateProduct(id, { pinned: newPinned });
            renderAdminProducts();
            if (window.showToast) showToast(newPinned ? 'Produit épinglé !' : 'Décroché.', 'success');
        }

        document.getElementById('productForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('pId').value;
            const product = {
                name: document.getElementById('pName').value,
                category: document.getElementById('pCategory').value,
                price: parseFloat(document.getElementById('pPrice').value),
                image: document.getElementById('pImage').value || 'Images/default.png',
                stock: parseInt(document.getElementById('pStock').value) || 0
            };

            if (id) ProductManager.updateProduct(id, product);
            else {
                product.id = 'p-' + Date.now();
                ProductManager.addProduct(product);
            }
            closeModal();
            renderAdminProducts();
            if (window.showToast) showToast('Catalogue mis à jour.', 'success');
        });

        function initializeProducts() {
            renderAdminProducts();
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.newketInitialized) {
                initializeProducts();
            } else {
                window.addEventListener('newketInitialized', initializeProducts);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>

</html>
