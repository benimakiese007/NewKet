    <script>
        const currentCharts = {};
        let currentDiagnosticsTimeframe = 'all';
        let currentDiagnosticsDateRange = { start: null, end: null };

        function setDiagnosticsDateFiltersVisible(isVisible) {
            const panel = document.getElementById('diagnosticsDateFilters');
            const button = document.getElementById('toggleDiagnosticsDateFiltersBtn');
            if (panel) panel.hidden = !isVisible;
            if (button) button.setAttribute('aria-expanded', isVisible ? 'true' : 'false');
        }

        function toggleDiagnosticsDateFilters() {
            const panel = document.getElementById('diagnosticsDateFilters');
            setDiagnosticsDateFiltersVisible(!(panel && !panel.hidden));
        }

        function setDiagnosticsTimeButtons(activeTimeframe) {
            document.querySelectorAll('.time-btn').forEach((btn) => {
                const active = activeTimeframe && btn.dataset.timeframe === activeTimeframe;
                btn.classList.toggle('bg-black', active);
                btn.classList.toggle('text-white', active);
                btn.classList.toggle('text-gray-400', !active);
            });
        }

        function syncDiagnosticsDateInputs() {
            const start = document.getElementById('diagnosticsDateStart');
            const end = document.getElementById('diagnosticsDateEnd');
            if (start) start.value = currentDiagnosticsDateRange.start || '';
            if (end) end.value = currentDiagnosticsDateRange.end || '';
        }

        function getDiagnosticsDateRangeFromInputs() {
            return {
                start: document.getElementById('diagnosticsDateStart')?.value || null,
                end: document.getElementById('diagnosticsDateEnd')?.value || null
            };
        }

        function applyDiagnosticsDateRange() {
            currentDiagnosticsDateRange = getDiagnosticsDateRangeFromInputs();
            currentDiagnosticsTimeframe = (currentDiagnosticsDateRange.start || currentDiagnosticsDateRange.end) ? 'custom' : 'all';
            setDiagnosticsTimeButtons(currentDiagnosticsTimeframe === 'custom' ? null : currentDiagnosticsTimeframe);
            setDiagnosticsDateFiltersVisible(true);
            scheduleDiagnosticsRender(currentDiagnosticsTimeframe);
        }

        function clearDiagnosticsDateRange() {
            currentDiagnosticsDateRange = { start: null, end: null };
            currentDiagnosticsTimeframe = 'all';
            syncDiagnosticsDateInputs();
            setDiagnosticsTimeButtons(currentDiagnosticsTimeframe);
            setDiagnosticsDateFiltersVisible(false);
            scheduleDiagnosticsRender(currentDiagnosticsTimeframe);
        }

        function updateTimeframe(timeframe, btn) {
            currentDiagnosticsTimeframe = timeframe;
            currentDiagnosticsDateRange = { start: null, end: null };
            syncDiagnosticsDateInputs();
            setDiagnosticsTimeButtons(timeframe);
            setDiagnosticsDateFiltersVisible(false);
            renderDiagnostics(timeframe);
        }

        let diagnosticsRenderTimer = null;
        let diagnosticsBootAt = Date.now();
        let diagnosticsHasRenderedOnce = false;
        let diagnosticsEmptyStateApplied = false;

        function applyDiagnosticsEmptyState(reason = '') {
            if (diagnosticsEmptyStateApplied) return;
            diagnosticsEmptyStateApplied = true;
            try { clearTimeout(diagnosticsRenderTimer); } catch (e) {}

            const aovEl = document.getElementById('statsAOV');
            if (aovEl) {
                aovEl.dataset.priceCdf = '0';
                aovEl.textContent = '—';
            }

            const deadStockEl = document.getElementById('deadStockCount');
            if (deadStockEl) deadStockEl.textContent = '0';

            const loyaltyEl = document.getElementById('loyaltyRate');
            if (loyaltyEl) loyaltyEl.textContent = '0.0%';

            const topCatEl = document.getElementById('topCategoryDisplay');
            if (topCatEl) topCatEl.textContent = 'N/A';

            const stockList = document.getElementById('stockHealthList');
            if (stockList) stockList.innerHTML = '<div class="glass-panel p-4 text-center text-gray-400 italic">Aucune donn\u00E9e de catalogue \u00E0 analyser.</div>';

            const topProducts = document.getElementById('diagnosticsTopProducts');
            if (topProducts) topProducts.innerHTML = '<div class="glass-panel p-4 col-span-full text-center text-gray-400 italic">Aucune vente \u00E0 analyser.</div>';

            const auditLog = document.getElementById('auditLog');
            if (auditLog) auditLog.innerHTML = '<div class="glass-panel p-4 text-sm text-gray-400 italic">Aucune activit\u00E9 r\u00E9cente.</div>';

            const canvas = document.getElementById('categoryRevenueChart');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
                const wrapper = canvas.parentElement;
                if (wrapper && !document.getElementById('categoryRevenueChartEmpty')) {
                    const msg = document.createElement('div');
                    msg.id = 'categoryRevenueChartEmpty';
                    msg.className = 'text-center text-sm text-gray-400 italic mt-3';
                    msg.textContent = 'Aucune r\u00E9partition \u00E0 afficher.' + (reason ? ` (${reason})` : '');
                    wrapper.appendChild(msg);
                }
            }
        }

        function scheduleDiagnosticsRender(timeframe = currentDiagnosticsTimeframe) {
            if (diagnosticsEmptyStateApplied) return;
            try { clearTimeout(diagnosticsRenderTimer); } catch (e) {}
            diagnosticsRenderTimer = setTimeout(() => renderDiagnostics(timeframe), 60);
        }

        function renderDiagnostics(timeframe = currentDiagnosticsTimeframe) {
            if (diagnosticsEmptyStateApplied) return;
            const loadingTooLong = (Date.now() - diagnosticsBootAt) > 3500;
            if (!window.OrderManager || !window.CurrencyManager) {
                if (loadingTooLong) applyDiagnosticsEmptyState('chargement');
                scheduleDiagnosticsRender(timeframe);
                return;
            }
            // Keep skeletons until orders/products have completed their first load.
            if (OrderManager._initialized !== true || OrderManager._fetchPromise) {
                if (loadingTooLong) applyDiagnosticsEmptyState('commandes');
                scheduleDiagnosticsRender(timeframe);
                return;
            }
            if (!window.ProductManager || typeof ProductManager.getProducts !== 'function') {
                if (loadingTooLong) applyDiagnosticsEmptyState('catalogue');
                scheduleDiagnosticsRender(timeframe);
                return;
            }
            const isProductLoading = ProductManager.loading === true || ProductManager._loading === true;
            if (isProductLoading && (ProductManager.getProducts() || []).length === 0) {
                if (loadingTooLong) applyDiagnosticsEmptyState('produits');
                scheduleDiagnosticsRender(timeframe);
                return;
            }

            try {
                diagnosticsHasRenderedOnce = true;
                currentDiagnosticsTimeframe = timeframe;
                const stats = OrderManager.getAdvancedStats(timeframe, currentDiagnosticsDateRange);

                // Stats Update
                const aovEl = document.getElementById('statsAOV');
                aovEl.dataset.priceCdf = stats.aov;
                aovEl.innerHTML = CurrencyManager.formatPrice(stats.aov);

                document.getElementById('deadStockCount').textContent = stats.deadStockCount;
                document.getElementById('loyaltyRate').textContent = `${Number(stats.loyaltyRate || 0).toFixed(1)}%`;

                // Top Category
                const cats = Object.entries(stats.categorySales).sort((a, b) => b[1] - a[1]);
                document.getElementById('topCategoryDisplay').textContent = cats.length > 0 ? cats[0][0] : 'N/A';

                // Charts
                initDiagnosticsCharts(stats);

                // Stock Health
                renderStockHealth(stats);

                // Top Products
                renderAdvancedTopProducts(stats);

                // Audit Log
                renderAuditLog();
            } catch (err) {
                console.error('[Diagnostics] Error rendering:', err);
                applyDiagnosticsEmptyState('Erreur');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            diagnosticsBootAt = Date.now();
            syncDiagnosticsDateInputs();
            setDiagnosticsTimeButtons(currentDiagnosticsTimeframe);
            setDiagnosticsDateFiltersVisible(false);

            const toggleFiltersBtn = document.getElementById('toggleDiagnosticsDateFiltersBtn');
            if (toggleFiltersBtn) {
                toggleFiltersBtn.addEventListener('click', toggleDiagnosticsDateFilters);
            }

            const applyBtn = document.getElementById('applyDiagnosticsDateBtn');
            if (applyBtn) {
                applyBtn.addEventListener('click', applyDiagnosticsDateRange);
            }

            const clearBtn = document.getElementById('clearDiagnosticsDateBtn');
            if (clearBtn) {
                clearBtn.addEventListener('click', clearDiagnosticsDateRange);
            }

            if (window.newketInitialized) {
                scheduleDiagnosticsRender();
            } else {
                window.addEventListener('newketInitialized', () => scheduleDiagnosticsRender());
            }

            // Always attempt a render: avoids missing the event if it fired before this script ran.
            scheduleDiagnosticsRender();

            window.addEventListener('currencyChanged', () => scheduleDiagnosticsRender(currentDiagnosticsTimeframe));
            window.addEventListener('ordersUpdated', () => scheduleDiagnosticsRender(currentDiagnosticsTimeframe));
            window.addEventListener('productsUpdated', () => scheduleDiagnosticsRender(currentDiagnosticsTimeframe));
            window.addEventListener('activitiesUpdated', () => scheduleDiagnosticsRender(currentDiagnosticsTimeframe));

            // If the app never becomes ready (offline, auth missing, API down), switch skeletons to a message.
            setTimeout(() => {
                if (!diagnosticsHasRenderedOnce && !diagnosticsEmptyStateApplied) {
                    applyDiagnosticsEmptyState('indisponible');
                }
            }, 4000);
        });

        function initDiagnosticsCharts(stats) {
            const canvas = document.getElementById('categoryRevenueChart');
            const ctx = canvas.getContext('2d');

            // Destroy previous chart if exists
            if (currentCharts.category) currentCharts.category.destroy();

            const labels = Object.keys(stats.categorySales);
            const activeCurrency = window.CurrencyManager?.currentCurrency || 'CDF';
            const data = Object.values(stats.categorySales).map(value => {
                if (activeCurrency === 'USD' && window.CurrencyManager) {
                    return CurrencyManager.convert(Number(value) || 0, true);
                }
                return Number(value) || 0;
            });
            const revenueLabel = activeCurrency === 'USD' ? 'Revenus (USD)' : 'Revenus (FC)';

            if (labels.length === 0) {
                // Clear canvas or show message
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            currentCharts.category = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: revenueLabel,
                        data: data,
                        backgroundColor: '#000000',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#f1f5f9' },
                            ticks: {
                                font: { size: 10 },
                                callback: (value) => {
                                    if (!window.CurrencyManager) return value;
                                    return CurrencyManager.formatPrice(value, activeCurrency, activeCurrency === 'CDF');
                                }
                            }
                        },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });
        }

        let isDiagnosticsBrokenCheckRunning = false;
        const diagnosticsBrokenImageIds = new Set();

        async function checkDiagnosticsBrokenImagesAsync(products) {
            if (isDiagnosticsBrokenCheckRunning || !products) return;
            isDiagnosticsBrokenCheckRunning = true;
            
            let updated = false;
            const BATCH_SIZE = 10;
            
            for (let i = 0; i < products.length; i += BATCH_SIZE) {
                const batch = products.slice(i, i + BATCH_SIZE);
                const promises = batch.map(p => {
                    return new Promise(resolve => {
                        if (diagnosticsBrokenImageIds.has(p.id)) return resolve();
                        
                        let imgStr = p.image;
                        if (!imgStr) return resolve();
                        if (Array.isArray(imgStr)) imgStr = imgStr[0];
                        if (!imgStr) return resolve();
                        
                        // Check if it already matches string conditions
                        const lowImg = String(imgStr).toLowerCase().trim();
                        if (lowImg === '' || lowImg === 'null' || lowImg === 'undefined' || 
                            lowImg === '[]' || lowImg.includes('default.') || 
                            lowImg.includes('logo-newket') || lowImg.includes('garde-fou')) {
                            return resolve();
                        }
                        
                        let imgUrl = typeof p.image === 'string' ? p.image.split(',')[0] : (Array.isArray(p.image) ? p.image[0] : null);
                        if (!imgUrl) return resolve();
                        
                        const img = new Image();
                        img.onload = () => resolve();
                        img.onerror = () => {
                            diagnosticsBrokenImageIds.add(p.id);
                            updated = true;
                            resolve();
                        };
                        img.src = imgUrl;
                    });
                });
                await Promise.all(promises);
                
                if (updated) {
                    renderStockHealth(window.ProductManager?.stats || { deadStockList: [] });
                    updated = false;
                }
            }
            isDiagnosticsBrokenCheckRunning = false;
        }

        function renderStockHealth(stats) {
            const list = document.getElementById('stockHealthList');
            const products = ProductManager.getProducts();

            const criticalStock = products.filter(p => (p.stock || 0) < 5);
            const deadStock = stats.deadStockList;

            const fallbackImages = products.filter(p => {
                if (!p) return true;
                if (diagnosticsBrokenImageIds.has(p.id)) return true;
                if (!p.image) return true;
                let imgStr = p.image;
                if (Array.isArray(imgStr)) {
                    if (imgStr.length === 0) return true;
                    imgStr = imgStr[0];
                }
                imgStr = String(imgStr).toLowerCase().trim();
                return imgStr === '' || 
                       imgStr === 'null' || 
                       imgStr === 'undefined' || 
                       imgStr === '[]' ||
                       imgStr.includes('default.') ||
                       imgStr.includes('logo-newket') ||
                       imgStr.includes('garde-fou');
            });

            // Start async check silently
            if (products.length > 0 && !isDiagnosticsBrokenCheckRunning) {
                setTimeout(() => checkDiagnosticsBrokenImagesAsync(products), 500);
            }

            let html = '';

            if (fallbackImages.length > 0) {
                html += `<div class="p-4 bg-yellow-50 rounded-2xl">
                    <div class="text-[10px] font-black text-yellow-600 uppercase mb-2">ATTENTION : Images manquantes (Garde-fou)</div>
                    <div class="space-y-2">
                        ${fallbackImages.slice(0, 3).map(p => `
                            <div class="flex justify-between text-sm font-medium text-gray-700 items-center gap-2">
                                <span class="truncate flex-1">${p.name}</span>
                                <a href="/admin/products.html?filter=fallback&search=${encodeURIComponent(p.name)}" class="text-[10px] font-black uppercase text-yellow-600 hover:underline shrink-0 ml-2">Corriger</a>
                            </div>
                        `).join('')}
                        ${fallbackImages.length > 3 ? `<div class="text-[10px] font-black text-yellow-500 uppercase mt-2 text-right">+ ${fallbackImages.length - 3} autres</div>` : ''}
                    </div>
                </div>`;
            }

            if (criticalStock.length > 0) {
                html += `<div class="p-4 bg-red-50 rounded-2xl">
                    <div class="text-[10px] font-black text-red-600 uppercase mb-2">CRITIQUE : Rupture imminente</div>
                    <div class="space-y-2">
                        ${criticalStock.slice(0, 3).map(p => `
                            <div class="flex justify-between text-sm font-bold text-gray-900">
                                <span>${p.name}</span>
                                <span class="text-red-600">${p.stock} pces</span>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }

            if (deadStock.length > 0) {
                html += `<div class="p-4 bg-gray-50 rounded-2xl">
                    <div class="text-[10px] font-black text-gray-400 uppercase mb-2">ALERTE : Produit dormant</div>
                    <div class="space-y-2">
                        ${deadStock.slice(0, 3).map(p => `
                            <div class="flex justify-between text-sm font-medium text-gray-500">
                                <span>${p.name}</span>
                                <span class="text-[10px] font-black uppercase">0 Vente</span>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }

            list.innerHTML = html || '<div class="text-center py-8 text-gray-400 italic">Tout est en ordre.</div>';
        }

        function renderAdvancedTopProducts(stats) {
            const list = document.getElementById('diagnosticsTopProducts');

            if (stats.topProducts.length === 0) {
                list.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400">Pas de ventes à analyser.</div>';
                return;
            }

            list.innerHTML = stats.topProducts.map(p => `
                <div class="glass-panel p-4 flex gap-4 items-center">
                    <img loading="lazy" src="${window.resolveProductImageSource ? window.resolveProductImageSource(p) : window.getOptimizedImageUrl(p.image)}"${window.buildResponsiveImageSrcSet ? ` srcset="${window.buildResponsiveImageSrcSet(window.resolveProductImageSource ? window.resolveProductImageSource(p) : p.image, [48, 64, 96], { quality: 70 })}" sizes="64px"` : ''} class="w-16 h-16 rounded-xl object-contain bg-gray-50 p-2" onerror="this.src='https://res.cloudinary.com/dzhnphyp3/image/upload/f_auto,q_auto/v1782572380/newket_assets/frontend/src/assets/Images/default.jpg'">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-gray-900 truncate">${p.name}</h4>
                        <div class="text-[10px] font-black text-gray-400 uppercase">${p.salesCount} ventes régulières</div>
                        <div class="mt-2 text-sm font-black text-black">${CurrencyManager.formatPrice(p.revenue)} de revenus générés</div>
                    </div>
                </div>
            `).join('');
        }

        function renderAuditLog() {
            const list = document.getElementById('auditLog');
            if (!window.ActivityManager || typeof ActivityManager.getActivities !== 'function') {
                list.innerHTML = `
                    <div class="grid gap-3">
                        <div class="glass-panel p-4">
                            <div class="skeleton skeleton-text" style="width: 22%; height: 10px; margin-bottom: 0.8rem;"></div>
                            <div class="skeleton skeleton-text" style="width: 72%; height: 14px; margin-bottom: 0.5rem;"></div>
                            <div class="skeleton skeleton-text" style="width: 48%; height: 12px; margin-bottom: 0;"></div>
                        </div>
                        <div class="glass-panel p-4">
                            <div class="skeleton skeleton-text" style="width: 18%; height: 10px; margin-bottom: 0.8rem;"></div>
                            <div class="skeleton skeleton-text" style="width: 66%; height: 14px; margin-bottom: 0.5rem;"></div>
                            <div class="skeleton skeleton-text" style="width: 42%; height: 12px; margin-bottom: 0;"></div>
                        </div>
                        <div class="glass-panel p-4">
                            <div class="skeleton skeleton-text" style="width: 16%; height: 10px; margin-bottom: 0.8rem;"></div>
                            <div class="skeleton skeleton-text" style="width: 58%; height: 14px; margin-bottom: 0.5rem;"></div>
                            <div class="skeleton skeleton-text" style="width: 36%; height: 12px; margin-bottom: 0;"></div>
                        </div>
                    </div>`;
                return;
            }

            const activities = ActivityManager.getActivities() || [];
            if (activities.length === 0) {
                list.innerHTML = '<div class="glass-panel p-4 text-sm text-gray-400 italic">Aucune activité récente.</div>';
                return;
            }

            list.innerHTML = activities.map(a => `
                <div class="p-4 flex gap-4 items-start">
                    <div class="w-2 h-2 rounded-full mt-1.5 ${a.type === 'order' ? 'bg-green-500' : (a.type === 'stock' ? 'bg-orange-500' : 'bg-blue-500')}"></div>
                    <div>
                        <div class="text-sm font-medium text-gray-900">${a.text}</div>
                        <div class="text-[10px] font-bold text-gray-400 uppercase mt-0.5">${ActivityManager.formatTime(a.time)}</div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>

</html>
