<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="512x512" href="/Images/Logo NewKet PNG.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="theme-color" content="#013220">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NewKet">
    <title>Diagnostics | NewKet Admin</title>
    <script>
        (function () {
            try {
                const params = new URLSearchParams(window.location.search);
                if (params.get('embedded') === '1') {
                    document.documentElement.classList.add('admin-embedded-mode');
                }
            } catch (_) {}
        })();
    </script>
    <link rel="stylesheet" href="/src/assets/css/input.css">
    <script src="/vendor/iconify-preload.js"></script>
    <script src="/vendor/iconify-icon.min.js"></script><script type="module" src="/src/services/app.js"></script>
    <script src="/vendor/chart.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/assets/css/style.css">
    <link rel="stylesheet" href="/src/assets/css/responsive.css">
    <link rel="stylesheet" href="/src/assets/css/admin.css">
</head>

<body class="text-gray-900">
    <div id="adminNavbarPlaceholder"></div>

    <div class="admin-shell max-w-[1800px] mx-auto px-4 sm:px-8 flex flex-col lg:flex-row gap-6">
        <div id="adminSidebarPlaceholder"></div>
        <script type="module" src="/src/services/admin-layout.js"></script>

        <!-- Main Content -->
        <main class="flex-1 min-w-0 space-y-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h1 class="text-3xl font-black tracking-tight text-gray-900" id="pageTitle">Analyses Médicales Plateforme</h1>
                    <p class="text-gray-500" id="pageSubtitle">Diagnostic complet des performances globales et du catalogue mondial.</p>
                </div>
                <!-- Timeframe Selector -->
                <div class="flex items-center bg-white border border-gray-200 rounded-xl p-1 shadow-sm">
                    <button onclick="updateTimeframe('day', this)"
                        class="time-btn px-4 py-2 text-xs font-bold uppercase tracking-widest rounded-lg transition-all hover:bg-gray-50 text-gray-400">Jour</button>
                    <button onclick="updateTimeframe('week', this)"
                        class="time-btn px-4 py-2 text-xs font-bold uppercase tracking-widest rounded-lg transition-all hover:bg-gray-50 text-gray-400">Semaine</button>
                    <button onclick="updateTimeframe('month', this)"
                        class="time-btn px-4 py-2 text-xs font-bold uppercase tracking-widest rounded-lg transition-all hover:bg-gray-50 text-gray-400">Mois</button>
                    <button onclick="updateTimeframe('year', this)"
                        class="time-btn px-4 py-2 text-xs font-bold uppercase tracking-widest rounded-lg transition-all hover:bg-gray-50 text-gray-400">Année</button>
                    <button onclick="updateTimeframe('all', this)"
                        class="time-btn px-4 py-2 text-xs font-bold uppercase tracking-widest rounded-lg transition-all bg-black text-white">Tout</button>
                </div>
            </div>

            <!-- Enhanced Stats Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="glass-panel p-6 flex flex-col gap-1">
                    <div
                        class="w-10 h-10 rounded-xl bg-orange-50 text-orange-500 flex items-center justify-center mb-4">
                        <iconify-icon icon="solar:bag-bold" width="24"></iconify-icon>
                    </div>
                    <p class="text-[10px] font-black uppercase tracking-widest text-gray-400">Panier Moyen (AOV)</p>
                    <div class="text-2xl font-black text-gray-900" id="statsAOV" data-price-cdf="0"><div class="skeleton skeleton-text" style="width:60%;height:28px;margin:0;"></div></div>
                </div>
                <div class="glass-panel p-6 flex flex-col gap-1 border-gray-100">
                    <div
                        class="w-10 h-10 rounded-xl bg-purple-50 text-purple-500 flex items-center justify-center mb-4">
                        <iconify-icon icon="solar:ranking-bold" width="24"></iconify-icon>
                    </div>
                    <p class="text-[10px] font-black uppercase tracking-widest text-gray-400">Top Catégorie</p>
                    <div class="text-xl font-black text-gray-900" id="topCategoryDisplay"><span class="skeleton inline-block h-6 w-32 rounded-xl align-middle"></span></div>
                </div>
                <div class="glass-panel p-6 flex flex-col gap-1 bg-red-50 border-red-100">
                    <div class="w-10 h-10 rounded-xl bg-white text-red-500 flex items-center justify-center mb-4">
                        <iconify-icon icon="solar:archive-bold" width="24"></iconify-icon>
                    </div>
                    <p class="text-[10px] font-black uppercase tracking-widest text-red-400">Stock Mort (0 Ventes)</p>
                    <div class="text-2xl font-black text-red-600" id="deadStockCount"><div class="skeleton skeleton-text" style="width:35%;height:28px;margin:0;"></div></div>
                </div>
                <div class="glass-panel p-6 flex flex-col gap-1 border-gray-100">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-500 flex items-center justify-center mb-4">
                        <iconify-icon icon="solar:user-heart-bold" width="24"></iconify-icon>
                    </div>
                    <p class="text-[10px] font-black uppercase tracking-widest text-gray-400">Taux Fidélité</p>
                    <div class="text-2xl font-black text-gray-900" id="loyaltyRate"><div class="skeleton skeleton-text" style="width:45%;height:28px;margin:0;"></div></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Detailed Revenue Chart -->
                <div class="glass-panel p-6">
                    <h3 class="font-bold text-gray-900 mb-6">Répartition des revenus par catégorie</h3>
                    <div class="h-[300px]">
                        <canvas id="categoryRevenueChart"></canvas>
                    </div>
                </div>

                <!-- Stock Health -->
                <div class="glass-panel p-6">
                    <h3 class="font-bold text-gray-900 mb-6">Santé du catalogue</h3>
                    <div id="stockHealthList" class="space-y-4">
                        <!-- Stock health items injected here -->
                    </div>
                </div>
            </div>

            <!-- Top Performing Products -->
            <div class="glass-panel p-6">
                <h3 class="font-bold text-gray-900 mb-6 flex items-center gap-2">
                    <iconify-icon icon="solar:star-bold" width="20" class="text-yellow-500"></iconify-icon>
                    Anatomie des meilleures ventes
                </h3>
                <div id="diagnosticsTopProducts" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div class="skeleton-card"><div class="skeleton skeleton-shimmer skeleton-image"></div><div class="skeleton skeleton-shimmer skeleton-text" style="width: 30%"></div><div class="skeleton skeleton-shimmer skeleton-text" style="width: 50%"></div><div class="skeleton skeleton-shimmer skeleton-title"></div><div class="skeleton skeleton-shimmer skeleton-text" style="width: 40%"></div><div class="skeleton skeleton-shimmer skeleton-price"></div><div class="skeleton skeleton-shimmer skeleton-button"></div></div>
                    <div class="skeleton-card"><div class="skeleton skeleton-shimmer skeleton-image"></div><div class="skeleton skeleton-shimmer skeleton-text" style="width: 30%"></div><div class="skeleton skeleton-shimmer skeleton-text" style="width: 50%"></div><div class="skeleton skeleton-shimmer skeleton-title"></div><div class="skeleton skeleton-shimmer skeleton-text" style="width: 40%"></div><div class="skeleton skeleton-shimmer skeleton-price"></div><div class="skeleton skeleton-shimmer skeleton-button"></div></div>
                    <div class="skeleton-card"><div class="skeleton skeleton-shimmer skeleton-image"></div><div class="skeleton skeleton-shimmer skeleton-text" style="width: 30%"></div><div class="skeleton skeleton-shimmer skeleton-text" style="width: 50%"></div><div class="skeleton skeleton-shimmer skeleton-title"></div><div class="skeleton skeleton-shimmer skeleton-text" style="width: 40%"></div><div class="skeleton skeleton-shimmer skeleton-price"></div><div class="skeleton skeleton-shimmer skeleton-button"></div></div>
                </div>
            </div>

            <!-- Activity Logs / Diagnostics -->
            <div class="glass-panel overflow-hidden">
                <div class="p-6 border-b border-gray-100">
                    <h3 class="font-bold text-gray-900">Journal d'audit système</h3>
                </div>
                <div class="divide-y divide-gray-50 max-h-[400px] overflow-y-auto" id="auditLog">
                    <div class="glass-panel p-4 m-4"><div class="skeleton skeleton-text" style="width: 70%; height: 14px; margin-bottom: 0.6rem;"></div><div class="skeleton skeleton-text" style="width: 35%; height: 12px; margin-bottom: 0;"></div></div>
                    <div class="glass-panel p-4 m-4"><div class="skeleton skeleton-text" style="width: 70%; height: 14px; margin-bottom: 0.6rem;"></div><div class="skeleton skeleton-text" style="width: 35%; height: 12px; margin-bottom: 0;"></div></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const currentCharts = {};
        let currentDiagnosticsTimeframe = 'all';

        function updateTimeframe(timeframe, btn) {
            currentDiagnosticsTimeframe = timeframe;

            // Update active button styles
            document.querySelectorAll('.time-btn').forEach(b => {
                b.classList.remove('bg-black', 'text-white');
                b.classList.add('text-gray-400');
            });
            btn.classList.remove('text-gray-400');
            btn.classList.add('bg-black', 'text-white');

            renderDiagnostics(timeframe);
        }

        let diagnosticsRenderTimer = null;
        let diagnosticsBootAt = Date.now();
        let diagnosticsHasRenderedOnce = false;
        let diagnosticsEmptyStateApplied = false;

        function applyDiagnosticsEmptyState(reason = '') {
            if (diagnosticsEmptyStateApplied) return;
            diagnosticsEmptyStateApplied = true;
            try { clearTimeout(diagnosticsRenderTimer); } catch (e) {}

            const aovEl = document.getElementById('statsAOV');
            if (aovEl) {
                aovEl.dataset.priceCdf = '0';
                aovEl.textContent = '—';
            }

            const deadStockEl = document.getElementById('deadStockCount');
            if (deadStockEl) deadStockEl.textContent = '0';

            const loyaltyEl = document.getElementById('loyaltyRate');
            if (loyaltyEl) loyaltyEl.textContent = '0.0%';

            const topCatEl = document.getElementById('topCategoryDisplay');
            if (topCatEl) topCatEl.textContent = 'N/A';

            const stockList = document.getElementById('stockHealthList');
            if (stockList) stockList.innerHTML = '<div class="text-center py-8 text-gray-400 italic">Aucune donn\u00E9e de catalogue \u00E0 analyser.</div>';

            const topProducts = document.getElementById('diagnosticsTopProducts');
            if (topProducts) topProducts.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400 italic">Aucune vente \u00E0 analyser.</div>';

            const auditLog = document.getElementById('auditLog');
            if (auditLog) auditLog.innerHTML = '<div class="p-6 text-sm text-gray-400 italic">Aucune activit\u00E9 r\u00E9cente.</div>';

            const canvas = document.getElementById('categoryRevenueChart');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
                const wrapper = canvas.parentElement;
                if (wrapper && !document.getElementById('categoryRevenueChartEmpty')) {
                    const msg = document.createElement('div');
                    msg.id = 'categoryRevenueChartEmpty';
                    msg.className = 'text-center text-sm text-gray-400 italic mt-3';
                    msg.textContent = 'Aucune r\u00E9partition \u00E0 afficher.' + (reason ? ` (${reason})` : '');
                    wrapper.appendChild(msg);
                }
            }
        }

        function scheduleDiagnosticsRender(timeframe = currentDiagnosticsTimeframe) {
            if (diagnosticsEmptyStateApplied) return;
            try { clearTimeout(diagnosticsRenderTimer); } catch (e) {}
            diagnosticsRenderTimer = setTimeout(() => renderDiagnostics(timeframe), 60);
        }

        function renderDiagnostics(timeframe = currentDiagnosticsTimeframe) {
            if (diagnosticsEmptyStateApplied) return;
            const loadingTooLong = (Date.now() - diagnosticsBootAt) > 3500;
            if (!window.OrderManager || !window.CurrencyManager) {
                if (loadingTooLong) applyDiagnosticsEmptyState('chargement');
                scheduleDiagnosticsRender(timeframe);
                return;
            }
            // Keep skeletons until orders/products have completed their first load.
            if (OrderManager._initialized !== true || OrderManager._fetchPromise) {
                if (loadingTooLong) applyDiagnosticsEmptyState('commandes');
                scheduleDiagnosticsRender(timeframe);
                return;
            }
            if (!window.ProductManager || typeof ProductManager.getProducts !== 'function') {
                if (loadingTooLong) applyDiagnosticsEmptyState('catalogue');
                scheduleDiagnosticsRender(timeframe);
                return;
            }
            if (ProductManager.loading !== false && (ProductManager.getProducts() || []).length === 0) {
                if (loadingTooLong) applyDiagnosticsEmptyState('produits');
                scheduleDiagnosticsRender(timeframe);
                return;
            }

            diagnosticsHasRenderedOnce = true;
            currentDiagnosticsTimeframe = timeframe;
            const stats = OrderManager.getAdvancedStats(timeframe);

            // Stats Update
            const aovEl = document.getElementById('statsAOV');
            aovEl.dataset.priceCdf = stats.aov;
            aovEl.innerHTML = CurrencyManager.formatPrice(stats.aov);

            document.getElementById('deadStockCount').textContent = stats.deadStockCount;
            document.getElementById('loyaltyRate').textContent = `${Number(stats.loyaltyRate || 0).toFixed(1)}%`;

            // Top Category
            const cats = Object.entries(stats.categorySales).sort((a, b) => b[1] - a[1]);
            document.getElementById('topCategoryDisplay').textContent = cats.length > 0 ? cats[0][0] : 'N/A';

            // Charts
            initDiagnosticsCharts(stats);

            // Stock Health
            renderStockHealth(stats);

            // Top Products
            renderAdvancedTopProducts(stats);

            // Audit Log
            renderAuditLog();
        }

        document.addEventListener('DOMContentLoaded', () => {
            diagnosticsBootAt = Date.now();
            if (window.newketInitialized) {
                scheduleDiagnosticsRender();
            } else {
                window.addEventListener('newketInitialized', () => scheduleDiagnosticsRender());
            }

            // Always attempt a render: avoids missing the event if it fired before this script ran.
            scheduleDiagnosticsRender();

            window.addEventListener('currencyChanged', () => scheduleDiagnosticsRender(currentDiagnosticsTimeframe));
            window.addEventListener('ordersUpdated', () => scheduleDiagnosticsRender(currentDiagnosticsTimeframe));
            window.addEventListener('productsUpdated', () => scheduleDiagnosticsRender(currentDiagnosticsTimeframe));
            window.addEventListener('activitiesUpdated', () => scheduleDiagnosticsRender(currentDiagnosticsTimeframe));

            // If the app never becomes ready (offline, auth missing, API down), switch skeletons to a message.
            setTimeout(() => {
                if (!diagnosticsHasRenderedOnce && !diagnosticsEmptyStateApplied) {
                    applyDiagnosticsEmptyState('indisponible');
                }
            }, 4000);
        });

        function initDiagnosticsCharts(stats) {
            const canvas = document.getElementById('categoryRevenueChart');
            const ctx = canvas.getContext('2d');

            // Destroy previous chart if exists
            if (currentCharts.category) currentCharts.category.destroy();

            const labels = Object.keys(stats.categorySales);
            const activeCurrency = window.CurrencyManager?.currentCurrency || 'CDF';
            const data = Object.values(stats.categorySales).map(value => {
                if (activeCurrency === 'USD' && window.CurrencyManager) {
                    return CurrencyManager.convert(Number(value) || 0, true);
                }
                return Number(value) || 0;
            });
            const revenueLabel = activeCurrency === 'USD' ? 'Revenus (USD)' : 'Revenus (FC)';

            if (labels.length === 0) {
                // Clear canvas or show message
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            currentCharts.category = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: revenueLabel,
                        data: data,
                        backgroundColor: '#000000',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#f1f5f9' },
                            ticks: {
                                font: { size: 10 },
                                callback: (value) => {
                                    if (!window.CurrencyManager) return value;
                                    return CurrencyManager.formatPrice(value, activeCurrency, activeCurrency === 'CDF');
                                }
                            }
                        },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });
        }

        function renderStockHealth(stats) {
            const list = document.getElementById('stockHealthList');
            const products = ProductManager.getProducts();

            const criticalStock = products.filter(p => (p.stock || 0) < 5);
            const deadStock = stats.deadStockList;

            let html = '';

            if (criticalStock.length > 0) {
                html += `<div class="p-4 bg-red-50 rounded-2xl">
                    <div class="text-[10px] font-black text-red-600 uppercase mb-2">CRITIQUE : Rupture imminente</div>
                    <div class="space-y-2">
                        ${criticalStock.slice(0, 3).map(p => `
                            <div class="flex justify-between text-sm font-bold text-gray-900">
                                <span>${p.name}</span>
                                <span class="text-red-600">${p.stock} pces</span>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }

            if (deadStock.length > 0) {
                html += `<div class="p-4 bg-gray-50 rounded-2xl">
                    <div class="text-[10px] font-black text-gray-400 uppercase mb-2">ALERTE : Produit dormant</div>
                    <div class="space-y-2">
                        ${deadStock.slice(0, 3).map(p => `
                            <div class="flex justify-between text-sm font-medium text-gray-500">
                                <span>${p.name}</span>
                                <span class="text-[10px] font-black uppercase">0 Vente</span>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }

            list.innerHTML = html || '<div class="text-center py-8 text-gray-400 italic">Tout est en ordre.</div>';
        }

        function renderAdvancedTopProducts(stats) {
            const list = document.getElementById('diagnosticsTopProducts');

            if (stats.topProducts.length === 0) {
                list.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400">Pas de ventes à analyser.</div>';
                return;
            }

            list.innerHTML = stats.topProducts.map(p => `
                <div class="glass-panel p-4 flex gap-4 items-center">
                    <img loading="lazy" src="../${p.image}" class="w-16 h-16 rounded-xl object-contain bg-gray-50 p-2">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-gray-900 truncate">${p.name}</h4>
                        <div class="text-[10px] font-black text-gray-400 uppercase">${p.salesCount} ventes régulières</div>
                        <div class="mt-2 text-sm font-black text-black">${CurrencyManager.formatPrice(p.price * p.salesCount)} de revenus générés</div>
                    </div>
                </div>
            `).join('');
        }

        function renderAuditLog() {
            const list = document.getElementById('auditLog');
            if (!window.ActivityManager || typeof ActivityManager.getActivities !== 'function') {
                list.innerHTML = '<div class="p-4 text-sm text-gray-400 italic">Chargement du journal…</div>';
                return;
            }

            const activities = ActivityManager.getActivities() || [];
            if (activities.length === 0) {
                list.innerHTML = '<div class="p-4 text-sm text-gray-400 italic">Aucune activité récente.</div>';
                return;
            }

            list.innerHTML = activities.map(a => `
                <div class="p-4 flex gap-4 items-start">
                    <div class="w-2 h-2 rounded-full mt-1.5 ${a.type === 'order' ? 'bg-green-500' : (a.type === 'stock' ? 'bg-orange-500' : 'bg-blue-500')}"></div>
                    <div>
                        <div class="text-sm font-medium text-gray-900">${a.text}</div>
                        <div class="text-[10px] font-bold text-gray-400 uppercase mt-0.5">${ActivityManager.formatTime(a.time)}</div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>

</html>
