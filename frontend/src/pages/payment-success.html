<!DOCTYPE html>
<html lang="fr" class="bg-[#f8fafc]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="512x512" href="/Images/Logo NewKet PNG.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="theme-color" content="#013220">
    <title>Paiement confirme | NewKet</title>
    <meta name="description" content="Confirmation de paiement NewKet. Retrouvez votre reference de transaction et accedez a vos commandes en toute securite.">
    <script src="/vendor/iconify-preload.js"></script>
    <script src="/vendor/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="/src/services/app.js" type="module"></script>
    <link rel="stylesheet" href="/src/assets/css/input.css">
    <link rel="stylesheet" href="/src/assets/css/style.css">
    <link rel="stylesheet" href="/src/assets/css/responsive.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-premium {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .hero-gradient {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #333333 100%);
        }
    </style>
</head>
<body class="min-h-screen bg-[#f8fafc] text-gray-900 antialiased">
    <div id="header-placeholder"></div>
    <div class="fixed inset-0 -z-10 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-green-50 via-transparent to-transparent opacity-70"></div>

    <main class="flex min-h-[70vh] items-center justify-center px-4 py-10 sm:px-6 sm:py-16">
        <div class="w-full max-w-xl animate-in fade-in slide-in-from-bottom-8 duration-1000">
            <div class="glass-premium relative overflow-hidden rounded-[3rem] p-8 text-center shadow-[0_32px_64px_-16px_rgba(0,0,0,0.1)] sm:p-12">
                <div class="relative mx-auto mb-8 h-24 w-24">
                    <div id="statusGlow" class="absolute inset-0 rounded-full bg-emerald-500/10 animate-ping duration-[2000ms]"></div>
                    <div id="statusIconShell" class="relative flex h-full w-full items-center justify-center rounded-full bg-emerald-500 text-white shadow-xl shadow-emerald-500/20">
                        <iconify-icon id="statusIcon" icon="solar:check-circle-bold" width="48"></iconify-icon>
                    </div>
                </div>

                <h1 id="statusTitle" class="mb-4 text-3xl font-black tracking-tight text-gray-900 sm:text-4xl">Paiement confirme !</h1>
                <p id="statusDescription" class="mb-12 text-lg font-medium leading-relaxed text-gray-500">
                    Merci pour votre confiance. Votre commande est maintenant securisee et le vendeur a ete alerte.
                </p>

                <div class="mb-12 space-y-4 rounded-3xl border border-gray-100/50 bg-gray-50/50 p-6 text-left">
                    <div class="flex items-center justify-between border-b border-gray-100 pb-4">
                        <span class="text-xs font-black uppercase tracking-widest text-gray-400">Reference transaction</span>
                        <span id="txRef" class="font-mono text-sm font-bold text-gray-900">...</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-black uppercase tracking-widest text-gray-400">Statut</span>
                        <div id="statusBadge" class="flex items-center gap-2 text-xs font-black uppercase tracking-widest text-emerald-600">
                            <div id="statusDot" class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></div>
                            <span id="statusLabel">Succes</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <a href="/index.html" class="flex items-center justify-center gap-3 rounded-2xl border border-gray-200 bg-white px-8 py-5 text-sm font-black uppercase tracking-widest text-gray-900 shadow-sm transition-all hover:bg-gray-50 active:scale-[0.98]">
                        <iconify-icon icon="solar:home-2-linear" width="20"></iconify-icon>
                        Accueil
                    </a>
                    <a href="/src/pages/customer-dashboard.html" class="hero-gradient flex items-center justify-center gap-3 rounded-2xl px-8 py-5 text-sm font-black uppercase tracking-widest text-white shadow-2xl shadow-black/20 transition-all hover:scale-[1.02] active:scale-[0.98]">
                        Mes commandes
                        <iconify-icon icon="solar:alt-arrow-right-linear" width="20"></iconify-icon>
                    </a>
                </div>

                <p class="mt-12 text-[10px] font-bold uppercase tracking-[0.2em] text-gray-400">
                    Securise par AvadaPay et NewKet Escrow
                </p>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const txRef = urlParams.get('tx_ref') || urlParams.get('transaction_id') || '';
            const rawStatus = (urlParams.get('status') || urlParams.get('tx_status') || 'pending').toLowerCase();

            const txRefEl = document.getElementById('txRef');
            if (txRefEl) txRefEl.textContent = txRef || 'Indisponible';

            const statusTitle = document.getElementById('statusTitle');
            const statusDescription = document.getElementById('statusDescription');
            const statusLabel = document.getElementById('statusLabel');
            const statusBadge = document.getElementById('statusBadge');
            const statusDot = document.getElementById('statusDot');
            const statusGlow = document.getElementById('statusGlow');
            const statusIconShell = document.getElementById('statusIconShell');
            const statusIcon = document.getElementById('statusIcon');
            const pageTitle = document.querySelector('title');

            function setFailureUI(labelText) {
                if (pageTitle) pageTitle.textContent = 'Paiement annule | NewKet';
                if (statusTitle) statusTitle.textContent = 'Paiement non confirme';
                if (statusDescription) {
                    statusDescription.textContent = "Le paiement n'a pas ete confirme, donc la fiche n'a pas encore ete envoyee au vendeur. Vous pouvez relancer le paiement quand vous voulez.";
                }
                if (statusLabel) statusLabel.textContent = labelText || 'En attente';
                if (statusBadge) statusBadge.className = 'flex items-center gap-2 text-xs font-black uppercase tracking-widest text-amber-600';
                if (statusDot) statusDot.className = 'h-2 w-2 rounded-full bg-amber-500 animate-pulse';
                if (statusGlow) statusGlow.className = 'absolute inset-0 rounded-full bg-amber-500/10 animate-ping duration-[2000ms]';
                if (statusIconShell) statusIconShell.className = 'relative flex h-full w-full items-center justify-center rounded-full bg-amber-500 text-white shadow-xl shadow-amber-500/20';
                if (statusIcon) statusIcon.setAttribute('icon', 'solar:danger-triangle-bold');
            }

            function setPendingUI(labelText) {
                if (pageTitle) pageTitle.textContent = 'Verification paiement | NewKet';
                if (statusTitle) statusTitle.textContent = 'Verification en cours';
                if (statusDescription) {
                    statusDescription.textContent = "Nous attendons encore la confirmation serveur du paiement. Revenez dans quelques instants depuis vos commandes si l'etat n'evolue pas.";
                }
                if (statusLabel) statusLabel.textContent = labelText || 'Verification';
                if (statusBadge) statusBadge.className = 'flex items-center gap-2 text-xs font-black uppercase tracking-widest text-sky-600';
                if (statusDot) statusDot.className = 'h-2 w-2 rounded-full bg-sky-500 animate-pulse';
                if (statusGlow) statusGlow.className = 'absolute inset-0 rounded-full bg-sky-500/10 animate-ping duration-[2000ms]';
                if (statusIconShell) statusIconShell.className = 'relative flex h-full w-full items-center justify-center rounded-full bg-sky-500 text-white shadow-xl shadow-sky-500/20';
                if (statusIcon) statusIcon.setAttribute('icon', 'solar:clock-circle-bold');
            }

            function setSuccessUI() {
                const count = 200;
                const defaults = {
                    origin: { y: 0.7 },
                    zIndex: 1000
                };

                function fire(particleRatio, opts) {
                    confetti({
                        ...defaults,
                        ...opts,
                        particleCount: Math.floor(count * particleRatio)
                    });
                }

                fire(0.25, { spread: 26, startVelocity: 55 });
                fire(0.2, { spread: 60 });
                fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
                fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
                fire(0.1, { spread: 120, startVelocity: 45 });
            }

            async function loadServerStatus() {
                if (!txRef) return null;
                if (!window.ApiClient) return null;
                try {
                    return await window.ApiClient.get(`/payment/status/${encodeURIComponent(txRef)}`, {
                        cacheKey: `payment-status:${txRef}`,
                        cacheTtlMs: 5_000,
                        suppressNetworkError: true
                    });
                } catch {
                    return null;
                }
            }

            (async () => {
                const serverStatus = await loadServerStatus();
                const orderStatus = serverStatus?.order?.status || null;
                const paymentStatus = (serverStatus?.order?.payment_status || serverStatus?.payment?.status || '').toString().toLowerCase();

                const isPaid = ['paid', 'success', 'successful'].includes(paymentStatus) || ['paid_held', 'delivered', 'completed'].includes((orderStatus || '').toString().toLowerCase());

                if (!txRef) {
                    setFailureUI('Reference absente');
                    return;
                }

                if (!serverStatus) {
                    setPendingUI(rawStatus === 'cancelled' ? 'Annule' : 'Verification');
                    return;
                }

                if (!isPaid) {
                    setFailureUI(paymentStatus === 'failed' ? 'Echec' : 'En attente');
                    return;
                }

                setSuccessUI();
            })();

        });
    </script>
</body>
</html>
