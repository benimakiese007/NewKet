<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="512x512" href="/Images/Logo NewKet PNG.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="theme-color" content="#2e2e2e">
    <title>Paiement accepté | NewKet</title>
    <meta name="description" content="Confirmation de paiement NewKet.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="/src/services/app.js" type="module"></script>
    <link rel="stylesheet" href="/src/assets/css/input.css">
    <link rel="stylesheet" href="/src/assets/css/style.css">
    <link rel="stylesheet" href="/src/assets/css/responsive.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #ffffff; }
    </style>
</head>
<body>

    <!-- Full-screen payment success animation -->
    <div id="paymentSuccessOverlay" style="
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #ffffff;
        opacity: 0; transition: opacity 0.5s ease;
    ">
        <div id="paymentSuccessContent" style="
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 2rem; text-align: center;
            transform: scale(0.75); opacity: 0;
        ">
            <!-- Animated SVG check circle -->
            <div style="position: relative; width: 128px; height: 128px; margin-bottom: 1.5rem;">
                <svg style="position:absolute; inset:0; width:100%; height:100%;" viewBox="0 0 52 52">
                    <circle cx="26" cy="26" r="25" fill="none" stroke="#bbf7d0" stroke-width="2"/>
                    <circle id="paymentSuccessCircle"
                        cx="26" cy="26" r="25" fill="none"
                        stroke="#22c55e" stroke-width="2"
                        stroke-dasharray="157" stroke-dashoffset="157"
                        style="transform: rotate(-90deg); transform-origin: center; transition: stroke-dashoffset 0.8s ease-in-out;"/>
                    <path id="paymentSuccessCheck"
                        fill="none" stroke="#22c55e" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round"
                        d="M14.1 27.2l7.1 7.2 16.7-16.8"
                        stroke-dasharray="35" stroke-dashoffset="35"
                        style="transition: stroke-dashoffset 0.5s ease-out 0.8s;"/>
                </svg>
            </div>

            <!-- Title -->
            <h2 id="statusTitle" style="
                font-size: 1.875rem; font-weight: 900;
                color: #111827; margin-bottom: 0.5rem;
                text-transform: uppercase; letter-spacing: -0.02em;
            ">PAIEMENT ACCEPTÉ !</h2>

            <!-- Description -->
            <p id="statusDescription" style="
                color: #6b7280; font-weight: 500;
                max-width: 24rem; line-height: 1.6;
            ">Votre transaction a bien été effectuée. Vous allez être redirigé vers vos achats.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const orderRefreshSignalKey = 'newket_orders_refresh_signal';
            const urlParams = new URLSearchParams(window.location.search);
            const txRef = urlParams.get('tx_ref') || urlParams.get('transaction_id') || '';
            const rawStatus = (urlParams.get('status') || urlParams.get('tx_status') || 'pending').toLowerCase();
            let resolvedOrderId = null;
            let statusPollTimer = null;

            const MAX_STATUS_POLLS = 20;
            const BASE_POLL_DELAY_MS = 2000;
            const MAX_POLL_DELAY_MS = 6000;
            const PAID_PAYMENT_STATUSES = new Set(['paid', 'success', 'successful', 'succeeded', 'completed']);
            const PENDING_PAYMENT_STATUSES = new Set(['pending', 'initiated', 'processing', 'verification']);
            const FAILED_PAYMENT_STATUSES = new Set(['failed', 'failure', 'cancelled', 'canceled', 'expired', 'declined', 'refunded']);
            const PAID_ORDER_STATUSES = new Set(['paid_held', 'delivered', 'completed']);
            const FAILED_ORDER_STATUSES = new Set(['cancelled', 'canceled', 'refunded', 'failed']);

            const overlay = document.getElementById('paymentSuccessOverlay');
            const content = document.getElementById('paymentSuccessContent');
            const circle = document.getElementById('paymentSuccessCircle');
            const check = document.getElementById('paymentSuccessCheck');
            const statusTitle = document.getElementById('statusTitle');
            const statusDescription = document.getElementById('statusDescription');
            const pageTitle = document.querySelector('title');

            // Launch entry animation immediately on page load
            requestAnimationFrame(() => {
                overlay.style.opacity = '1';
                content.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease';
                content.style.transform = 'scale(1)';
                content.style.opacity = '1';
            });

            function normalizeState(v) { return String(v || '').trim().toLowerCase(); }

            function clearStatusPollTimer() {
                if (statusPollTimer) { clearTimeout(statusPollTimer); statusPollTimer = null; }
            }

            function isPaidState(os, ps) { return PAID_PAYMENT_STATUSES.has(ps) || PAID_ORDER_STATUSES.has(os); }
            function isTerminalFailureState(os, ps, rs) {
                return rs === 'cancelled' || FAILED_PAYMENT_STATUSES.has(ps) || FAILED_ORDER_STATUSES.has(os);
            }
            function isPendingState(os, ps) {
                return !ps || PENDING_PAYMENT_STATUSES.has(ps) || os === 'ready_for_payment' || os === 'pending';
            }

            function setFailureUI() {
                clearStatusPollTimer();
                if (pageTitle) pageTitle.textContent = 'Paiement non confirmé | NewKet';
                if (statusTitle) { statusTitle.textContent = 'PAIEMENT NON CONFIRMÉ'; statusTitle.style.color = '#d97706'; }
                if (statusDescription) statusDescription.textContent = "Le paiement n'a pas pu être confirmé. Vérifiez vos commandes ou relancez le paiement.";
                if (circle) { circle.setAttribute('stroke', '#f59e0b'); circle.style.strokeDashoffset = '0'; }
                if (check) { check.setAttribute('stroke', '#f59e0b'); check.style.strokeDashoffset = '0'; }
            }

            function setPendingUI() {
                if (pageTitle) pageTitle.textContent = 'Vérification paiement | NewKet';
                if (statusTitle) { statusTitle.textContent = 'VÉRIFICATION EN COURS...'; statusTitle.style.color = '#0ea5e9'; }
                if (statusDescription) statusDescription.textContent = "Nous attendons la confirmation de votre paiement. Merci de patienter.";
            }

            function setPollingExhaustedUI() {
                clearStatusPollTimer();
                if (pageTitle) pageTitle.textContent = 'Vérification paiement | NewKet';
                if (statusTitle) { statusTitle.textContent = 'CONFIRMATION EN ATTENTE'; statusTitle.style.color = '#d97706'; }
                if (statusDescription) statusDescription.innerHTML = 'Le paiement a peut-être été effectué mais la confirmation prend plus de temps que prévu. <strong>Consultez vos commandes</strong> dans quelques minutes.';
            }

            function setSuccessUI() {
                clearStatusPollTimer();
                if (pageTitle) pageTitle.textContent = 'Paiement accepté | NewKet';
                if (statusTitle) { statusTitle.textContent = 'PAIEMENT ACCEPTÉ !'; statusTitle.style.color = '#111827'; }
                if (statusDescription) statusDescription.textContent = 'Votre transaction a bien été effectuée. Vous allez être redirigé vers vos achats.';

                // Animate the SVG check circle
                setTimeout(() => {
                    if (circle) circle.style.strokeDashoffset = '0';
                    if (check) check.style.strokeDashoffset = '0';
                }, 300);

                try { localStorage.setItem(orderRefreshSignalKey, JSON.stringify({ txRef, at: Date.now() })); } catch {}
                window.dispatchEvent(new CustomEvent('ordersUpdated'));

                // Redirect after animation (3s) → #purchases?filter=paid
                if (window.__newketPaymentRedirectTimer) clearTimeout(window.__newketPaymentRedirectTimer);
                window.__newketPaymentRedirectTimer = setTimeout(() => {
                    const role = window.AuthManager ? window.AuthManager.role : localStorage.getItem('newketRole');
                    const targetDashboard = (role === 'vendor' || role === 'supplier')
                        ? '/vendor-dashboard'
                        : '/customer-dashboard';
                    window.location.href = `${targetDashboard}#purchases?filter=paid`;
                }, 3000);
            }

            async function loadServerStatus() {
                if (!txRef || !window.ApiClient) return null;
                try {
                    return await window.ApiClient.get(`/payments/status/${encodeURIComponent(txRef)}`, {
                        suppressNetworkError: true, dedupe: false
                    });
                } catch { return null; }
            }

            function getNextPollDelay(attempt) { return Math.min(BASE_POLL_DELAY_MS * Math.pow(1.3, attempt), MAX_POLL_DELAY_MS); }

            function scheduleStatusRetry(attempt) {
                clearStatusPollTimer();
                if (attempt >= MAX_STATUS_POLLS) { setPollingExhaustedUI(); return; }
                statusPollTimer = setTimeout(() => refreshStatus(attempt + 1), getNextPollDelay(attempt));
            }

            async function refreshStatus(attempt = 0) {
                if (!txRef) { setFailureUI(); return; }
                const serverStatus = await loadServerStatus();
                resolvedOrderId = serverStatus?.order?.id || resolvedOrderId || null;
                if (!serverStatus) { setPendingUI(); scheduleStatusRetry(attempt); return; }
                const os = normalizeState(serverStatus?.order?.status);
                const ps = normalizeState(serverStatus?.order?.payment_status || serverStatus?.payment?.status);
                if (isPaidState(os, ps)) { setSuccessUI(); return; }
                if (isTerminalFailureState(os, ps, rawStatus)) { setFailureUI(); return; }
                setPendingUI();
                scheduleStatusRetry(attempt);
            }

            (async () => {
                const isMock = urlParams.get('mock') === 'true';
                if (isMock) { setSuccessUI(); return; }
                setPendingUI();
                await refreshStatus();
            })();
        });
    </script>
</body>
</html>
