<!DOCTYPE html>
<html lang="fr">

<head>
    <script>
        (function(){try{localStorage.setItem('newket_theme','light');}catch(e){}document.documentElement.classList.remove('dark');})();
    </script>
    <script type="module" src="/src/services/app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="512x512" href="/Images/Logo NewKet PNG.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="theme-color" content="#013220">

    <link rel="stylesheet" href="/src/assets/css/input.css">
    <link rel="stylesheet" href="/src/assets/css/style.css">
    <link rel="stylesheet" href="/src/assets/css/responsive.css">
    <link rel="stylesheet" href="/src/assets/css/admin.css">
        <script src="/vendor/iconify-preload.js"></script>
    <script src="/vendor/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-radius: 1.5rem; }
        .btn-primary { background: #000; color: #fff; border-radius: 0.9rem; padding: 0.85rem 1.1rem; font-weight: 800; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-ghost { border: 1px solid #e2e8f0; background: #fff; border-radius: 0.9rem; padding: 0.85rem 1.1rem; font-weight: 800; color: #0f172a; }
        .muted { color: #64748b; }
        .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 9999px; background: #eef2ff; color: #4338ca; }
        .card-link { border: 1px solid #e2e8f0; border-radius: 1.25rem; padding: 1.1rem; background: white; transition: all .15s ease; }
        .card-link:hover { border-color: #000; transform: translateY(-1px); }
        .img-cover { width: 72px; height: 72px; border-radius: 18px; object-fit: cover; background: #f1f5f9; border: 1px solid #e2e8f0; }

        @media (min-width: 640px) {
            .card-link { padding: 1.25rem; }
            .img-cover { width: 78px; height: 78px; }
        }

        /* Sidebar styles (align with customer dashboard) */
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            color: #64748b;
            font-weight: 600;
            transition: all 0.2s;
        }
        .sidebar-link:hover,
        .sidebar-link.active {
            background: #f1f5f9;
            color: #0f172a;
        }
        .sidebar-link.active {
            background: #000000;
            color: white;
        }
        .sidebar-logout {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            color: #ef4444;
            font-weight: 700;
            font-size: 0.875rem;
            transition: all 0.2s;
            width: 100%;
            cursor: pointer;
            background: none;
            border: none;
            text-align: left;
        }
        .sidebar-logout:hover { background: #fef2f2; }
    </style>
</head>

<body>
    <nav class="dashboard-topbar newket-dashboard-header fixed top-0 w-full z-[100] border-b transition-all duration-300">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-8 py-3 flex justify-between items-center h-[64px] sm:h-[96px] relative">
            <div class="flex items-center gap-3">
                <button id="customerMobileBtn" class="p-2.5 bg-gray-50 rounded-xl text-gray-500 hover:text-black hover:bg-gray-100 focus:outline-none flex md:hidden items-center justify-center transition-all" aria-label="Ouvrir le menu" onclick="SidebarManager.toggle()">
                    <iconify-icon icon="solar:hamburger-menu-bold" width="22"></iconify-icon>
                </button>
            </div>

            <div class="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2">
                <a href="/" class="flex items-center justify-center">
                    <img src="/Images/Logo_Header_Officiel_PNG.png" alt="NewKet Logo" class="header-brand-image h-10 sm:h-16 w-auto object-contain">
                </a>
            </div>

            <div class="flex items-center gap-3">
                <button id="btnLogout" data-logout-safe class="btn-ghost text-sm text-red-600 border-red-100 hover:bg-red-50 flex items-center gap-2">
                    <iconify-icon icon="solar:logout-2-bold" width="18"></iconify-icon>
                    DÃ©connexion
                </button>
            </div>
        </div>
    </nav>

    <!-- Overlay pour Mobile -->
    <div id="customerSidebarOverlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[110] hidden transition-all duration-300"></div>

    <main class="w-full max-w-none px-4 sm:px-6 lg:px-8 pt-28 pb-12 lg:pt-28 lg:pb-16 flex flex-col md:flex-row gap-8 relative">
        <!-- Sidebar -->
        <aside id="customerSidebar" class="fixed inset-0 w-screen max-w-none bg-white z-[120] transform -translate-x-full md:translate-x-0 md:sticky md:top-28 md:self-start md:inset-auto md:w-64 transition-all duration-300 ease-in-out h-screen md:h-[calc(100vh-7rem)] overflow-y-auto border-0 md:border-r border-gray-100 flex-shrink-0">

            <!-- Mobile Close Button -->
            <button onclick="SidebarManager.close()" class="md:hidden absolute top-6 right-6 p-2 bg-gray-50 rounded-xl text-gray-500 hover:text-black hover:bg-gray-100 transition-all z-10">
                <iconify-icon icon="solar:close-circle-bold" width="24"></iconify-icon>
            </button>
            <div class="glass-panel min-h-screen rounded-none border-0 shadow-none p-6 pt-24 md:pt-6 md:min-h-0 md:rounded-[1.5rem] md:border md:shadow-sm">
                <div class="flex items-center gap-4 mb-8 p-3 rounded-2xl bg-gray-50/80 border border-gray-100/50 shadow-sm transition-all hover:bg-gray-100/50">
                    <div class="relative flex-shrink-0">
                        <div id="userAvatarDisplay" class="w-9 h-9 rounded-full bg-white/10 text-white flex items-center justify-center font-black text-[11px] uppercase tracking-widest shadow-sm border border-white/15 overflow-hidden shrink-0">
                            <img id="userAvatarImg" src="" alt="" class="w-full h-full object-cover hidden" referrerpolicy="no-referrer" crossorigin="anonymous">
                            <span id="userAvatarPlaceholder">?</span>
                        </div>
                        <div class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full shadow-sm animate-pulse"></div>
                    </div>
                    <div class="flex flex-col min-w-0">
                        <h2 id="userDisplayName" class="font-bold text-gray-900 truncate text-sm">Mon Compte</h2>
                        <div class="flex items-center gap-1.5 mt-0.5">
                            <span class="text-[9px] font-black uppercase tracking-widest text-gray-400">En ligne</span>
                        </div>
                    </div>
                </div>
                <nav class="space-y-1">
                    <a href="#" class="sidebar-link" id="link-dashboard" onclick="goDashboard('dashboard')">
                        <iconify-icon icon="solar:home-2-bold" width="20"></iconify-icon>
                        <span>Accueil</span>
                    </a>
                    <a href="#" class="sidebar-link" id="link-orders" onclick="goDashboard('orders')">
                        <iconify-icon icon="solar:bag-bold" width="20"></iconify-icon>
                        <span>Mes demandes et devis</span>
                    </a>
                    <a href="#" class="sidebar-link active" id="link-achat">
                        <iconify-icon icon="solar:card-send-bold" width="20"></iconify-icon>
                        <span>Achat</span>
                    </a>
                    <a href="#" class="sidebar-link" id="link-favorites" onclick="goDashboard('favorites')">
                        <iconify-icon icon="solar:heart-bold" width="20"></iconify-icon>
                        <span>Mes Favoris</span>
                    </a>
                    <a href="#" class="sidebar-link" id="link-notifications" onclick="goDashboard('notifications')">
                        <iconify-icon icon="solar:bell-bold" width="20"></iconify-icon>
                        <span>Notifications</span>
                    </a>
                    <a href="#" class="sidebar-link" id="link-settings" onclick="goDashboard('settings')">
                        <iconify-icon icon="solar:settings-bold" width="20"></iconify-icon>
                        <span>ParamÃ¨tres</span>
                    </a>
                </nav>
                <div class="mt-4 pt-4 border-t border-gray-100">
                    <button class="sidebar-logout" onclick="AuthManager.handleLogoutClick(this)">
                        <iconify-icon icon="solar:logout-2-bold" width="20"></iconify-icon>
                        <span>Se dÃ©connecter</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Content -->
        <section class="flex-1 min-w-0 customer-main-content">
            <div class="max-w-[1200px] mx-auto">
                <div class="glass-panel p-6 sm:p-10">
                    <div class="flex items-start justify-between gap-4 flex-col sm:flex-row">
                        <div>
                            <h1 class="text-2xl sm:text-3xl font-black tracking-tight">Achat</h1>
                            <p class="muted mt-1 text-sm sm:text-base">Finalisez votre paiement en toute sÃ©curitÃ© (sÃ©questre NewKet).</p>
                        </div>
                        <div id="orderBadge" class="badge hidden">
                            <iconify-icon icon="solar:card-send-bold" width="18"></iconify-icon>
                            <span>PrÃªt pour paiement</span>
                        </div>
                    </div>

                    <div id="achatContent" class="mt-8 space-y-5">
                        <div class="text-sm muted">Chargement...</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        function getQueryParam(name) {
            try {
                const url = new URL(window.location.href);
                return url.searchParams.get(name);
            } catch (e) {
                return null;
            }
        }

        function safeText(v) {
            if (v === null || v === undefined) return '';
            return String(v);
        }

        function formatAmount(amount) {
            if (window.CurrencyManager && typeof CurrencyManager.formatPrice === 'function') {
                return CurrencyManager.formatPrice(amount || 0);
            }
            return `${amount || 0}`;
        }

        async function waitForAppReady() {
            if (window.newketInitialized) return;

            await new Promise((resolve) => {
                window.addEventListener('newketInitialized', resolve, { once: true });
            });
        }

        function buildOrderCard(order, { showButton = true } = {}) {
            const img = (order?.items?.[0]?.image || order?.product_image || '').split(',')[0];
            const productName = order?.items?.[0]?.name || order?.product_name || 'Produit';
            const dateLabel = order?.date ? new Date(order.date).toLocaleDateString() : '';
            const statusLabel = window.OrderManager ? OrderManager.getStatusLabel(order.status) : (order.status || '');
            const total = formatAmount(order.total);
            const orderId = safeText(order.id);

            const btn = showButton
                ? `<button class="btn-primary text-sm flex items-center justify-center gap-2 w-full sm:w-auto" onclick="goToOrder('${orderId}')">
                        <iconify-icon icon="solar:arrow-right-bold" width="18"></iconify-icon>
                        Continuer
                   </button>`
                : '';

            return `
                <div class="card-link">
                    <div class="flex flex-col sm:flex-row sm:items-center gap-4">
                        <div class="flex items-center gap-4 min-w-0 flex-1">
                            <img class="img-cover shrink-0" src="${img || '/Images/Logo NewKet PNG.png'}" alt="">
                            <div class="min-w-0">
                                <div class="text-[11px] font-black uppercase tracking-wider text-gray-400">Demande #${orderId}</div>
                                <div class="mt-1 font-black text-gray-900 truncate">${safeText(productName)}</div>
                                <div class="mt-1 text-sm muted flex flex-wrap items-center gap-x-3 gap-y-1">
                                    <span>${safeText(dateLabel)}</span>
                                    <span class="text-gray-300">â€¢</span>
                                    <span class="font-semibold text-gray-700">${safeText(statusLabel)}</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between sm:flex-col sm:items-end sm:justify-start gap-3 sm:gap-2">
                            <div class="text-lg sm:text-xl font-black tracking-tight text-gray-900 whitespace-nowrap">${total}</div>
                            <div class="w-full sm:w-auto flex justify-end">${btn}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.goToOrder = function(orderId) {
            const path = (typeof window.resolvePath === 'function') ? window.resolvePath('achat') : '/src/pages/achat.html';
            window.location.href = `${path}?order_id=${encodeURIComponent(orderId)}`;
        };

        async function renderListMode() {
            const container = document.getElementById('achatContent');
            if (!container) return;
            container.innerHTML = '';

            const email = localStorage.getItem('newketUserEmail');
            const userId = localStorage.getItem('newketUserId');

            let orders = [];
            try {
                orders = (window.OrderManager ? OrderManager.getOrders() : []).filter(o =>
                    o && (
                        (email && o.customer_email === email) ||
                        (userId && (o.user_id === userId || o.customer_id === userId))
                    )
                );
            } catch (e) {
                orders = [];
            }

            const ready = orders.filter(o => o.status === 'READY_FOR_PAYMENT');

            if (ready.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10">
                        <div class="w-14 h-14 rounded-2xl bg-gray-100 mx-auto flex items-center justify-center text-gray-700">
                            <iconify-icon icon="solar:shop-2-bold" width="28"></iconify-icon>
                        </div>
                        <div class="mt-4 font-black text-gray-900">Aucun achat prÃªt pour paiement</div>
                        <div class="mt-1 text-sm muted">Retournez dans votre espace client pour suivre vos demandes.</div>
                        <div class="mt-6">
                            <button class="btn-primary text-sm" onclick="backToDashboard()">Aller Ã  mon espace client</button>
                        </div>
                    </div>
                `;
                return;
            }

            container.insertAdjacentHTML('beforeend', `
                <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 text-sm text-indigo-900 flex items-start gap-3">
                    <iconify-icon icon="solar:info-circle-bold" width="22"></iconify-icon>
                    <div>
                        <div class="font-black">SÃ©lectionnez une demande</div>
                        <div class="mt-1 text-indigo-800">Vous serez redirigÃ© vers le paiement sÃ©curisÃ© aprÃ¨s confirmation.</div>
                    </div>
                </div>
            `);

            ready.forEach(o => container.insertAdjacentHTML('beforeend', buildOrderCard(o)));
        }

        function buildDetailView(order) {
            const img = (order?.items?.[0]?.image || order?.product_image || '').split(',')[0];
            const productName = order?.items?.[0]?.name || order?.product_name || 'Produit';
            const qty = order?.items?.[0]?.quantity || 1;
            const subtotal = order?.merchandise_amount ?? order?.total ?? 0;
            const deliveryFee = order?.delivery_fee_amount ?? 0;
            const total = order?.total ?? 0;
            const statusLabel = window.OrderManager ? OrderManager.getStatusLabel(order.status) : (order.status || '');

            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-5">
                        <div class="card-link">
                            <div class="flex items-center gap-4">
                                <img class="img-cover" src="${img || '/Images/Logo NewKet PNG.png'}" alt="">
                                <div class="flex-1 min-w-0">
                                    <div class="text-[11px] font-black uppercase tracking-wider text-gray-400">Commande</div>
                                    <div class="mt-1 font-black text-gray-900 text-lg truncate">${safeText(productName)}</div>
                                    <div class="mt-1 text-sm muted">QuantitÃ©: <span class="font-semibold text-gray-700">${qty}</span></div>
                                    <div class="mt-2 text-sm muted">Statut: <span class="font-semibold text-gray-900">${safeText(statusLabel)}</span></div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-4 text-sm text-emerald-900 flex items-start gap-3">
                            <iconify-icon icon="solar:shield-check-bold" width="22"></iconify-icon>
                            <div>
                                <div class="font-black">Paiement protÃ©gÃ©</div>
                                <div class="mt-1 text-emerald-800">Votre paiement passe en sÃ©questre et ne sera libÃ©rÃ© au vendeur qu'aprÃ¨s confirmation de rÃ©ception.</div>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div class="card-link">
                            <div class="font-black text-gray-900">RÃ©capitulatif</div>
                            <div class="mt-4 space-y-3 text-sm">
                                <div class="flex justify-between gap-3">
                                    <span class="muted">Sous-total</span>
                                    <span class="font-bold text-gray-900">${formatAmount(subtotal)}</span>
                                </div>
                                <div class="flex justify-between gap-3">
                                    <span class="muted">Livraison</span>
                                    <span class="font-bold text-gray-900">${formatAmount(deliveryFee)}</span>
                                </div>
                                <div class="border-t border-gray-100 pt-3 flex justify-between gap-3">
                                    <span class="font-black text-gray-900">Total</span>
                                    <span class="font-black text-gray-900">${formatAmount(total)}</span>
                                </div>
                            </div>
                        </div>

                        <button id="btnPayNow" class="btn-primary w-full flex items-center justify-center gap-2">
                            <iconify-icon icon="solar:card-send-bold" width="20"></iconify-icon>
                            Payer maintenant
                        </button>
                        <button class="btn-ghost w-full" onclick="backToDashboard()">Retour Ã  l'espace client</button>
                        <div id="payError" class="text-xs text-red-600 font-semibold hidden"></div>
                    </div>
                </div>
            `;
        }

        function backToDashboard() {
            if (typeof window.resolvePath === 'function') {
                window.location.href = window.resolvePath('customer-dashboard');
                return;
            }
            window.location.href = '/src/pages/customer-dashboard.html';
        }

        window.goDashboard = function(tab) {
            const base = (typeof window.resolvePath === 'function') ? window.resolvePath('customer-dashboard') : '/src/pages/customer-dashboard.html';
            const hash = tab ? `#${encodeURIComponent(tab)}` : '';
            window.location.href = `${base}${hash}`;
        };

        async function renderDetailMode(orderId) {
            const container = document.getElementById('achatContent');
            const badge = document.getElementById('orderBadge');
            if (!container || !badge) return;

            const order = window.OrderManager ? OrderManager.getOrderById(orderId) : null;
            if (!order) {
                container.innerHTML = `
                    <div class="text-center py-10">
                        <div class="w-14 h-14 rounded-2xl bg-gray-100 mx-auto flex items-center justify-center text-gray-700">
                            <iconify-icon icon="solar:danger-triangle-bold" width="28"></iconify-icon>
                        </div>
                        <div class="mt-4 font-black text-gray-900">Commande introuvable</div>
                        <div class="mt-1 text-sm muted">Retournez Ã  votre espace client et rÃ©essayez.</div>
                        <div class="mt-6">
                            <button class="btn-primary text-sm" onclick="backToDashboard()">Aller Ã  mon espace client</button>
                        </div>
                    </div>
                `;
                return;
            }

            if (order.status === 'READY_FOR_PAYMENT') {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            container.innerHTML = buildDetailView(order);

            const btn = document.getElementById('btnPayNow');
            const payError = document.getElementById('payError');

            if (order.status !== 'READY_FOR_PAYMENT') {
                btn.disabled = true;
                btn.innerHTML = '<iconify-icon icon="solar:info-circle-bold" width="20"></iconify-icon> Paiement indisponible';
                return;
            }

            btn.addEventListener('click', async () => {
                btn.disabled = true;
                payError.classList.add('hidden');
                btn.innerHTML = '<iconify-icon icon="line-md:loading-twotone-loop" width="20"></iconify-icon> Ouverture...';
                try {
                    const data = await OrderManager.initiatePayment(orderId);
                    if (data?.payment_url) {
                        window.location.href = data.payment_url;
                        return;
                    }
                    payError.textContent = safeText(data?.error || 'Lien de paiement non reÃ§u');
                    payError.classList.remove('hidden');
                } catch (e) {
                    payError.textContent = safeText(e?.message || "Erreur lors de l'ouverture du paiement");
                    payError.classList.remove('hidden');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<iconify-icon icon="solar:card-send-bold" width="20"></iconify-icon> Payer maintenant';
                }
            });
        }

        async function initAchatPage() {
            document.getElementById('btnLogout')?.addEventListener('click', function () {
                if (window.AuthManager && typeof AuthManager.handleLogoutClick === 'function') {
                    AuthManager.handleLogoutClick(this);
                    return;
                }
                localStorage.clear();
                window.location.href = (typeof window.resolvePath === 'function') ? window.resolvePath('login') : '/src/pages/login.html';
            });

            const initCustomerSidebar = () => {
                if (window.SidebarManager) {
                    window.SidebarManager.init('customerSidebar', 'customer-main-content', 'customerSidebarOverlay');
                }
            };
            if (window.SidebarManager) initCustomerSidebar();
            else window.addEventListener('newketInitialized', initCustomerSidebar, { once: true });

            await waitForAppReady();

            try {
                const profile = window.ProfileManager ? ProfileManager.getProfile() : {};
                const name = profile.name || localStorage.getItem('newketUserName') || 'Mon Compte';
                const initials = (typeof window.getInitials === 'function') ? window.getInitials(name) : (name?.trim()?.charAt(0)?.toUpperCase() || '?');
                const nameEl = document.getElementById('userDisplayName');
                if (nameEl) nameEl.textContent = name;
                const placeholder = document.getElementById('userAvatarPlaceholder');
                if (placeholder) placeholder.textContent = initials;
                const avatarUrl = localStorage.getItem('newketUserAvatar');
                const img = document.getElementById('userAvatarImg');
                if (avatarUrl && img) {
                    img.src = avatarUrl;
                    img.classList.remove('hidden');
                }
            } catch (e) {}

            const orderId = getQueryParam('order_id');
            if (orderId) {
                await renderDetailMode(orderId);
                return;
            }
            await renderListMode();
        }

        initAchatPage();
    </script>
</body>

</html>
