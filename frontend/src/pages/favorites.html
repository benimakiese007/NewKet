<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Favoris | NewKet</title>
    <script>
        // Store flag to open favorites drawer
        sessionStorage.setItem('nk_open_favorites_drawer', 'true');
        // Return to previous page or index
        if (document.referrer && document.referrer.includes(window.location.host)) {
            window.location.replace(document.referrer + (document.referrer.includes('?') ? '&' : '?') + 'open=favorites');
        } else {
            window.location.replace('/index.html?open=favorites');
        }
    </script>
</head>
<body style="background:#ffffff; margin:0; padding:0;">
</body>
</html>
