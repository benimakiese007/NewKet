<!DOCTYPE html>
<html lang="fr">

<head><script type="module" src="/src/services/app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="theme-color" content="#013220">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NewKet">
    <title>Favoris • NewKet</title>
    <meta name="description" content="Découvrez NewKet, la marketplace de luxe de référence en RDC. Achetez et vendez vos articles en toute sécurité.">
    <link rel="stylesheet" href="/src/assets/css/input.css">
        <script src="/vendor/iconify-preload.js"></script>
    <script src="/vendor/iconify-icon.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/assets/css/style.css">
    <link rel="stylesheet" href="/src/assets/css/responsive.css">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        .hero-gradient {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #333333 100%);
        }

        .card-shadow:hover {
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 antialiased">

    <div id="header-placeholder"></div>




    <main class="max-w-7xl mx-auto px-4 sm:px-6 pb-12 pt-24 sm:pt-28 lg:pt-32">
        <div class="flex items-center justify-between mb-10">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Mes Favoris</h1>
                <p id="fav-status" class="text-gray-500 text-sm mt-1">Récupération de vos coups de cœur...</p>
            </div>
                <button id="clearAllBtn" data-track-action="favorites:clear_all_click"
                class="flex items-center gap-2 text-sm font-semibold text-red-500 hover:text-red-600 transition-colors bg-red-50 px-4 py-2 rounded-xl">
                <iconify-icon icon="solar:trash-bin-trash-linear" width="18"></iconify-icon>
                Tout effacer
            </button>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-24 bg-white rounded-3xl border border-gray-100 shadow-sm">
            <div class="w-24 h-24 bg-red-50 text-red-400 rounded-full flex items-center justify-center mx-auto mb-6">
                <iconify-icon icon="solar:heart-broken-linear" width="48"></iconify-icon>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">Votre liste de désirs est vide</h2>
            <p class="text-gray-500 mb-8 max-w-sm mx-auto">Laissez-vous séduire par nos pièces d'exception et
                enregistrez vos coups de cœur ici.</p>
            <a href="./catalog"
                class="inline-flex items-center gap-2 bg-gray-900 text-white px-8 py-3 rounded-2xl font-bold hover:bg-black transition-all">
                Voir le catalogue
            </a>
        </div>

        <!-- Favorites Grid -->
        <div id="favoritesGrid"
            class="product-grid grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6">
            <!-- Skeleton Grid -->
            <div class="fav-skeleton group bg-white rounded-2xl border border-gray-50 p-2 animate-pulse">
                <div class="aspect-square bg-gray-100 rounded-xl mb-4"></div>
                <div class="h-4 w-1/2 bg-gray-100 rounded mb-2"></div>
                <div class="h-3 w-1/4 bg-gray-100 rounded mb-4"></div>
                <div class="flex gap-2">
                    <div class="h-8 w-1/2 bg-gray-100 rounded-lg"></div>
                    <div class="h-8 w-1/2 bg-gray-100 rounded-lg"></div>
                </div>
            </div>
            <div class="fav-skeleton group bg-white rounded-2xl border border-gray-50 p-2 animate-pulse opacity-60">
                <div class="aspect-square bg-gray-100 rounded-xl mb-4"></div>
                <div class="h-4 w-3/4 bg-gray-100 rounded mb-2"></div>
                <div class="h-3 w-1/3 bg-gray-100 rounded mb-4"></div>
                <div class="flex gap-2">
                    <div class="h-8 w-1/2 bg-gray-100 rounded-lg"></div>
                    <div class="h-8 w-1/2 bg-gray-100 rounded-lg"></div>
                </div>
            </div>
            <div class="fav-skeleton group bg-white rounded-2xl border border-gray-50 p-2 animate-pulse opacity-40">
                <div class="aspect-square bg-gray-100 rounded-xl mb-4"></div>
                <div class="h-4 w-2/3 bg-gray-100 rounded mb-2"></div>
                <div class="h-3 w-1/4 bg-gray-100 rounded mb-4"></div>
                <div class="flex gap-2">
                    <div class="h-8 w-1/2 bg-gray-100 rounded-lg"></div>
                    <div class="h-8 w-1/2 bg-gray-100 rounded-lg"></div>
                </div>
            </div>
            <div class="fav-skeleton group bg-white rounded-2xl border border-gray-50 p-2 animate-pulse opacity-30">
                <div class="aspect-square bg-gray-100 rounded-xl mb-4"></div>
                <div class="h-4 w-1/2 bg-gray-100 rounded mb-2"></div>
                <div class="h-3 w-1/4 bg-gray-100 rounded mb-4"></div>
                <div class="flex gap-2">
                    <div class="h-8 w-1/2 bg-gray-100 rounded-lg"></div>
                    <div class="h-8 w-1/2 bg-gray-100 rounded-lg"></div>
                </div>
            </div>
        </div>
    </main>





    <script>
        // Use FavoritesManager from main.js but with this custom UI
        function buildProductHref(item) {
            const base =
                window.NewKetLinks?.buildProductPagePath
                    ? window.NewKetLinks.buildProductPagePath({
                        productName: item?.name,
                        productId: item?.id
                    })
                    : (
                        (window.ComponentLoader?.getAdjustedPath ? window.ComponentLoader.getAdjustedPath('pages/product') : null)
                        || (window.resolvePath ? window.resolvePath('pages/product') : null)
                        || '/src/pages/product.html'
                    );
            const baseStr = String(base || '/src/pages/product.html');
            return baseStr.includes('?')
                ? `${baseStr}&id=${encodeURIComponent(item?.id || '')}`
                : `${baseStr}?id=${encodeURIComponent(item?.id || '')}`;
        }

        function renderFavorites() {
            const grid = document.getElementById('favoritesGrid');
            const empty = document.getElementById('emptyState');
            const statusText = document.getElementById('fav-status');
            const skeletons = document.querySelectorAll('.fav-skeleton');
            const favs = window.FavoritesManager ? window.FavoritesManager.getFavorites() : [];

            if (!grid || !empty) return;

            // Clear skeletons
            skeletons.forEach(s => s.remove());

            if (favs.length === 0) {
                empty.classList.remove('hidden');
                grid.classList.add('hidden');
                if (statusText) statusText.textContent = "Aucun favori pour le moment";
                return;
            }

            if (statusText) statusText.textContent = "Gérez vos articles coups de cœur";
            empty.classList.add('hidden');
            grid.classList.remove('hidden');

            grid.innerHTML = favs.map(item => `
                ${(() => {
                    const oldPrice = item.oldPrice || item.old_price;
                    const hasPromo = oldPrice && Number(oldPrice) > Number(item.price);
                    const oldPriceText = hasPromo
                        ? (window.CurrencyManager ? CurrencyManager.formatPrice(oldPrice) : `${Number(oldPrice).toLocaleString()} FC`)
                        : '';
                    const discountPercent = hasPromo
                        ? Math.round(((Number(oldPrice) - Number(item.price)) / Number(oldPrice)) * 100)
                        : 0;
                    const cartImage = window.resolveProductImageSource
                        ? window.resolveProductImageSource(item)
                        : (window.getOptimizedImageUrl ? window.getOptimizedImageUrl(item.images || item.image || item.image_url || item.product_image || item.thumbnail || '') : (Array.isArray(item.images) ? item.images[0] : item.image || item.image_url || item.product_image || item.thumbnail || ''));
                    return `
                <div class="group bg-white rounded-2xl border border-gray-100 overflow-hidden card-shadow transition-all duration-300 relative flex flex-col">
                    <button onclick="removeFromFav('${item.id}')" data-track-action="favorites:remove_click" class="absolute top-4 right-4 z-10 w-10 h-10 bg-white/90 rounded-full flex items-center justify-center text-red-500 shadow-sm hover:bg-red-500 hover:text-white transition-all">
                        <iconify-icon icon="solar:heart-bold" width="20"></iconify-icon>
                    </button>
                    <a href="${buildProductHref(item)}" onclick="if(window.setProductSwipeContext) window.setProductSwipeContext(this);" class="block aspect-square bg-gray-50 flex items-center justify-center p-8 overflow-hidden">
                        <img src="${cartImage}"${window.buildResponsiveImageSrcSet ? ` srcset="${window.buildResponsiveImageSrcSet(cartImage, [120, 180, 240], { quality: 75 })}" sizes="(max-width: 640px) 50vw, 160px"` : ''} alt="${item.name}" loading="lazy" class="w-full h-full object-contain mix-blend-multiply group-hover:scale-110 transition-transform duration-500" onerror="this.src='https://res.cloudinary.com/dzhnphyp3/image/upload/f_auto,q_auto/v1782572380/newket_assets/frontend/src/assets/Images/default.jpg'">
                    </a>
                    <div class="p-4 sm:p-6 flex flex-col flex-1 h-full">
                        <div class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1 font-mono">${item.category}</div>
                        <h3 class="font-bold text-gray-900 mb-2 sm:mb-4 line-clamp-1 text-sm sm:text-base">
                            <a href="${buildProductHref(item)}" onclick="if(window.setProductSwipeContext) window.setProductSwipeContext(this);" class="hover:underline">${item.name}</a>
                        </h3>
                        <div class="mt-auto flex flex-col gap-2 sm:gap-3">
                            <div class="flex flex-col gap-1">
                                <span class="text-lg sm:text-xl font-black text-gray-900" data-price-cdf="${item.price}">${window.CurrencyManager ? CurrencyManager.formatPrice(item.price) : item.price + ' FC'}</span>
                                ${hasPromo ? `
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="old-price text-xs sm:text-sm font-semibold text-gray-400">${oldPriceText}</span>
                                        <span class="inline-flex items-center px-2.5 py-1 rounded-full bg-green-100 text-green-700 text-[10px] font-black uppercase tracking-[0.12em]">-${discountPercent}%</span>
                                    </div>
                                ` : ''}
                            </div>
                    <button onclick="if(window.CartManager) window.CartManager.add({id: '${item.id}', title: '${(item.name||'').replace(/'/g, `\\'`).replace(/\"/g, '&quot;')}', price: '${item.price}', image: '${String(cartImage || '').replace(/'/g, `\\'`).replace(/\"/g, '&quot;')}', vendor_id: '${item.user_id || item.users?.id || ''}', vendor: '${((item.users && (Array.isArray(item.users) ? item.users[0] : item.users))?.company_name || (item.users && (Array.isArray(item.users) ? item.users[0] : item.users))?.name || 'NewKet').replace(/'/g, `\\'`).replace(/\"/g, '&quot;')}'})" data-track-action="favorites:cart_click" class="add-to-cart-btn w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center justify-center gap-2 shadow-sm hover:shadow-md">
                                <iconify-icon icon="solar:cart-plus-bold" width="16" class="flex-shrink-0"></iconify-icon>
                                <span class="truncate">Ajouter</span>
                            </button>
                        </div>
                    </div>
                </div>
                    `;
                })()}
            `).join('');

            if (window.CurrencyManager) CurrencyManager.updateAllPrices();
        }

        function removeFromFav(id) {
            if (window.FavoritesManager) {
                window.FavoritesManager.removeItem(id);
                renderFavorites();
            }
        }

        function contactFromFav(id, btn) {
            if (window.contactSeller) window.contactSeller(id, btn);
        }

        document.getElementById('clearAllBtn').onclick = () => {
            showConfirm(
                'Tout effacer ?',
                'Êtes-vous sûr de vouloir supprimer tous vos articles favoris ? Cette action est irréversible.',
                () => {
                    window.FavoritesManager.clearAll();
                    renderFavorites();
                    showToast('Tous les favoris ont été effacés', 'info');
                }
            );
        };

        document.addEventListener('DOMContentLoaded', () => {
            if (window.newketInitialized) {
                renderFavorites();
            } else {
                window.addEventListener('newketInitialized', renderFavorites);
            }
        });
    </script>
    <script>
        window.NewKetPageRefresh = async () => {
            window.location.reload();
        };
    </script>
</body>

</html>
