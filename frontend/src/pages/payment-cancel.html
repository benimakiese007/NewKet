<!DOCTYPE html>
<html lang="fr" class="bg-[#f8fafc]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="theme-color" content="#013220">
    <title>Paiement annulé | NewKet</title>
    <meta name="description" content="Paiement annulé sur NewKet. Vous pouvez relancer votre commande à tout moment.">
    <script src="/vendor/iconify-preload.js"></script>
    <script src="/vendor/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="/src/services/app.js" type="module"></script>
    <link rel="stylesheet" href="/src/assets/css/input.css">
    <link rel="stylesheet" href="/src/assets/css/style.css">
    <link rel="stylesheet" href="/src/assets/css/responsive.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-premium {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
    
</head>
<body class="min-h-screen bg-[#f8fafc] text-gray-900 antialiased">
    <div id="header-placeholder"></div>
    <div class="fixed inset-0 -z-10 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-amber-50 via-transparent to-transparent opacity-70 pointer-events-none"></div>

    <main class="flex min-h-[70vh] items-center justify-center px-4 py-10 sm:px-6 sm:py-16 pt-24 sm:pt-28 lg:pt-32">
        <div class="w-full max-w-xl animate-in fade-in slide-in-from-bottom-8 duration-1000">
            <div class="glass-premium relative overflow-hidden rounded-[3rem] p-8 text-center shadow-[0_32px_64px_-16px_rgba(0,0,0,0.1)] sm:p-12">
                <div class="relative mx-auto mb-8 h-24 w-24">
                    <div class="absolute inset-0 rounded-full bg-amber-500/10 animate-ping duration-[2000ms]"></div>
                    <div class="relative flex h-full w-full items-center justify-center rounded-full bg-amber-500 text-white shadow-xl shadow-amber-500/20">
                        <iconify-icon icon="solar:danger-triangle-bold" width="48"></iconify-icon>
                    </div>
                </div>

                <h1 class="mb-4 text-3xl font-black tracking-tight text-gray-900 sm:text-4xl">Paiement interrompu</h1>
                <p class="mb-10 text-lg font-medium leading-relaxed text-gray-500">
                    Oups, il semblerait que le paiement n’ait pas pu aboutir. Pas d'inquiétude, votre commande est sauvegardée.
                </p>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <button onclick="window.history.back()" class="flex items-center justify-center gap-3 rounded-2xl border border-gray-200 bg-white px-8 py-4 text-sm font-black uppercase tracking-widest text-gray-900 shadow-sm transition-all hover:bg-gray-50 active:scale-[0.98]">
                        <iconify-icon icon="solar:refresh-circle-bold-duotone" width="20"></iconify-icon>
                        Réessayer
                    </button>
                    <a href="/src/pages/customer-dashboard.html#orders" class="flex items-center justify-center gap-3 rounded-2xl bg-black px-8 py-4 text-sm font-black uppercase tracking-widest text-white shadow-2xl shadow-black/20 transition-all hover:scale-[1.02] active:scale-[0.98]">
                        Mes commandes
                        <iconify-icon icon="solar:alt-arrow-right-linear" width="20"></iconify-icon>
                    </a>
                </div>
                <div class="mt-8 text-center">
                    <a href="/index.html" class="text-sm font-medium text-gray-400 hover:text-gray-900 transition-colors">Retour à l'accueil</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
