    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 999px;
        }

        .hero-gradient {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #333333 100%);
        }

        .hero-bg-image {
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('/Images/marketplace-hero.jpg');
            background-size: cover;
            background-position: center;
        }

        .card-hover:hover {
            transform: none !important;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.05);
        }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .img-zoom:hover img {
            transform: scale(1.05);
        }

        .img-zoom img {
            transition: transform 0.5s ease;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.8;
            }
        }

        .badge-pulse {
            animation: pulse 2s infinite;
        }

        @keyframes scroll {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .animate-scroll {
            animation: scroll 30s linear infinite;
        }

        .animate-scroll:hover {
            animation-play-state: paused;
        }

        .features-gradient-edge {
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        /* Shop Stats Styles */
        .stars-container {
            display: flex;
            gap: 2px;
            color: #fbbf24; /* Amber-400 */
        }

        .stat-badge {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .premium-accent {
            color: #000;
            position: relative;
        }

        .premium-accent::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 1px;
            background: currentColor;
            opacity: 0.2;
        }
    </style>
</head>

<body class="bg-white text-gray-900 antialiased">

    <!-- Mobile sidebar and overlays now in header component -->



    <main class="max-w-7xl mx-auto px-4 sm:px-6 pb-12 pt-6 md:pt-8">
        <div class="shops-hero mb-16 text-center">
            <h1 class="text-4xl sm:text-6xl font-black tracking-tight text-gray-900 mb-6 uppercase">Nos Maisons de Luxe
            </h1>
            <p class="text-gray-500 text-lg max-w-2xl mx-auto font-medium">L'élégance à travers nos partenaires
                d'exception. Chaque boutique est un univers de raffinement sélectionné pour vous.</p>

            <!-- Shop Search -->
            <div class="mt-10 max-w-xl mx-auto relative group">
                <div
                    class="flex items-center bg-gray-50 border border-gray-100 rounded-2xl overflow-hidden focus-within:bg-white focus-within:ring-4 focus-within:ring-gray-100 transition-all duration-500 p-1">
                    <label for="shopSearchInput" class="sr-only">Rechercher une boutique</label>
                    <input type="search" id="shopSearchInput" placeholder="Trouver une boutique..." autocomplete="off"
                        class="w-full py-3 px-4 bg-transparent text-sm outline-none placeholder-gray-400 font-bold"

                    aria-live="polite"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 lg:gap-8" id="shopsGrid">
            <!-- Loading Skeletons -->
            <div class="shop-card bg-white rounded-[2.5rem] p-8 border border-gray-100 flex flex-col items-center text-center gap-6 relative overflow-hidden">
                <div class="skeleton w-16 h-6 rounded-full self-start"></div>
                <div class="skeleton w-24 h-24 rounded-full"></div>
                <div class="w-full space-y-3 flex flex-col items-center">
                    <div class="skeleton h-6 w-3/4 rounded-xl"></div>
                    <div class="skeleton h-3 w-2/3 rounded-full"></div>
                    <div class="skeleton h-3 w-1/2 rounded-full"></div>
                </div>
                <div class="pt-6 border-t border-gray-50 w-full flex items-center justify-between">
                    <div class="space-y-2">

            </div>
            <div class="shop-card bg-white rounded-[2.5rem] p-8 border border-gray-100 flex flex-col items-center text-center gap-6 relative overflow-hidden">
                <div class="skeleton w-16 h-6 rounded-full self-start"></div>
                <div class="skeleton w-24 h-24 rounded-full"></div>
                <div class="w-full space-y-3 flex flex-col items-center">
                    <div class="skeleton h-6 w-3/4 rounded-xl"></div>
                    <div class="skeleton h-3 w-2/3 rounded-full"></div>
                    <div class="skeleton h-3 w-1/2 rounded-full"></div>
                </div>
                <div class="pt-6 border-t border-gray-50 w-full flex items-center justify-between">
                    <div class="space-y-2">
                        <div class="skeleton h-3 w-24 rounded-full"></div>
                        <div class="skeleton h-3 w-20 rounded-full"></div>
                    </div>
                    <div class="skeleton w-10 h-10 rounded-full"></div>
                </div>
            </div>
            <div class="shop-card bg-white rounded-[2.5rem] p-8 border border-gray-100 flex flex-col items-center text-center gap-6 relative overflow-hidden">
                <div class="skeleton w-16 h-6 rounded-full self-start"></div>
                <div class="skeleton w-24 h-24 rounded-full"></div>
                <div class="w-full space-y-3 flex flex-col items-center">
                    <div class="skeleton h-6 w-3/4 rounded-xl"></div>
                    <div class="skeleton h-3 w-2/3 rounded-full"></div>
                    <div class="skeleton h-3 w-1/2 rounded-full"></div>
                </div>
                <div class="pt-6 border-t border-gray-50 w-full flex items-center justify-between">
                    <div class="space-y-2">
                        <div class="skeleton h-3 w-24 rounded-full"></div>
                        <div class="skeleton h-3 w-20 rounded-full"></div>
                    </div>
                    <div class="skeleton w-10 h-10 rounded-full"></div>
                </div>
            </div>
            <div class="shop-card bg-white rounded-[2.5rem] p-8 border border-gray-100 flex flex-col items-center text-center gap-6 relative overflow-hidden">
                <div class="skeleton w-16 h-6 rounded-full self-start"></div>
                <div class="skeleton w-24 h-24 rounded-full"></div>
                <div class="w-full space-y-3 flex flex-col items-center">
                    <div class="skeleton h-6 w-3/4 rounded-xl"></div>

                <div class="pt-6 border-t border-gray-50 w-full flex items-center justify-between">

        <div id="noShopsMsg"
            class="hidden text-center py-32 bg-gray-50 rounded-[3rem] border border-dashed border-gray-200">
            <iconify-icon icon="solar:shop-2-linear" width="64" class="text-gray-200 mb-4"></iconify-icon>
            <p class="text-gray-400 font-bold uppercase tracking-widest">Aucune boutique n'a été trouvée</p>
                    <button onclick="document.getElementById('shopSearchInput').value=''; loadShops();" data-track-action="shops:clear_search_click"
                class="mt-4 text-xs font-black border-b-2 border-black pb-1 uppercase tracking-tighter">Réinitialiser la
                vue</button>
        </div>
    </main>





    <style>
        .shop-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08);
            border-color: #000;
        }

        .shop-card {
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        @media (hover: none) and (pointer: coarse) {
            .shop-card:hover {
                transform: none;
                box-shadow: none;
                border-color: rgb(243 244 246);
            }
        }

        #shopSearchInput::placeholder {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.7rem;
        }

        @media (max-width: 640px) {
            .shops-hero {
                margin-bottom: 3rem !important;
            }

            .shop-card {
                padding: 1.5rem !important;
                border-radius: 2rem !important;
            }
        }
    </style>
    <script>
        let allSellers = [];
        let shopStats = {};
        let searchDebounceId = null;

        function setResultsCountText(count, total) {
            const el = document.getElementById('shopsResultsCount');
            if (!el) return;

            if (count == null || total == null) {
                el.textContent = '';
                return;
            }

            if (count === total) el.textContent = `${total} boutique${total > 1 ? 's' : ''}`;
            else el.textContent = `${count} sur ${total} boutiques`;
        }

        async function loadShops() {
            const grid = document.getElementById('shopsGrid');
            const noShops = document.getElementById('noShopsMsg');
            const searchInput = document.getElementById('shopSearchInput');
            const query = searchInput.value.toLowerCase();

            try {
                if (typeof window.buildSkeletonShopCardHTML === 'function' && allSellers.length === 0) {
                    grid.innerHTML = window.buildSkeletonShopCardHTML(4);
                }

                if (!window.SupabaseAdapter) {
                    console.error('SupabaseAdapter not loaded');
                    grid.innerHTML = '';
                    noShops.classList.remove('hidden');
                    return;
                }

                // Initial load: Fetch sellers and their stats
                if (allSellers.length === 0) {
                    const [sellers, products, reviews, orders] = await Promise.all([
                        window.SupabaseAdapter.fetchWithFilters('users', {
                            in: [['role', ['vendor', 'supplier', 'fournisseur', 'seller']]],
                            order: ['date_joined', { ascending: false }],
                            limit: 100
                        }),
                        window.SupabaseAdapter.fetchWithFilters('products', { select: 'id, supplier_email' }),
                        window.SupabaseAdapter.fetchWithFilters('product_reviews', { select: 'product_id, rating' }),
                        window.SupabaseAdapter.fetchWithFilters('orders', { select: 'status, supplier_emails' })
                    ]);

                    allSellers = sellers || [];
                    
                    // Map products to their reviews
                    const productReviewsMap = {};
                    (reviews || []).forEach(r => {
                        if (!productReviewsMap[r.product_id]) productReviewsMap[r.product_id] = [];
                        productReviewsMap[r.product_id].push(r.rating);
                    });

                    // Aggregate stats per seller
                    shopStats = {};
                    allSellers.forEach(seller => {
                        const email = seller.email;
                        const sellerProducts = (products || []).filter(p => p.supplier_email === email);
                        const productIds = sellerProducts.map(p => p.id);
                        
                        // Calculate Rating
                        let totalRating = 0;
                        let ratingCount = 0;
                        productIds.forEach(pid => {
                            if (productReviewsMap[pid]) {
                                productReviewsMap[pid].forEach(rate => {
                                    totalRating += rate;
                                    ratingCount++;
                                });
                            }
                        });

                        // Calculate Sales (from orders where supplier_emails contains this seller)
                        const salesCount = (orders || []).filter(o => 
                            o.status !== 'Annulée' && 
                            (o.supplier_emails || []).includes(email)
                        ).length;

                        shopStats[email] = {
                            avgRating: ratingCount > 0 ? (totalRating / ratingCount).toFixed(1) : 0,
                            ratingCount: ratingCount,
                            salesCount: salesCount
                        };
                    });
                }

                let filteredSellers = allSellers;
                if (query) {
                    filteredSellers = allSellers.filter(s =>
                        (s.company_name || '').toLowerCase().includes(query) ||
                        (s.name || '').toLowerCase().includes(query) ||
                        (s.email || '').toLowerCase().includes(query)
                    );
                }

                if (filteredSellers.length === 0) {
                    grid.innerHTML = '';
                    noShops.classList.remove('hidden');
                    setResultsCountText(0, allSellers.length);
                    return;
                }

                noShops.classList.add('hidden');
                setResultsCountText(filteredSellers.length, allSellers.length);
                grid.innerHTML = filteredSellers.map(seller => {
                    const avatar = seller.avatar || ('https://ui-avatars.com/api/?name=' + encodeURIComponent(seller.company_name || seller.name || 'Vendor') + '&background=f3f4f6&color=000&bold=true');
                    const dateJoined = seller.date_joined ? new Date(seller.date_joined).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }) : 'récemment';
                    const shopName = seller.company_name || seller.name || 'Boutique sans nom';
                    const stats = shopStats[seller.email] || { avgRating: 0, ratingCount: 0, salesCount: 0 };
                    
                    // Rating HTML
                    let ratingHtml = '';
                    if (stats.ratingCount > 0) {
                        ratingHtml = `
                            <div class="flex items-center gap-2">
                                <div class="stars-container">
                                    ${Array.from({length: 5}).map((_, i) => `
                                        <iconify-icon icon="${i < Math.floor(stats.avgRating) ? 'solar:star-bold' : 'solar:star-linear'}" width="12"></iconify-icon>
                                    `).join('')}
                                </div>
                                <span class="text-[10px] font-black text-gray-900">${stats.avgRating}</span>
                            </div>
                        `;
                    } else {
                        ratingHtml = `
                            <div class="flex items-center gap-1 opacity-40">
                                <iconify-icon icon="solar:star-linear" width="12"></iconify-icon>
                                <span class="text-[9px] font-bold uppercase tracking-wider">Nouveau Partenaire</span>
                            </div>
                        `;
                    }

                    // Sales HTML
                    const salesText = stats.salesCount > 5 ? `${stats.salesCount}+ Ventes` : 
                                     stats.salesCount > 0 ? `${stats.salesCount} Ventes` : 
                                     'Boutique Certifiée';

                    return `
                        <a href="shop?email=${encodeURIComponent(seller.email)}" class="shop-card group bg-white rounded-[2.5rem] p-8 border border-gray-100 flex flex-col items-center text-center gap-6 relative overflow-hidden">
                            <div class="absolute top-6 left-6">
                                 <span class="px-2 py-1 bg-black text-white text-[8px] font-black uppercase tracking-widest rounded-full opacity-0 group-hover:opacity-100 transition-opacity">Premium</span>
                            </div>
                            
                            <div class="w-24 h-24 rounded-full bg-gray-50 overflow-hidden border-4 border-white shadow-lg group-hover:scale-105 transition-transform duration-500">
                                <img src="${avatar}" alt="${shopName}" loading="lazy" class="w-full h-full object-cover" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(shopName)}'">
                            </div>

                            <div class="space-y-3">
                                <h3 class="text-xl font-black text-gray-900 group-hover:text-black transition-colors leading-tight">${shopName}</h3>
                                
                                <div class="flex flex-col items-center gap-1">
                                    ${ratingHtml}
                                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.2em]">${seller.store_description ? seller.store_description.substring(0,30)+'...' : 'Partenaire de Luxe'}</p>
                                </div>
                            </div>

                            <div class="pt-6 border-t border-gray-50 w-full flex items-center justify-between">
                                <div class="flex flex-col items-start gap-0.5">
                                    <span class="text-[9px] text-gray-400 font-bold uppercase tracking-widest">Depuis ${dateJoined}</span>
                                    <span class="stat-badge premium-accent">
                                        <iconify-icon icon="solar:verified-check-bold" width="12" class="text-black"></iconify-icon>
                                        ${salesText}
                                    </span>
                                </div>
                                <div class="w-10 h-10 rounded-full bg-black text-white flex items-center justify-center translate-x-4 opacity-0 group-hover:translate-x-0 group-hover:opacity-100 transition-all duration-500 shadow-xl">
                                    <iconify-icon icon="solar:arrow-right-linear" width="20"></iconify-icon>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');

            } catch (err) {
                console.error('Erreur chargement boutiques:', err);
                grid.innerHTML = '';
                noShops.classList.remove('hidden');
                setResultsCountText(null, null);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('shopSearchInput');

            // Keep layout stable before data loads
            setResultsCountText(null, null);

            searchInput.addEventListener('input', () => {
                if (searchDebounceId) window.clearTimeout(searchDebounceId);
                searchDebounceId = window.setTimeout(loadShops, 150);
            });
            searchInput.addEventListener('search', loadShops);

            if (window.newketInitialized) {
                loadShops();
            } else {
                window.addEventListener('newketInitialized', loadShops);
            }
        });
    </script>
</body>

</html>
