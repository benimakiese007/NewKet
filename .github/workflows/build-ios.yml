name: Build iOS App (Unsigned)

on:
  workflow_dispatch:
    inputs:
      xcode_version:
        description: 'Version de Xcode (ex: latest-stable, 16.2, 16.1, 16.0)'
        required: true
        default: 'latest-stable'
        type: choice
        options:
          - 'latest-stable'
          - '16.2'
          - '16.1'
          - '16.0'

jobs:
  build-ios:
    runs-on: macos-15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode_version || 'latest-stable' }}

      - name: Verification SDK iOS
        run: |
          xcodebuild -showsdks | grep -E "iphoneos|iphonesimulator" || true
          xcrun --sdk iphoneos --show-sdk-version || true
          xcodebuild -version

      - name: Telechargement de la plateforme iOS (Xcode Components)
        run: |
          echo "Verification et telechargement du runtime iOS..."
          for i in 1 2 3; do
            echo "Tentative $i/3..."
            if xcodebuild -downloadPlatform iOS; then
              echo "Telechargement reussi."
              break
            elif sudo xcodebuild -downloadPlatform iOS; then
              echo "Telechargement avec sudo reussi."
              break
            fi
            echo "Nouvelle tentative dans 5s..."
            sleep 5
          done
          xcrun simctl list runtimes || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installation des dependances
        run: npm install
        working-directory: ./frontend

      - name: Creation du fichier .env
        run: |
          echo "VITE_SUPABASE_URL=https://kuygjocnnlvjtoaquicq.supabase.co" > .env
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1eWdqb2Nubmx2anRvYXF1aWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNDM2NjYsImV4cCI6MjA4NjkxOTY2Nn0.1qyGb91CbLeSRNWKUNGiToJYGr8lsI-DeddWTnMv3SY" >> .env
          echo "VITE_APP_ENV=production" >> .env
        working-directory: ./frontend

      - name: Compilation du site Web (Vite)
        run: npm run build
        working-directory: ./frontend

      - name: Synchronisation Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string newket" ios/App/App/Info.plist 2>/dev/null || true
          echo "URL scheme newket:// ajoute a Info.plist"
          /usr/libexec/PlistBuddy -c "Set :UIDesignRequiresCompatibility false" ios/App/App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :UIDesignRequiresCompatibility bool false" ios/App/App/Info.plist 2>/dev/null || true
          python3 -c "import plistlib; p_path='ios/App/App/Info.plist'; f=open(p_path,'rb'); d=plistlib.load(f); f.close(); modes=d.get('UIBackgroundModes',[]); modes.append('voip') if 'voip' not in modes else None; d['UIBackgroundModes']=modes; f=open(p_path,'wb'); plistlib.dump(d,f); f.close(); print('voip configure dans UIBackgroundModes')"
          echo "UIDesignRequiresCompatibility=false verifie pour Liquid Glass"
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'NewKet utilise Face ID pour vous connecter rapidement et en toute sécurité.'" ios/App/App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription 'NewKet utilise Face ID pour vous connecter rapidement et en toute sécurité.'" ios/App/App/Info.plist 2>/dev/null || true
          echo "NSFaceIDUsageDescription ajoute a Info.plist"
        working-directory: ./frontend

      - name: Build Xcode (Sans signature)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            SYMROOT=$(PWD)/build_ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p build_ios/Release-iphoneos/App.app/PlugIns
          if [ -d "build_ios/Release-iphoneos/NewKetWidgetExtension.appex" ]; then
            echo "Copie de NewKetWidgetExtension.appex dans App.app/PlugIns/..."
            cp -r "build_ios/Release-iphoneos/NewKetWidgetExtension.appex" "build_ios/Release-iphoneos/App.app/PlugIns/"
          fi

          if [ -d "build_ios/Release-iphoneos/App.app/PlugIns/NewKetWidgetExtension.appex" ]; then
            echo "Widget Extension valide dans App.app/PlugIns/NewKetWidgetExtension.appex"
            ls -la "build_ios/Release-iphoneos/App.app/PlugIns/NewKetWidgetExtension.appex"
          else
            echo "Widget Extension toujours introuvable. Contenu de build_ios/Release-iphoneos/ :"
            ls -la build_ios/Release-iphoneos/
          fi
        working-directory: ./frontend

      - name: Creation du fichier .ipa
        run: |
          mkdir -p Payload
          cp -r build_ios/Release-iphoneos/App.app Payload/
          zip -r NewKet-iOS.ipa Payload
          echo "Taille IPA: $(du -sh NewKet-iOS.ipa | cut -f1)"
        working-directory: ./frontend

      - name: Mise a disposition de l IPA
        uses: actions/upload-artifact@v4
        with:
          name: NewKet-iOS-App
          path: frontend/NewKet-iOS.ipa
          retention-days: 7
