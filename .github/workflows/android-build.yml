name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - 'debug'
          - 'release'
      publish_release:
        description: 'Publier une GitHub Release (release uniquement)'
        required: false
        default: false
        type: boolean
      tag_name:
        description: 'Tag de la release (ex: v1.0.73) — requis si publish_release=true'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Notes de mise à jour (Markdown) affichées dans la release'
        required: false
        default: 'Améliorations de performance et corrections de bugs.'
        type: string

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Installation des dependances npm
        run: npm install
        working-directory: ./frontend

      - name: Creation du fichier .env
        run: |
          echo "VITE_SUPABASE_URL=https://kuygjocnnlvjtoaquicq.supabase.co" > .env
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1eWdqb2Nubmx2anRvYXF1aWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNDM2NjYsImV4cCI6MjA4NjkxOTY2Nn0.1qyGb91CbLeSRNWKUNGiToJYGr8lsI-DeddWTnMv3SY" >> .env
          echo "VITE_APP_ENV=production" >> .env
        working-directory: ./frontend

      - name: Compilation Vite (frontend)
        run: npm run build
        working-directory: ./frontend

      - name: Synchronisation Capacitor Android
        run: |
          npx cap sync android
        working-directory: ./frontend

      - name: Permissions Gradle wrapper
        run: chmod +x frontend/android/gradlew

      # ── Build Debug ───────────────────────────────────────────────────────────
      - name: Build APK Debug
        if: inputs.build_type == 'debug'
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: ./frontend/android

      # ── Préparation du Keystore pour le build Release ─────────────────────────
      # Le keystore n'est JAMAIS stocké dans le dépôt. Il est reconstruit depuis
      # le secret GitHub ANDROID_KEYSTORE_BASE64 dans un fichier temporaire.
      - name: Restauration du Keystore depuis les secrets GitHub
        if: inputs.build_type == 'release'
        run: |
          # Déposer le keystore dans frontend/android/app/ (là où Gradle le résout par défaut)
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/app/newket-release.jks
          # keystore.properties est lu depuis frontend/android/ (rootProject)
          # storeFile est relatif au dossier app/ donc on remonte d'un niveau
          cat > frontend/android/keystore.properties << 'EOF'
          storeFile=../app/newket-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build APK Release signé
        if: inputs.build_type == 'release'
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: ./frontend/android

      # Supprimer le keystore immédiatement après le build (sécurité)
      - name: Nettoyage sécurisé du Keystore temporaire
        if: inputs.build_type == 'release'
        run: |
          rm -f frontend/android/app/newket-release.jks
          rm -f frontend/android/keystore.properties

      # ── Nommage et SHA-256 (release uniquement) ──────────────────────────────
      - name: Localisation et renommage de l'APK Release
        if: inputs.build_type == 'release'
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="v$(date +'%Y%m%d-%H%M')"
          fi
          APK_SRC=$(find frontend/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          APK_DEST="NewKet-${TAG}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "APK_PATH=$APK_DEST" >> $GITHUB_ENV
          echo "APK_TAG=$TAG"       >> $GITHUB_ENV
          echo "APK generé : $APK_DEST ($(du -sh "$APK_DEST" | cut -f1))"

      - name: Calcul du SHA-256 de l'APK Release
        if: inputs.build_type == 'release'
        run: |
          sha256sum "${{ env.APK_PATH }}" | awk '{print $1}' > "${{ env.APK_PATH }}.sha256"
          echo "SHA256=$(cat ${{ env.APK_PATH }}.sha256)" >> $GITHUB_ENV
          echo "Empreinte SHA-256 : $(cat ${{ env.APK_PATH }}.sha256)"

      # ── Upload artefact (toujours, pour les deux types de build) ─────────────
      - name: Upload APK Debug (artefact)
        if: inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: NewKet-Android-Debug
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload APK Release signé (artefact)
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: NewKet-Android-Release-${{ inputs.tag_name || 'draft' }}
          path: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
          retention-days: 30

      # ── Création de la GitHub Release (optionnel, sur autorisation explicite) ─
      - name: Création de la GitHub Release officielle
        if: inputs.build_type == 'release' && inputs.publish_release == true && inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: "NewKet ${{ inputs.tag_name }}"
          body: |
            ## 🚀 NewKet ${{ inputs.tag_name }}

            ${{ inputs.release_notes }}

            ---
            **Empreinte SHA-256** : `${{ env.SHA256 }}`

            > Mise à jour disponible directement depuis l'application NewKet → Paramètres → Mise à jour.
          files: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Résumé du build
        run: |
          echo "## 📦 Build Android terminé" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Paramètre | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Type | ${{ inputs.build_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ inputs.tag_name || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release publiée | ${{ inputs.publish_release }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.build_type }}" = "release" ]; then
            echo "| SHA-256 | \`${{ env.SHA256 }}\` |" >> $GITHUB_STEP_SUMMARY
          fi
