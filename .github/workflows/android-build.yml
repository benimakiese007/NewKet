name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - 'debug'
          - 'release'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Installation des dependances npm
        run: npm install
        working-directory: ./frontend

      - name: Creation du fichier .env
        run: |
          echo "VITE_SUPABASE_URL=https://kuygjocnnlvjtoaquicq.supabase.co" > .env
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1eWdqb2Nubmx2anRvYXF1aWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNDM2NjYsImV4cCI6MjA4NjkxOTY2Nn0.1qyGb91CbLeSRNWKUNGiToJYGr8lsI-DeddWTnMv3SY" >> .env
          echo "VITE_APP_ENV=production" >> .env
        working-directory: ./frontend

      - name: Compilation Vite (frontend)
        run: npm run build
        working-directory: ./frontend

      - name: Synchronisation Capacitor Android
        run: |
          npx cap sync android
        working-directory: ./frontend

      - name: Permissions Gradle wrapper
        run: chmod +x frontend/android/gradlew

      - name: Build APK Debug
        if: inputs.build_type == 'debug'
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: ./frontend/android

      - name: Build APK Release (non signe)
        if: inputs.build_type == 'release'
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: ./frontend/android

      - name: Localisation de l APK
        run: |
          echo "APKs generes :"
          find frontend/android/app/build/outputs/apk -name "*.apk" | while read f; do
            echo "  $f ($(du -sh "$f" | cut -f1))"
          done

      - name: Upload APK Debug
        if: inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: NewKet-Android-Debug
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload APK Release
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: NewKet-Android-Release
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
