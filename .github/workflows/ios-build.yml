name: Build iOS App (Unsigned)

on:
  workflow_dispatch: # Permet de lancer le build manuellement depuis GitHub

jobs:
  build-ios:
    # macos-15 + Xcode 26 beta = iOS 26 SDK requis pour UIGlassEffect (Liquid Glass)
    # Quand macos-26 sera stable sur GitHub, remplacer par runs-on: macos-26
    runs-on: macos-15
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v7

      - name: 🍎 Setup Xcode 26 (iOS 26 SDK — requis pour Liquid Glass)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 📦 Installation des dépendances
        run: npm install
        working-directory: ./frontend

      - name: 🔑 Création du fichier .env
        run: |
          echo "VITE_SUPABASE_URL=https://kuygjocnnlvjtoaquicq.supabase.co" > .env
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1eWdqb2Nubmx2anRvYXF1aWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNDM2NjYsImV4cCI6MjA4NjkxOTY2Nn0.1qyGb91CbLeSRNWKUNGiToJYGr8lsI-DeddWTnMv3SY" >> .env
          echo "VITE_APP_ENV=production" >> .env
        working-directory: ./frontend

      - name: 🛠️ Compilation du site Web (Vite)
        run: npm run build
        working-directory: ./frontend

      - name: 🔄 Synchronisation Capacitor iOS
        run: |
          npx cap add ios || true
          # The iOS splash assets are curated in ios/App/App/Assets.xcassets.
          # Do not regenerate them here: Capacitor Assets would replace the
          # fixed-size launch logo with its generic, small splash composition.
          npx cap sync ios
          # Inject custom URL scheme "newket://" for Google OAuth deep-link redirect
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string newket" ios/App/App/Info.plist 2>/dev/null || true
          echo "✅ URL scheme 'newket://' ajouté à Info.plist"
        working-directory: ./frontend

      - name: 🍎 Build Xcode (Sans signature)
        run: |
          # On compile le projet iOS généré par Capacitor (SPM)
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=$(PWD)/build_ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: ./frontend

      - name: 📦 Création du fichier .ipa
        run: |
          mkdir -p Payload
          # Copier l'application compilée dans le dossier Payload
          cp -r build_ios/Release-iphoneos/App.app Payload/
          # Ziper le tout au format IPA
          zip -r NewKet-iOS.ipa Payload
        working-directory: ./frontend

      - name: 📤 Mise à disposition de l'IPA
        uses: actions/upload-artifact@v7
        with:
          name: NewKet-iOS-App
          path: frontend/NewKet-iOS.ipa
          retention-days: 7
