name: Build iOS App (Unsigned)

on:
  workflow_dispatch: # Permet de lancer le build manuellement depuis GitHub

jobs:
  build-ios:
    runs-on: macos-latest # GitHub nous prête un Mac !
    
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Installation des dépendances
        run: npm install
        working-directory: ./frontend

      - name: 🔑 Création du fichier .env
        run: |
          echo "VITE_SUPABASE_URL=https://kuygjocnnlvjtoaquicq.supabase.co" > .env
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1eWdqb2Nubmx2anRvYXF1aWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNDM2NjYsImV4cCI6MjA4NjkxOTY2Nn0.1qyGb91CbLeSRNWKUNGiToJYGr8lsI-DeddWTnMv3SY" >> .env
          echo "VITE_APP_ENV=production" >> .env
        working-directory: ./frontend

      - name: 🛠️ Compilation du site Web (Vite)
        run: npm run build
        working-directory: ./frontend

      - name: 🔄 Synchronisation Capacitor iOS
        run: |
          npx cap add ios || true
          npx @capacitor/assets generate --ios
          npx cap sync ios
        working-directory: ./frontend

      - name: 🍎 Build Xcode (Sans signature)
        run: |
          # On compile le projet iOS généré par Capacitor (SPM)
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=$(PWD)/build_ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: ./frontend

      - name: 📦 Création du fichier .ipa
        run: |
          mkdir -p Payload
          # Copier l'application compilée dans le dossier Payload
          cp -r build_ios/Release-iphoneos/App.app Payload/
          # Ziper le tout au format IPA
          zip -r NewKet-iOS.ipa Payload
        working-directory: ./frontend

      - name: 📤 Mise à disposition de l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: NewKet-iOS-App
          path: frontend/NewKet-iOS.ipa
          retention-days: 7
